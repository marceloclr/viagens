<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Viagens - Gerador de Roteiros de Viagens — v2.0</title>
    <style>
        /* =====================================================================
           TEMA — claro por padrão; :root[data-tema="escuro"] sobrescreve.
           Sem escolha salva em localStorage, o motor aplica "claro" mesmo que
           o sistema operacional prefira escuro — decisão deliberada (ver
           Tema.aplicar()), não uma prefers-color-scheme esquecida. Todo o
           restante da folha de estilos lê só os tokens abaixo; nenhuma regra
           fora deste bloco declara cor fixa (ver --field-bg/--line-forte
           para por que campo de formulário e página não podem ter quase a
           mesma cor de fundo). */
        :root {
            --radius: 10px;
            --shadow: 0 1px 2px rgba(22,35,47,.07), 0 10px 26px rgba(22,35,47,.08);
            --sidebar-w: 280px;
            --topbar-h: 84px;
            --transition-fast: 220ms cubic-bezier(.19,1,.22,1);
            --ease-soft: cubic-bezier(.22,.61,.36,1);

            /* Paleta base — CLARO (padrão) */
            --bg: #f6f8fa;
            --bg-alt: #ffffff;
            --field-bg: #ffffff;
            --popover-bg: #ffffff;
            --table-head-bg: #eef2f5;
            --toc-hover-bg: #eef2f5;
            --glyph-a: #eef2f5;
            --glyph-b: #ffffff;
            --ink: #16232f;
            --ink-strong: #0d161e;
            --muted: #55697d;
            --line: #dde4ea;           /* divisor decorativo — não precisa de 3:1 */
            --border: #dde4ea;
            --line-forte: #71889a;     /* borda de campo/controle — cruza 3:1 (WCAG 1.4.11) */
            --accent: #0f7d72;       /* Teal */
            --accent-fill: #0f7d72;
            --accent2: #9a5b0a;      /* Âmbar */
            --accent2-fill: #9a5b0a;
            --accent3: #c23c40;      /* Coral */
            --accent3-fill: #c23c40;
            --navy: #35659c;         /* Azul informativo */
            --navy-fill: #35659c;
            --brown: #855420;
            --olive: #6c7429;
            --on-accent: #ffffff;    /* texto sobre --accent/--accent-fill sólido */
            --on-accent2: #ffffff;   /* texto sobre --accent2/--accent2-fill sólido */
        }
        :root[data-tema="escuro"] {
            --shadow: 0 6px 24px rgba(0,0,0,.35);

            /* Paleta base — ESCURO */
            --bg: #0b1520;
            --bg-alt: #101f2e;
            --field-bg: #182c40;
            --popover-bg: #0a1622;
            --table-head-bg: #0e2130;
            --toc-hover-bg: #152838;
            --glyph-a: #17324a;
            --glyph-b: #0c1a27;
            --ink: #dce8f0;
            --ink-strong: #ffffff;
            --muted: #7fa0b8;
            --line: #22405a;
            --border: #22405a;
            --line-forte: #4178a3;
            --accent: #4fd1c5;
            --accent-fill: #0e6e64;
            --accent2: #f2b134;
            --accent2-fill: #a8730f;
            --accent3: #ef767a;
            --accent3-fill: #a83f43;
            --navy: #7fb0e8;
            --navy-fill: #2c4a72;
            --brown: #c98a4b;
            --olive: #b5b96a;
            --on-accent: #04211e;
            --on-accent2: #241a05;
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background: var(--bg);
            color: var(--ink);
            overflow: hidden;
            transition: background .2s var(--ease-soft), color .2s var(--ease-soft);
        }

        /* ===================== TOPBAR ===================== */
        .topbar {
            min-height: var(--topbar-h);
            height: auto;
            flex: 0 0 auto;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 10px 22px;
            background: var(--bg-alt);
            border-bottom: 1px solid var(--line);
            position: sticky;
            top: 0;
            z-index: 50;
        }
        /* Identidade: nome do roteiro (destinos) + módulo atual, empilhados à esquerda,
           num bloco isolado dos botões de ação — assim uma lista maior de destinos nunca
           deforma Recalcular/Limpar/Exportar, que ficam num grupo à parte, à direita. */
        .topbar-identity {
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            min-width: 0;
            flex: 1 1 auto;
        }
        .topbar-brand {
            display: flex;
            flex-direction: column;
            gap: 2px;
            font-weight: 800;
            font-size: 17px;
            color: var(--ink-strong);
            min-width: 0;
        }
        /* A lista de destinos pode quebrar em até 2 linhas quando há muitos; a linha de
           dias/datas/viajantes fica sempre visível abaixo, nunca cortada pelo clamp. */
        .topbar-brand .brand-destinos {
            white-space: normal; overflow-wrap: break-word;
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
        .topbar-brand small {
            font-weight: 400;
            font-size: 12.5px;
            color: var(--muted);
            letter-spacing: .02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .topbar-actions {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-left: auto;
            flex: 0 0 auto;
        }
        .topbar-actions, .topbar-actions * { flex-shrink: 0; }
        .step-counter {
            font-family: Consolas, monospace; font-size: 11px; color: var(--muted);
            border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px;
            white-space: nowrap; letter-spacing: .06em; align-self: flex-start;
        }
        .step-counter b { color: var(--accent); font-weight: 800; }

        /* Alternador de tema: claro por padrão (ver script no <head>), com a
           escolha persistida em localStorage. */
        .btn-tema {
            appearance: none; cursor: pointer; border: 1px solid var(--border);
            background: transparent; color: var(--ink);
            width: 38px; height: 38px; border-radius: 50%; font-size: 16px;
            display: flex; align-items: center; justify-content: center; flex: none;
            transition: var(--transition-fast);
        }
        .btn-tema:hover { border-color: var(--muted); transform: translateY(-1px); }
        .btn-tema:focus-visible { outline: none; box-shadow: var(--focus-ring); }

        .btn-exportar {
            appearance: none;
            border: 1px solid var(--accent2);
            background: transparent;
            color: var(--accent2);
            padding: 9px 16px;
            border-radius: 999px;
            font-size: 13.5px;
            font-weight: 700;
            cursor: pointer;
            transition: var(--transition-fast);
            white-space: nowrap;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-exportar:hover { background: var(--accent2); color: var(--on-accent2); transform: translateY(-1px); }
        .btn-exportar:active { transform: translateY(0); }

        /* ===================== SELETOR DE ROTEIRO ===================== */
        .route-switch {
            display: inline-flex; border: 1px solid var(--border); border-radius: 999px;
            padding: 3px; background: color-mix(in srgb, var(--bg-alt) 70%, transparent); gap: 3px;
        }
        .route-switch button {
            appearance: none; cursor: pointer; border: none; background: transparent; color: var(--muted);
            font-size: 12.5px; font-weight: 700; padding: 7px 13px; border-radius: 999px;
            transition: var(--transition-fast); white-space: nowrap;
        }
        .route-switch button.is-active { background: var(--accent); color: var(--on-accent); }
        .route-switch button:not(.is-active):hover { color: var(--ink); background: color-mix(in srgb, var(--accent) 10%, transparent); }


        /* Seletor global de entrada: a escolha Roma/Paris fica sempre visível. */
        .topbar-route { margin-left: 8px; }
        .topbar-route .route-switch { transform: translateY(-1px); }
        @media (max-width: 980px) {
            .topbar { gap: 10px; padding: 0 12px; }
            .topbar-brand small { display: none; }
            .topbar-route { order: 3; width: 100%; margin-left: 0; }
            .topbar { flex-wrap: wrap; height: auto; min-height: var(--topbar-h); padding-top: 8px; padding-bottom: 8px; }
            .topbar-actions { margin-left: auto; }
        }

        /* Linha de total nas grades de valor */
        tr.tr-total td { background: color-mix(in srgb, var(--accent) 9%, transparent) !important; border-top: 2px solid var(--accent-fill); font-weight: 800; color: var(--ink-strong); }
        tr.tr-total td:first-child { color: var(--accent); }

        /* Aviso de composição de preço em hospedagem */
        .price-scope {
            display: block; font-size: 9.5px; font-weight: 700; letter-spacing: .03em;
            color: var(--bg); background: var(--accent2); border-radius: 4px; padding: 1px 6px;
            margin-top: 3px; text-align: center; text-transform: uppercase;
        }

        /* Destaque de espera entre trechos de voo */
        .layover {
            display: flex; align-items: center; gap: 10px; margin: 2px 0 2px 14px; padding: 7px 14px;
            border-left: 2px dashed var(--accent2-fill); font-size: 12px; color: var(--muted);
        }
        .layover b { color: var(--accent2); font-weight: 800; }
        .layover .layover-icon { font-size: 14px; }

        /* Cards de destaque do resumo */
        .highlight-strip { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-top: 16px; }
        .highlight-card {
            position: relative;
            background: var(--bg-alt); border: 1px solid var(--border); border-radius: 10px;
            padding: 13px 14px; text-align: center;
            transition: transform .26s var(--ease-soft), border-color .26s var(--ease-soft);
        }
        .highlight-card:hover { transform: translateY(-3px); border-color: var(--accent); z-index: 5; }
        .highlight-card .hg { font-size: 26px; display: block; margin-bottom: 6px; }
        .highlight-card .hn { font-size: 13px; font-weight: 800; color: var(--ink-strong); }
        .highlight-card .hd { font-size: 10.5px; color: var(--accent2); font-weight: 700; margin-top: 3px; letter-spacing: .03em; }

        /* Painel financeiro */
        .finance-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; margin-top: 16px; }
        .finance-card {
            background: linear-gradient(160deg, color-mix(in srgb, var(--bg-alt) 95%, transparent), color-mix(in srgb, var(--bg) 95%, transparent));
            border: 1px solid var(--border); border-top: 3px solid var(--accent); border-radius: 11px; padding: 15px 17px;
        }
        .finance-card .fl { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 700; }
        .finance-card .fv { font-size: 19px; font-weight: 800; color: var(--ink-strong); margin-top: 5px; }
        .finance-card .fv small { font-size: 12px; color: var(--accent2); font-weight: 700; }
        .finance-card .fs { font-size: 11.5px; color: var(--muted); margin-top: 4px; }

        /* Barra de progresso da navegação horizontal */
        .progress-rail {
            position: absolute; left: 0; right: 0; bottom: -1px; height: 2px;
            background: color-mix(in srgb, var(--muted) 14%, transparent); overflow: hidden;
        }
        .progress-fill {
            height: 100%; width: 0;
            background: linear-gradient(90deg, var(--accent), var(--accent2));
            box-shadow: 0 0 10px color-mix(in srgb, var(--accent) 50%, transparent);
            transition: width 160ms linear;
        }

        /* ===================== SHELL ===================== */
        .shell { flex: 1 1 auto; display: flex; min-height: 0; position: relative; }
        .toc {
            width: var(--sidebar-w);
            flex: 0 0 auto;
            padding: 20px 14px;
            overflow-y: auto;
            border-right: 1px solid var(--line);
            background: var(--bg-alt);
            position: sticky;
            top: var(--topbar-h);
            align-self: flex-start;
            height: calc(100vh - var(--topbar-h));
        }
        .toc .toc-title {
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: .12em;
            color: var(--muted);
            margin: 4px 8px 10px;
        }
        .toc a {
            display: block;
            padding: 8px 10px;
            border-radius: 7px;
            color: var(--muted);
            text-decoration: none;
            font-size: 13.5px;
            margin-bottom: 3px;
            border-left: 2px solid transparent;
            transition: background .18s var(--ease-soft), color .18s var(--ease-soft),
                        border-color .18s var(--ease-soft), padding-left .22s var(--ease-soft);
        }
        .toc a:hover { background: var(--toc-hover-bg); color: var(--ink-strong); padding-left: 15px; }
        .toc a.active { background: var(--toc-hover-bg); color: var(--ink-strong); border-left-color: var(--accent); padding-left: 15px; }

        main.content {
            flex: 1 1 auto;
            min-width: 0;
            height: calc(100vh - var(--topbar-h));
            display: flex;
            flex-direction: row;
            overflow-x: auto;
            overflow-y: hidden;
            scroll-snap-type: x proximity;
            -webkit-overflow-scrolling: touch;
            scrollbar-width: thin;
            scrollbar-color: var(--line) transparent;
            background-color: var(--bg);
            color: var(--ink);
            background-image:
                linear-gradient(var(--line) 1px, transparent 1px),
                linear-gradient(to right, var(--line) 1px, transparent 1px);
            background-size: 34px 34px;
            background-attachment: local;
        }
        main.content::-webkit-scrollbar { height: 10px; }
        main.content::-webkit-scrollbar-thumb { background: var(--line); border-radius: 6px; }

        section {
            flex: 0 0 100%;
            width: 100%;
            max-width: 100%;
            height: 100%;
            margin: 0;
            padding: 40px clamp(20px, 6vw, 80px) 70px;
            overflow-y: auto;
            scroll-snap-align: start;
            border-left: 1px solid var(--line);
            background: color-mix(in srgb, var(--bg) 65%, transparent);
            position: relative;
        }
        section:first-child { border-left: none; }
        section > * { max-width: 980px; }

        /* ===================== TIPOGRAFIA ===================== */
        h1 { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 28px; color: var(--ink-strong); margin: 0 0 8px; letter-spacing: -.01em; }
        h2 { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 20px; color: var(--accent); margin: 24px 0 16px; display: flex; align-items: center; gap: 10px; }
        h3 { font-family: Consolas, "SFMono-Regular", Menlo, monospace; font-size: 15px; color: var(--ink-strong); margin: 18px 0 8px; }
        p, li { line-height: 1.6; font-size: 14.5px; color: var(--ink); }

        .eyebrow {
            display: inline-block;
            font-family: Consolas, monospace;
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--accent);
            border: 1px solid var(--accent);
            padding: 3px 10px;
            border-radius: 3px;
            margin-bottom: 14px;
        }
        .lede { font-size: 15.5px; color: var(--muted); max-width: 74ch; }

        /* Marcador de valor calculado — sempre acompanhado de tooltip */
        .calc {
            border-bottom: 1px dotted var(--accent2);
            cursor: help;
        }

        /* ===================== CARDS & GRIDS ===================== */
        .ind-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-top: 16px; }
        .ind-card {
            position: relative;
            background: var(--bg-alt); border: 1px solid var(--border); border-left-width: 5px;
            border-radius: 8px; padding: 14px 16px;
            transition: transform .28s var(--ease-soft), box-shadow .28s var(--ease-soft), border-color .28s var(--ease-soft);
        }
        .ind-card:hover { transform: translateY(-3px); box-shadow: 0 10px 26px rgba(0,0,0,.34); z-index: 5; }
        .ind-card .lbl { font-size: 12px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .04em; }
        .ind-card .desc { font-size: 14px; font-weight: bold; margin-top: 4px; color: var(--ink-strong); }

        .ind-blue { border-left-color: var(--navy); }
        .ind-gold { border-left-color: var(--accent2); }
        .ind-teal { border-left-color: var(--accent); }
        .ind-coral { border-left-color: var(--accent3); }
        .ind-olive { border-left-color: var(--olive); }
        .ind-brown { border-left-color: var(--brown); }

        /* ===================== TABELAS ===================== */
        table.tbl-sejud { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 13.5px; background: var(--bg-alt); border-radius: var(--radius); overflow: hidden; border: 1px solid var(--border); }
        table.tbl-sejud th { background: var(--table-head-bg); color: var(--accent); text-align: left; padding: 10px 12px; font-family: Consolas, monospace; font-size: 12px; border-bottom: 2px solid var(--line); }
        table.tbl-sejud td { padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: top; color: var(--ink); }
        table.tbl-sejud tr { transition: background .2s var(--ease-soft); }
        table.tbl-sejud tr:hover td { background: color-mix(in srgb, var(--accent) 7%, transparent); }

        /* ===================== CHIPS ===================== */
        .chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; margin: 2px 4px 2px 0; }
        .chip-day { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); border: 1px solid var(--accent); }
        .chip-cost { background: color-mix(in srgb, var(--accent2) 15%, transparent); color: var(--accent2); border: 1px solid var(--accent2); }
        .chip-youth { background: color-mix(in srgb, var(--accent3) 15%, transparent); color: var(--accent3); border: 1px solid var(--accent3); }
        .chip-faith { background: color-mix(in srgb, var(--navy) 15%, transparent); color: var(--navy); border: 1px solid var(--navy); }
        .chip-star { background: color-mix(in srgb, var(--olive) 15%, transparent); color: var(--olive); border: 1px solid var(--olive); }
        .chip-cat-alta_velocidade { background: color-mix(in srgb, var(--accent) 15%, transparent); color: var(--accent); border: 1px solid var(--accent); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
        .chip-cat-regional { background: color-mix(in srgb, var(--navy) 12%, transparent); color: var(--navy); border: 1px solid var(--navy); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }

        /* ===================== CALLOUTS ===================== */
        .callout { border-radius: 8px; padding: 14px 18px; font-size: 14px; line-height: 1.55; margin: 16px 0; }
        .callout-dica { background: color-mix(in srgb, var(--accent) 10%, transparent); border-left: 4px solid var(--accent); }
        .callout-atencao { background: color-mix(in srgb, var(--accent2) 12%, transparent); border-left: 4px solid var(--accent2); }
        .callout-nota { background: color-mix(in srgb, var(--navy) 10%, transparent); border-left: 4px solid var(--navy); }

        /* ===================== TIMELINE ===================== */
        .timeline { display: flex; flex-direction: column; gap: 0; margin-top: 20px; }
        .step { display: grid; grid-template-columns: 52px 1fr; gap: 18px; position: relative; padding-bottom: 24px; }
        .step:last-child { padding-bottom: 0; }
        .step::before {
            content: ""; position: absolute; left: 25px; top: 52px; bottom: 0; width: 2px;
            background: linear-gradient(180deg, var(--accent-fill), var(--border));
            transform-origin: top center;
        }
        .step:last-child::before { display: none; }
        .step-num {
            width: 52px; height: 52px; border-radius: 50%; background: var(--accent-fill); color: var(--on-accent); font-weight: 800; font-size: 16px;
            display: flex; align-items: center; justify-content: center; flex: 0 0 auto; box-shadow: 0 4px 10px color-mix(in srgb, var(--accent) 35%, transparent);
            font-family: Consolas, monospace;
            transition: transform .3s var(--ease-soft), box-shadow .3s var(--ease-soft);
        }
        .step:hover .step-num { transform: scale(1.08) rotate(-4deg); box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 55%, transparent); }
        .step-card {
            position: relative;
            background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,.18);
            transition: transform .28s var(--ease-soft), border-color .28s var(--ease-soft), box-shadow .28s var(--ease-soft);
        }
        .step:hover .step-card { transform: translateX(4px); border-color: var(--accent-fill); box-shadow: 0 8px 22px rgba(0,0,0,.3); z-index: 5; }
        .step-card h3 { margin-top: 0; color: var(--accent); }
        .step-card ul { margin: 8px 0 0; padding-left: 20px; }

        /* ===================== NAVEGAÇÃO ===================== */
        .nav-arrow {
            position: fixed; top: calc(50% + (var(--topbar-h) / 2)); transform: translateY(-50%);
            width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line);
            background: color-mix(in srgb, var(--bg-alt) 85%, transparent); color: var(--accent); font-size: 22px; font-weight: 700;
            display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 40;
            transition: var(--transition-fast);
        }
        .nav-arrow:hover { background: var(--accent); color: var(--on-accent); border-color: var(--accent); }
        .nav-arrow[disabled] { opacity: .25; cursor: default; pointer-events: none; }
        .nav-prev { left: calc(var(--sidebar-w) + 14px); }
        .nav-next { right: 14px; }
        .scroll-hint {
            position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%);
            font-size: 11.5px; color: var(--muted); letter-spacing: .04em; white-space: nowrap;
            pointer-events: none; opacity: .85; z-index: 30;
        }

        /* ===================== VOOS & ALIMENTAÇÃO ===================== */
        .flight-box { border:1px solid var(--accent); background:color-mix(in srgb, var(--accent) 7%, transparent); border-radius:10px; padding:14px 16px; margin:16px 0; }
        .flight-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:10px; }
        .flight-item {
            position: relative;
            background:color-mix(in srgb, var(--bg-alt) 75%, transparent); border:1px solid var(--border); border-radius:8px; padding:11px 13px;
            transition: transform .26s var(--ease-soft), border-color .26s var(--ease-soft);
        }
        .flight-item:hover { transform: translateY(-3px); border-color: var(--accent); z-index: 5; }
        .flight-item .small { color:var(--muted); font-size:11px; text-transform:uppercase; letter-spacing:.05em; }
        .flight-item strong { display:block; color:var(--ink-strong); margin-top:4px; font-size:14px; }
        .source-note { font-size:11px; color:var(--muted); line-height:1.45; margin-top:10px; }
        .cost-total { font-size:22px; font-weight:800; color:var(--accent); }
        .food-card {
            position: relative;
            background:var(--bg-alt); border:1px solid var(--border); border-radius:9px; padding:14px 16px; margin:10px 0;
            transition: transform .26s var(--ease-soft), border-color .26s var(--ease-soft);
        }
        .food-card:hover { transform: translateX(4px); border-color: var(--accent2-fill); z-index: 5; }
        .food-card h3 { margin:0 0 7px; color:var(--accent2); }
        .food-card p { margin:5px 0; }
        .tag-local { color:var(--accent); font-weight:800; }
        .date-rank { display:grid; grid-template-columns:90px 1fr 120px; gap:12px; align-items:center; padding:10px 12px; border-bottom:1px solid var(--line); }
        .date-rank:last-child { border-bottom:0; }
        .rank { font-family:Consolas,monospace; font-weight:900; color:var(--accent2); }
        .score { text-align:right; font-weight:800; }

        /* ===================== HOSPEDAGEM ===================== */
        .hotel-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 14px; margin-top: 16px; }
        .hotel-card {
            /* Era overflow:hidden (cortava tooltips .tt que abrem para cima); trocado por
               overflow:visible seguindo o mesmo ajuste já feito em .form-nivel — o brilho do
               ::before ganha border-radius:inherit para não perder o recorte arredondado. */
            position: relative; overflow: visible;
            background: linear-gradient(180deg, color-mix(in srgb, var(--bg-alt) 96%, transparent), color-mix(in srgb, var(--bg) 96%, transparent));
            border: 1px solid var(--border); border-top: 3px solid var(--muted);
            border-radius: 11px; padding: 15px 17px 14px;
            transition: transform .3s var(--ease-soft), box-shadow .3s var(--ease-soft), border-color .3s var(--ease-soft);
        }
        .hotel-card::before {
            content: ""; position: absolute; inset: 0; border-radius: inherit;
            background: radial-gradient(120% 90% at 100% 0%, color-mix(in srgb, var(--accent) 10%, transparent), transparent 55%);
            opacity: 0; transition: opacity .35s var(--ease-soft); pointer-events: none;
        }
        .hotel-card:hover { transform: translateY(-4px); box-shadow: 0 16px 34px rgba(0,0,0,.42); z-index: 5; }
        .hotel-card:hover::before { opacity: 1; }
        .hotel-card.h-teal { border-top-color: var(--accent); }
        .hotel-card.h-gold { border-top-color: var(--accent2); }
        .hotel-card.h-coral { border-top-color: var(--accent3); }
        .hotel-card.h-navy { border-top-color: var(--navy); }
        .hotel-card.h-olive { border-top-color: var(--olive); }
        .hotel-card.h-brown { border-top-color: var(--brown); }

        .hotel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
        .hotel-name { font-family: Consolas, monospace; font-size: 14.5px; font-weight: 800; color: var(--ink-strong); margin: 0; line-height: 1.3; }
        .hotel-cat { font-size: 11px; color: var(--muted); letter-spacing: .05em; text-transform: uppercase; margin-top: 3px; display: block; }
        .hotel-price {
            font-family: Consolas, monospace; font-weight: 800; font-size: 13.5px; color: var(--accent2);
            border: 1px solid var(--accent2-fill); background: color-mix(in srgb, var(--accent2) 10%, transparent);
            border-radius: 999px; padding: 4px 10px; white-space: nowrap; cursor: help;
        }
        .hotel-body { font-size: 13px; color: var(--ink); margin: 10px 0 8px; line-height: 1.55; }
        .hotel-meta { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 5px; }
        /* align-items: center — sem isso, o <li> flex esticava o selo de proveniência
           (".prov", inline-flex) na vertical até a altura da linha inteira, fazendo a
           borda do selo acompanhar o texto do campo vizinho em vez de abraçar só o
           próprio texto do selo. */
        .hotel-meta li { font-size: 12px; color: var(--muted); line-height: 1.45; display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
        .hotel-meta li b { color: var(--ink); font-weight: 700; }
        .hotel-flag {
            display: inline-block; font-size: 11px; font-weight: 800; letter-spacing: .04em;
            padding: 3px 9px; border-radius: 5px; margin-top: 11px;
        }
        .flag-best { background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); border: 1px solid var(--accent); }
        .flag-alt { background: color-mix(in srgb, var(--navy) 14%, transparent); color: var(--navy); border: 1px solid var(--navy); }
        .flag-watch { background: color-mix(in srgb, var(--accent2) 14%, transparent); color: var(--accent2); border: 1px solid var(--accent2); }

        /* ===================== MOTION 3.0 — MAPA DE VIAGEM ===================== */
        .journey {
            --leg-dur: 3.6s;      /* tempo de travessia de um trecho */
            --leg-gap: .40s;      /* defasagem entre trechos consecutivos */
            position: relative;
            display: flex; align-items: center; gap: 0;
            margin: 20px 0 10px; padding: 26px 16px 30px;
            background: linear-gradient(180deg, color-mix(in srgb, var(--bg-alt) 94%, transparent), color-mix(in srgb, var(--bg) 94%, transparent));
            border: 1px solid var(--border); border-radius: 14px;
            overflow: hidden;
            box-shadow: inset 0 1px 0 color-mix(in srgb, var(--ink-strong) 3%, transparent), 0 8px 26px rgba(0,0,0,.28);
        }
        .journey::before {   /* aurora de fundo, lenta e discreta */
            content: ""; position: absolute; inset: -60% -12%;
            background:
                radial-gradient(closest-side, color-mix(in srgb, var(--accent) 16%, transparent), transparent 72%),
                radial-gradient(closest-side, color-mix(in srgb, var(--accent2) 13%, transparent), transparent 72%),
                radial-gradient(closest-side, color-mix(in srgb, var(--navy) 10%, transparent), transparent 72%);
            background-repeat: no-repeat;
            background-size: 46% 170%, 40% 150%, 38% 160%;
            background-position: 6% 50%, 52% 40%, 92% 60%;
            pointer-events: none;
        }
        .journey::after {    /* eixo-guia luminoso */
            content: ""; position: absolute; left: 4%; right: 4%; top: 50%; height: 1px;
            transform: translateY(-50%);
            background: linear-gradient(90deg, transparent, color-mix(in srgb, var(--accent) 35%, transparent) 18%, color-mix(in srgb, var(--accent2) 35%, transparent) 55%, color-mix(in srgb, var(--accent) 35%, transparent) 82%, transparent);
            pointer-events: none;
        }
        .journey .caption {
            position: absolute; left: 16px; bottom: 8px; font-size: 10.5px; letter-spacing: .10em;
            text-transform: uppercase; color: var(--muted); z-index: 4;
        }

        /* Paradas */
        .stop { position: relative; z-index: 3; display: flex; flex-direction: column; align-items: center; gap: 5px; min-width: 64px; }
        .stop .glyph {
            width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-size: 19px;
            background: radial-gradient(circle at 32% 26%, var(--glyph-a), var(--glyph-b));
            border: 1px solid var(--line);
            transition: transform .3s var(--ease-soft);
        }
        .stop:hover .glyph { transform: scale(1.14); }
        .stop small {
            font-size: 8.5px; letter-spacing: .09em; color: var(--ink-strong); font-weight: 800; text-align: center;
            text-shadow: 0 1px 3px rgba(0,0,0,.8);
        }
        .stop .tick { font-size: 8px; color: var(--muted); letter-spacing: .05em; }

        /* Trechos */
        .leg { position: relative; z-index: 2; flex: 1 1 62px; min-width: 40px; height: 58px; }
        .leg .rail {
            position: absolute; left: 0; right: 0; top: 50%; height: 2px; transform: translateY(-50%);
            background-image: linear-gradient(90deg, var(--line) 0 7px, transparent 7px 15px);
            background-size: 15px 2px; border-radius: 2px; opacity: .9;
        }
        .leg .glow {
            position: absolute; left: 0; top: 50%; width: 0; height: 2px; transform: translateY(-50%);
            border-radius: 2px; opacity: 0;
            background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 0%, transparent), var(--accent));
        }
        .leg .craft {
            position: absolute; left: 0; top: 50%; margin-left: -11px; font-size: 20px; line-height: 1; z-index: 4;
            transform: translateY(-50%);
            filter: drop-shadow(0 3px 6px rgba(0,0,0,.55));
        }
        .leg .mode {
            position: absolute; left: 50%; bottom: 2px; transform: translateX(-50%);
            font-size: 8.5px; color: var(--muted); letter-spacing: .06em; white-space: nowrap;
        }
        .journey.compact { padding: 20px 14px 26px; }
        .journey.compact .leg { height: 46px; }
        .journey.compact .stop .glyph { width: 34px; height: 34px; font-size: 16px; }

        /* Trechos entre cidades — cartão de duas linhas: o trecho isolado em cima, sem
           quebra; modo, duração, custo, observação e o ajuste (quando estimado) condensados
           numa segunda linha só, em vez da tabela de 5 colunas + linha extra de ajuste. */
        .trecho-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
        .trecho-row {
            background: var(--bg-alt); border: 1px solid var(--border); border-radius: var(--radius);
            padding: 10px 14px;
        }
        .trecho-titulo { font-size: 13.5px; font-weight: 800; color: var(--ink-strong); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .trecho-detalhes {
            display: flex; flex-wrap: wrap; align-items: center; gap: 6px 16px;
            margin-top: 6px; font-size: 12.5px; color: var(--ink);
        }
        .trecho-detalhes .td-obs { color: var(--muted); font-size: 12px; flex: 1 1 220px; }
        .trecho-ajuste-inline { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; }
        .trecho-ajuste-inline label { font-size: 10px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
        .trecho-ajuste-inline input[type=number] {
            width: 64px; padding: 4px 6px; font-size: 12px; border-radius: 6px;
            border: 1px solid var(--border); background: var(--bg); color: var(--ink);
        }

        /* --- Animações ativas somente com body.motion --- */
        body.motion .journey::before { animation: auroraDrift 22s ease-in-out infinite alternate; }
        body.motion .leg .rail { animation: railFlow 1.15s linear infinite; }
        body.motion .leg .glow {
            animation: legFill var(--leg-dur) var(--ease-soft) infinite;
            animation-delay: calc(var(--i, 0) * var(--leg-gap));
        }
        body.motion .leg .craft {
            animation: craftFly var(--leg-dur) cubic-bezier(.42,.02,.32,1) infinite;
            animation-delay: calc(var(--i, 0) * var(--leg-gap));
        }
        body.motion .leg .craft.by-train { animation-name: craftTrain; }
        body.motion .leg .craft.by-car { animation-name: craftCar; }
        body.motion .stop .glyph {
            animation: stopPing var(--leg-dur, 3.6s) ease-out infinite;
            animation-delay: calc(var(--i, 0) * var(--leg-gap, .4s));
        }

        @keyframes auroraDrift {
            0%   { background-position: 6% 50%, 52% 40%, 92% 60%; }
            50%  { background-position: 14% 42%, 46% 58%, 84% 46%; }
            100% { background-position: 3% 58%, 58% 36%, 96% 64%; }
        }
        @keyframes railFlow { to { background-position: 15px 0; } }
        @keyframes legFill {
            0%   { width: 0;    opacity: 0; }
            10%  { opacity: .95; }
            72%  { width: 100%; opacity: .95; }
            100% { width: 100%; opacity: 0; }
        }
        /* Avião: sobe, cruza o trecho inteiro e desce */
        @keyframes craftFly {
            0%   { left: 0%;   transform: translateY(-50%) scale(.55) rotate(-8deg); opacity: 0; }
            14%  { transform: translateY(-58%) scale(1) rotate(-3deg); opacity: 1; }
            50%  { transform: translateY(-88%) scale(1.1) rotate(0deg); }
            86%  { transform: translateY(-58%) scale(1) rotate(3deg); opacity: 1; }
            100% { left: 100%; transform: translateY(-45%) scale(.55) rotate(8deg); opacity: 0; }
        }
        /* Trem: trajetória plana e constante */
        @keyframes craftTrain {
            0%   { left: 0%;   transform: translateY(-50%) scale(.6); opacity: 0; }
            12%  { transform: translateY(-50%) scale(1); opacity: 1; }
            50%  { transform: translateY(-54%) scale(1.06); }
            88%  { transform: translateY(-50%) scale(1); opacity: 1; }
            100% { left: 100%; transform: translateY(-50%) scale(.6); opacity: 0; }
        }
        /* Carro: leve balanço de suspensão */
        @keyframes craftCar {
            0%   { left: 0%;   transform: translateY(-50%) scale(.6); opacity: 0; }
            14%  { transform: translateY(-56%) scale(1); opacity: 1; }
            38%  { transform: translateY(-46%) scale(1.04); }
            62%  { transform: translateY(-58%) scale(1.04); }
            86%  { transform: translateY(-50%) scale(1); opacity: 1; }
            100% { left: 100%; transform: translateY(-52%) scale(.6); opacity: 0; }
        }
        /* Parada acende quando o veículo chega */
        @keyframes stopPing {
            0%, 62%  { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 0%, transparent); border-color: var(--line); }
            74%      { box-shadow: 0 0 0 5px color-mix(in srgb, var(--accent) 26%, transparent); border-color: var(--accent); }
            100%     { box-shadow: 0 0 0 17px color-mix(in srgb, var(--accent) 0%, transparent); border-color: var(--line); }
        }

        /* ===================== REVELAÇÃO PROGRESSIVA ===================== */
        body.motion .reveal {
            opacity: 0;
            transform: translateY(18px);
            transition: opacity .62s var(--ease-soft), transform .62s var(--ease-soft);
            transition-delay: calc(var(--n, 0) * 65ms);
            will-change: opacity, transform;
        }
        body.motion section.in .reveal { opacity: 1; transform: none; }

        body.motion .step::before { transform: scaleY(0); transition: transform .7s var(--ease-soft); transition-delay: calc(var(--n, 0) * 65ms + 220ms); }
        body.motion section.in .step::before { transform: scaleY(1); }

        /* Realce suave da seção ativa */
        section { transition: background .5s var(--ease-soft); }
        body.motion section.in { background: color-mix(in srgb, var(--bg) 72%, transparent); }

        /* ===================== ACESSIBILIDADE ===================== */
        @media (prefers-reduced-motion: reduce) {
            html { scroll-behavior: auto; }
            body.motion .journey::before,
            body.motion .leg .rail,
            body.motion .leg .glow,
            body.motion .leg .craft,
            body.motion .stop .glyph { animation: none !important; }
            body.motion .reveal { opacity: 1 !important; transform: none !important; transition: none !important; }
        }


        /* ===================== SISTEMA VISUAL NORMALIZADO ===================== */
        :root {
            --surface-1: var(--bg-alt);
            --surface-2: #eef2f5;
            --surface-3: #e4e9ee;
            --focus-ring: 0 0 0 2px color-mix(in srgb, var(--accent) 30%, transparent), 0 0 0 4px color-mix(in srgb, var(--accent) 14%, transparent);
        }
        :root[data-tema="escuro"] {
            --surface-2: #132638;
            --surface-3: #172d41;
        }

        .topbar { min-height: var(--topbar-h); height: auto; gap: 16px; padding: 10px 18px; }

        .route-switch button { min-height: 34px; padding: 7px 14px; }
        .route-switch button:focus-visible, .btn-exportar:focus-visible, .toc a:focus-visible, .nav-arrow:focus-visible { outline: none; box-shadow: var(--focus-ring); }

        .ind-grid, .finance-grid, .highlight-strip, .hotel-grid { align-items: stretch; }
        .ind-card, .finance-card, .highlight-card, .hotel-card, .step-card, .food-card, .flight-item {

        }

        .highlight-strip { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }

        .toc { width: var(--sidebar-w); padding: 18px 12px; overscroll-behavior: contain; }

        .toc .toc-title { margin-bottom: 9px; }
        .nav-arrow { width: 42px; height: 42px; background: color-mix(in srgb, var(--bg-alt) 94%, transparent); }
        .scroll-hint { left: calc(50% + var(--sidebar-w) / 2); max-width: 80%; overflow: hidden; text-overflow: ellipsis; }

        .topbar .route-switch button { min-width: 88px; }

        @media (max-width: 1100px) {

            .topbar-brand small { font-size: 11px; }

        /* ===================== MÓDULO CLIMÁTICO ===================== */
        .climate-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 13px; margin-top: 16px; }
        .climate-card {
            /* Era overflow:hidden (cortava tooltips .tt que abrem para cima); trocado por
               overflow:visible seguindo o mesmo ajuste já feito em .form-nivel. */

            background: linear-gradient(165deg, color-mix(in srgb, var(--bg-alt) 96%, transparent), color-mix(in srgb, var(--bg) 96%, transparent));
            border: 1px solid var(--border); border-top: 3px solid var(--navy);
            border-radius: 11px; padding: 14px 16px 13px;
            transition: transform .3s var(--ease-soft), box-shadow .3s var(--ease-soft);
        }

        .cc-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
