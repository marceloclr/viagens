            roteiro.descartadas.push({ atracao: a, cidade: cidade.dados.nome, motivo: 'Idade mínima de ' + a.idadeMin + ' anos incompatível com o integrante mais novo do grupo (' + idadeMinGrupo + ' anos).' });
            return;
        }
        const s = pontuarAtracao(a, cfg, pesos);
        pool.push({ a, score: s.total, porque: s.pontos });
    });
    pool.sort((x, y) => y.score - x.score);
    return pool;
}

/* Capacidade diária em minutos de visita, derivada do ritmo (§19) */
function capacidadeDiaria(cfg, tipoDia) {
    const r = CONFIG.ritmos[cfg.ritmo] || CONFIG.ritmos.moderado;
    const janela = U.min(r.fim) - U.min(r.inicio);
    const refeicoes = 75 + (U.min(r.fim) >= U.min('20:00') ? 90 : 0);
    const ocupacao = { muito_tranquilo: .55, tranquilo: .65, moderado: .75, intenso: .85, muito_intenso: .92 }[cfg.ritmo] || .75;
    let cap = (janela - refeicoes) * ocupacao;
    if (tipoDia === 'chegada') cap *= 0.35;        // §30
    if (tipoDia === 'partida') cap *= 0.30;        // §31
    if (tipoDia === 'transferencia') cap *= 0.55;
    return Math.round(cap);
}

/* Monta os dias de uma cidade, agrupando por zona e respeitando dias de fechamento */
function montarDiasDaCidade(cfg, cidade, pool, datas, tiposDia, roteiro) {
    const dias = [];
    const usadas = new Set();

    /* Cidade sem nenhuma atração cadastrada — tipicamente um destino declarado por você.
       Os dias existem, as noites contam, o orçamento corre; o que não existe é programa,
       e isso se declara em vez de se disfarçar com sugestões genéricas. */
    if (!pool.length) {
        roteiro.conflitos.push({
            grave: false,
            titulo: 'Sem base de atrações para ' + cidade.dados.nome,
            campo: '.city-row[data-cidade-id="' + cidade.id + '"]',
            problema: (cidade.dados.declarada
                ? cidade.dados.nome + ' foi declarada por você e não consta da base curada. '
                : 'Não há atração cadastrada para ' + cidade.dados.nome + ' na base interna. ') +
                'Os ' + datas.length + ' dia(s) nesta cidade são reservados no cronograma, mas ficam sem programa: o sistema não inventa atrações, endereços nem horários.',
            impacto: 'Noites, alimentação e transporte urbano continuam entrando na estimativa de custo, porque são despesas reais do período. Ingressos, cronograma e plano B ficam vazios nesta cidade, e a nota de interesses cai por falta de cobertura dos objetivos declarados.',
            opcoes: ['Manter a cidade e planejar o programa por fora', 'Substituir por uma cidade curada da base', 'Reduzir as noites nesta cidade e realocá-las', 'Aguardar a curadoria desta cidade em versão futura']
        });
    }
    datas.forEach((data, i) => {
        const tipo = tiposDia[i];
        const cap = capacidadeDiaria(cfg, tipo);
        const dow = U.diaSemana(data);
        const dia = { data, cidadeId: cidade.id, cidadeNome: cidade.dados.nome, tipo, capacidade: cap, itens: [], zona: null };
        let restante = cap;

        const disponiveis = () => pool.filter(p => !usadas.has(p.a.id) && p.a.fechado.indexOf(dow) < 0 && p.a.dur <= restante + 20);
        let ancora = disponiveis()[0];
        if (ancora) {
            dia.zona = ancora.a.zona;
            dia.itens.push(ancora); usadas.add(ancora.a.id); restante -= ancora.a.dur;
        }
        let guarda = 0;
        while (restante > 30 && guarda++ < 12) {
            const cands = disponiveis().map(p => {
                const desloc = IDX.minutosZona(cidade.id, dia.zona || p.a.zona, p.a.zona);
                return { p, desloc, eficaz: p.score - desloc * 1.4 };
            }).filter(c => c.p.a.dur + c.desloc <= restante);
            if (!cands.length) break;
            cands.sort((x, y) => y.eficaz - x.eficaz);
            const esc = cands[0];
            dia.itens.push(esc.p); usadas.add(esc.p.a.id);
            restante -= (esc.p.a.dur + esc.desloc);
        }
        dias.push(dia);
    });

    // Atrações obrigatórias que não couberam viram conflito explícito (§23)
    (cfg.obrigatorias || []).forEach(id => {
        const a = IDX.atracao(id);
        if (!a || a.cidadeId !== cidade.id) return;
        if (!usadas.has(id)) {
            const fechaSempre = datas.every(d => a.fechado.indexOf(U.diaSemana(d)) >= 0);
            roteiro.conflitos.push({
                grave: true, titulo: 'Atração obrigatória não encaixada: ' + a.nome,
                campo: '#chipsObrig',
                problema: fechaSempre
                    ? 'A atração está fechada em todos os dias em que você estará em ' + cidade.dados.nome + '.'
                    : 'Não há tempo disponível para ' + a.nome + ' (' + U.dur(a.dur) + ') no ritmo e na duração escolhidos.',
                impacto: 'Você marcou esta atração como “não quero perder”. O sistema não a remove em silêncio.',
                opcoes: fechaSempre
                    ? ['Deslocar as datas em ' + cidade.dados.nome, 'Acrescentar uma noite na cidade', 'Retirar a marcação de obrigatória']
                    : ['Acrescentar uma noite em ' + cidade.dados.nome, 'Adotar ritmo mais intenso', 'Retirar outra atração opcional']
            });
        }
    });

    pool.forEach(p => {
        if (!usadas.has(p.a.id)) {
            roteiro.descartadas.push({ atracao: p.a, cidade: cidade.dados.nome, score: Math.round(p.score), motivo: 'Ficou fora por limite de tempo do ritmo escolhido — pontuação inferior às selecionadas.' });
        }
    });
    return dias;
}

/* Converte os dias em cronograma com horários reais e sem sobreposição (§28) */
function montarCronograma(cfg, dias, roteiro) {
    const r = CONFIG.ritmos[cfg.ritmo] || CONFIG.ritmos.moderado;
    const ALMOCO_INI = U.min('12:30');
    const JANTAR_INI = U.min('19:30');
    dias.forEach(dia => {
        let t = U.min(r.inicio);
        if (dia.tipo === 'chegada') t = U.min(cfg.horaChegadaPrevista || '15:00');
        const blocos = [];
        let zonaAtual = null;
        let almocoFeito = false;
        let jantarFeito = false;

        if (dia.tipo === 'chegada') {
            blocos.push({ ini: t, fim: t + 90, tipo: 'logistica', icone: '🛬', titulo: 'Chegada, imigração, bagagem e deslocamento',
                desc: 'Dia de chegada não recebe carga cheia: imigração, retirada de bagagem, transporte até a base e check-in consomem o período (§30).' });
            t += 90;
            blocos.push({ ini: t, fim: t + 45, tipo: 'logistica', icone: '🏨', titulo: 'Check-in e descanso', desc: 'Margem para acomodação e recuperação do voo.' });
            t += 45;
        }

        dia.itens.forEach((item, idx) => {
            const a = item.a;
            if (zonaAtual && zonaAtual !== a.zona) {
                const d = IDX.minutosZona(dia.cidadeId, zonaAtual, a.zona);
                blocos.push({ ini: t, fim: t + d, tipo: 'desloc', icone: '🚶', titulo: 'Deslocamento até ' + a.nome,
                    desc: U.dur(d) + ' entre ' + zonaAtual.replace(/_/g, ' ') + ' e ' + a.zona.replace(/_/g, ' ') + '. Tempo estimado.' });
                t += d;
            }

            /* Uma atração que avança sobre o horário de almoço/jantar (parques de Orlando,
               por exemplo, onde o dia inteiro é passado dentro do parque) já contempla a
               refeição por dentro — não insere bloco separado, só sinaliza na descrição.
               Distinto do caso abaixo (t já passou do horário ao CHEGAR nesta atração),
               em que a refeição precisa mesmo de um bloco próprio entre duas atrações. */
            const cobreAlmoco = !almocoFeito && t <= ALMOCO_INI && t + a.dur > ALMOCO_INI;
            const cobreJantar = !jantarFeito && t <= JANTAR_INI && t + a.dur > JANTAR_INI;
            const notasRefeicao = [];

            if (cobreAlmoco) {
                almocoFeito = true;
                notasRefeicao.push('Inclui o horário de almoço — refeição prevista dentro do local, como costuma ocorrer em parques temáticos.');
                // idx > 0: nunca insere a refeição ANTES da primeira atração do dia — só depois
                // que o roteiro já começou (ex.: chegada tardia empurrando "t" para depois das 12h30).
            } else if (!almocoFeito && idx > 0 && t >= ALMOCO_INI) {
                blocos.push({ ini: t, fim: t + 75, tipo: 'refeicao', icone: '🍽️', titulo: 'Almoço', desc: 'Ver a estratégia alimentar da cidade no módulo de alimentação.' });
                t += 75; almocoFeito = true;
            }
            if (cobreJantar) {
                jantarFeito = true;
                notasRefeicao.push('Inclui o horário de jantar — refeição prevista dentro do local, como costuma ocorrer em parques temáticos.');
            }

            blocos.push({ ini: t, fim: t + a.dur, tipo: 'atracao', icone: '📍', titulo: a.nome, atracaoId: a.id,
                desc: a.desc + (notasRefeicao.length ? ' ' + notasRefeicao.join(' ') : ''), porque: item.porque, score: Math.round(item.score) });
            t += a.dur;
            zonaAtual = a.zona;
        });

        if (!almocoFeito && dia.itens.length) {
            blocos.push({ ini: t, fim: t + 75, tipo: 'refeicao', icone: '🍽️', titulo: 'Almoço', desc: 'Encaixado após o programa da manhã.' });
            t += 75;
        }
        if (dia.tipo === 'partida') {
            const ant = cfg.antecedenciaAeroporto || 180;
            blocos.push({ ini: t, fim: t + 45, tipo: 'logistica', icone: '🧳', titulo: 'Check-out e organização das malas', desc: 'Reservado antes de qualquer deslocamento.' });
            t += 45;
            blocos.push({ ini: t, fim: t + ant, tipo: 'logistica', icone: '✈️', titulo: 'Deslocamento e antecedência no aeroporto',
                desc: U.dur(ant) + ' de margem contra atrasos. O sistema não preenche a manhã de partida com atrações que comprometam o voo (§31).' });
            t += ant;
        } else if (dia.itens.length && !jantarFeito) {
            const jantar = Math.max(t + 30, JANTAR_INI);
            blocos.push({ ini: jantar, fim: jantar + 90, tipo: 'refeicao', icone: '🍷', titulo: 'Jantar', desc: 'Sugestão de bairro no módulo de alimentação.' });
        }
        dia.blocos = blocos;
        // Verificação de sobreposição
        for (let i = 1; i < blocos.length; i++) {
            if (blocos[i].ini < blocos[i - 1].fim) {
                roteiro.avisos.push('Sobreposição corrigida em ' + U.dataBR(dia.data) + ': ' + blocos[i].titulo);
                blocos[i].ini = blocos[i - 1].fim;
                blocos[i].fim = Math.max(blocos[i].fim, blocos[i].ini + 30);
            }
        }
    });
    return dias;
}

/* Voos (§51) — nunca inventa tarifa nem número de voo */
/* Compatibilidade entre um trecho cadastrado e a preferência de transporte declarada.
   Vive fora de criarRoteiro() porque a importação de um roteiro precisa reavaliá-la
   contra a base atual: se o trecho mudou de modo desde a exportação, repetir o juízo
   é a única forma de não herdar uma avaliação que já não corresponde ao dado. */
function trechoCompativel(cfg, t) {
    if (!t) return false;
    const pref = cfg.transporteInterno;
    return !pref || pref === 'combinado' || pref === 'taxi' ||
        (pref === 'publico' && t.modo !== 'carro') ||
        (pref === 'trem' && t.modo === 'trem') ||
        (pref === 'carro' && t.modo === 'carro');
}

/* Consulta dados/voos.json para a perna internacional Brasil↔entrada/saída, quando a
   "origem" digitada resolve para um aeroporto conhecido (IDX.aeroportoPorNomeCidade).
   Direto primeiro; sem rota direta cadastrada, tenta uma conexão via Lisboa — hub onde
   a malha aérea brasileira pesquisada é mais densa — quando as duas pernas existirem na
   base. Isto NÃO é o voo do viajante: é a rota que existe e quem a opera. Número,
   horário e tarifa exatos continuam vindo só de "voo já emitido" (§13, §51) — uma rota
   cadastrada não vira previsão do voo que a pessoa vai pegar. */
// Um voo "já emitido" (§13/§51) é considerado informado quando pelo menos um dos seus
// campos foi preenchido — objeto sempre presente (vooVazio()), nunca null, então a
// checagem é sobre o conteúdo, não sobre a existência do objeto.
function vooTemDado(v) {
    return !!(v && (v.companhia || v.numero || v.data || v.horaPartida || v.horaChegada || v.precoPago != null || v.obs));
}

function buscarVooCadastrado(apOrigem, apDestino) {
    if (!apOrigem || !apDestino || apOrigem.id === apDestino.id) return null;
    const direto = IDX.voosDe(apOrigem.id, apDestino.id)[0];
    if (direto) return { tipo: 'direto', pernas: [direto] };
    if (apOrigem.id === 'lis' || apDestino.id === 'lis') return null;
    const perna1 = IDX.voosDe(apOrigem.id, 'lis')[0];
    const perna2 = IDX.voosDe('lis', apDestino.id)[0];
    if (perna1 && perna2) return { tipo: 'conexao', hub: 'Lisboa', pernas: [perna1, perna2] };
    return null;
}

function selecionarVoos(cfg, cidadesRota, roteiro) {
    const entrada = cidadesRota[0], saida = cidadesRota[cidadesRota.length - 1];
    const apEntrada = IDX.aeroporto((entrada.dados.aeroportos || [])[0]);
    const apSaida = IDX.aeroporto((saida.dados.aeroportos || [])[0]);
    const apOrigemBR = IDX.aeroportoPorNomeCidade(cfg.origem);
    const voos = [];
    voos.push({
        sentido: 'Ida', origem: cfg.origem || 'Origem não informada',
        destino: apEntrada ? apEntrada.nome : entrada.dados.nome,
        codigo: apEntrada ? apEntrada.codigo : null,
        data: cfg.dataInicio,
        status: 'ROTA SUGERIDA',
        obs: 'Rota aérea sugerida a partir da cidade de entrada escolhida. O sistema não dispõe de provedor aberto de tarifas: número de voo, horário e preço só aparecem se você os informar.',
        manual: cfg.vooIda || vooVazio(),
        cadastro: buscarVooCadastrado(apOrigemBR, apEntrada)
    });
    voos.push({
        sentido: 'Retorno', origem: apSaida ? apSaida.nome : saida.dados.nome,
        destino: cfg.origem || 'Origem não informada',
        codigo: apSaida ? apSaida.codigo : null,
        data: cfg.dataFim,
        status: 'ROTA SUGERIDA',
        obs: entrada.id !== saida.id
            ? 'Rota aberta: a saída ocorre por ' + saida.dados.nome + ', aeroporto distinto do de entrada. Emissão em multitrecho.'
            : 'Entrada e saída pela mesma cidade.',
        manual: cfg.vooVolta || vooVazio(),
        cadastro: buscarVooCadastrado(apSaida, apOrigemBR)
    });
    registrar(roteiro, 'Voos', 'Rota aérea sugerida sem tarifa',
        [['Provedor de tarifas disponível', 'Nenhum'],
         ['Política adotada', 'Apresentar a rota e deixar o preço em branco, em vez de estimar valor de passagem'],
         ['Rota cadastrada encontrada (ida)', voos[0].cadastro ? (voos[0].cadastro.tipo === 'direto' ? 'Direta' : 'Conexão via ' + voos[0].cadastro.hub) : 'Nenhuma — origem não reconhecida ou sem rota pesquisada'],
         ['Rota cadastrada encontrada (retorno)', voos[1].cadastro ? (voos[1].cadastro.tipo === 'direto' ? 'Direta' : 'Conexão via ' + voos[1].cadastro.hub) : 'Nenhuma — origem não reconhecida ou sem rota pesquisada']]);
    return voos;
}

function selecionarHospedagens(cfg, cidadesRota, roteiro) {
    const faixa = CONFIG.orcamento[cfg.orcamento] || CONFIG.orcamento.intermediario;
    return cidadesRota.map(c => {
        const opcoes = IDX.hospedagensDe(c.id);
        return {
            cidadeId: c.id, cidadeNome: c.dados.nome, noites: c.noites,
            bairros: c.dados.bairrosBase || null,
            faixaDiaria: faixa.hotelNoite,
            classe: faixa.rotulo,
            opcoes: opcoes,
            semOpcoes: opcoes.length === 0
        };
    });
}

function calcularIngressos(cfg, dias, roteiro) {
    // Idades individuais: a tarifa de cada pessoa é resolvida uma a uma, porque as
    // faixas etárias diferem entre instituições (o regime vaticano isenta menores de
    // 7 e cobra reduzido de 7 a 18; os museus estatais italianos isentam menores de 18).
    let idades = (cfg.viajantes.idades || []).slice();
    if (!idades.length) {
        for (let i = 0; i < cfg.viajantes.adultos; i++) idades.push(30);
        for (let i = 0; i < cfg.viajantes.adolescentes; i++) idades.push(15);
        for (let i = 0; i < cfg.viajantes.criancas; i++) idades.push(8);
    }
    const adultos = idades.filter(a => a >= 18).length;
    const menores = idades.filter(a => a < 18).length;

    const linhas = [];
    let somaConhecida = 0, semTarifa = 0;
    const vistos = new Set();
    dias.forEach(d => (d.blocos || []).forEach(b => {
        if (b.tipo !== 'atracao' || vistos.has(b.atracaoId)) return;
        vistos.add(b.atracaoId);
        const a = IDX.atracao(b.atracaoId);
        if (!a) return;

        if (a.custo.tipo === 'CADASTRADO' && typeof a.custo.valor === 'object' && a.custo.valor) {
            const v = a.custo.valor, tx = v.taxaReserva || 0;
            let total = 0, gratuitos = 0;
            const detalhe = [];
            idades.forEach(idade => {
                let base;
                if (v.gratuitoAte != null && idade < v.gratuitoAte) { base = 0; gratuitos++; }
                else if (idade < 18 && v.menor18 != null) base = v.menor18;
                else base = v.adulto || 0;
                const p = base > 0 ? base + tx : 0;
                total += p;
                detalhe.push(idade + ' anos → ' + (p ? U.eur(p) : 'gratuito'));
            });
            somaConhecida += total;
            const adPreco = (v.adulto || 0) + tx;
            const meMostra = idades.some(i => i < 18)
                ? (v.gratuitoAte != null && idades.some(i => i < v.gratuitoAte)
                    ? 'varia por idade'
                    : (v.menor18 ? U.eur(v.menor18 + tx) : 'sem cobrança'))
                : '—';
            linhas.push({
                nome: a.nome, adulto: adPreco, menorTexto: meMostra, total: total,
                tipo: 'CADASTRADO', fonte: a.custo.fonte, oficial: a.oficial, reserva: a.reserva,
                nota: (a.custo.nota || '') + (gratuitos ? ' Neste grupo, ' + gratuitos + ' pessoa(s) entram sem cobrança pela faixa etária.' : ''),
                detalhe: detalhe.join(' · ')
            });
        } else if (a.custo.tipo === 'CADASTRADO' && a.custo.valor === 0) {
            linhas.push({ nome: a.nome, adulto: 0, menorTexto: 'sem cobrança', total: 0, tipo: 'CADASTRADO', fonte: a.custo.fonte, nota: a.custo.nota, oficial: a.oficial, reserva: a.reserva });
        } else {
            semTarifa++;
            linhas.push({ nome: a.nome, adulto: null, menorTexto: null, total: null, tipo: 'INDISPONIVEL', fonte: a.custo.fonte, oficial: a.oficial, reserva: a.reserva });
        }
    }));
    return { linhas, somaConhecida, semTarifa, adultos, menores, idades };
}

function calcularCustos(cfg, cidadesRota, dias, ingressos, roteiro) {
    const faixa = CONFIG.orcamento[cfg.orcamento] || CONFIG.orcamento.intermediario;
    const pessoas = cfg.viajantes.total;
    const noites = cidadesRota.reduce((s, c) => s + c.noites, 0);
    const diasTotais = dias.length;
    const quartos = Math.max(1, Math.ceil(pessoas / 2));

    const hosp = [faixa.hotelNoite[0] * noites * quartos, faixa.hotelNoite[1] * noites * quartos];
    const comida = [faixa.comidaDia[0] * diasTotais * pessoas, faixa.comidaDia[1] * diasTotais * pessoas];
    const transpLocal = [faixa.transpDia[0] * diasTotais * pessoas, faixa.transpDia[1] * diasTotais * pessoas];
    const extras = [faixa.extrasDia[0] * diasTotais * pessoas, faixa.extrasDia[1] * diasTotais * pessoas];

    let trechosMin = 0, trechosMax = 0, trechosSemPreco = 0;
    roteiro.deslocamentos.forEach(t => {
        if (t.custoPP) { trechosMin += t.custoPP[0] * pessoas; trechosMax += t.custoPP[1] * pessoas; }
        else trechosSemPreco++;
    });

    const ing = [ingressos.somaConhecida, ingressos.somaConhecida];
    const subMin = hosp[0] + comida[0] + transpLocal[0] + extras[0] + trechosMin + ing[0];
    const subMax = hosp[1] + comida[1] + transpLocal[1] + extras[1] + trechosMax + ing[1];
    const conting = [subMin * CONFIG.contingencia, subMax * CONFIG.contingencia];

    // Preço pago por pessoa em "voo já emitido" (ida e/ou volta) — dado CONFIRMADO pelo
    // viajante, não estimado, por isso fica fora do subtotal/contingência terrestre e
    // vira uma linha própria (ver Render.custos — total terrestre continua sem voos).
    const idaPP = cfg.vooIda && cfg.vooIda.precoPago != null ? Number(cfg.vooIda.precoPago) : null;
    const voltaPP = cfg.vooVolta && cfg.vooVolta.precoPago != null ? Number(cfg.vooVolta.precoPago) : null;
    const vooInformado = idaPP != null || voltaPP != null;
    const vooValor = vooInformado ? ((idaPP || 0) + (voltaPP || 0)) * pessoas : null;
    const vooPartes = [idaPP != null ? 'ida' : null, voltaPP != null ? 'volta' : null].filter(Boolean).join(' + ');

    return {
        pessoas, noites, dias: diasTotais, quartos, classe: faixa.rotulo,
        linhas: [
            { id: 'voos', rotulo: 'Voos internacionais', faixa: null, valor: vooValor,
              tipo: vooInformado ? 'CONFIRMADO' : 'INDISPONIVEL',
              nota: vooInformado
                ? 'Preço pago por pessoa informado em "voo já emitido" (' + vooPartes + '), × ' + pessoas + ' pessoa(s). Dado confirmado pelo viajante, não estimado.'
                : 'Sem provedor aberto de tarifas aéreas. Informe o valor pago em "voo já emitido" para que entre no total.' },
            { id: 'hospedagem', rotulo: 'Hospedagem', faixa: hosp, tipo: 'ESTIMADO', nota: noites + ' noites × ' + quartos + ' quarto(s) × faixa de diária da classe ' + faixa.rotulo + '. Preço por quarto/noite, não por pessoa.' },
            { id: 'alimentacao', rotulo: 'Alimentação', faixa: comida, tipo: 'ESTIMADO', nota: diasTotais + ' dias × ' + pessoas + ' pessoa(s) × faixa diária da classe ' + faixa.rotulo + '.' },
            { id: 'transporte_local', rotulo: 'Transporte urbano', faixa: transpLocal, tipo: 'ESTIMADO', nota: diasTotais + ' dias × ' + pessoas + ' pessoa(s).' },
            { id: 'trechos', rotulo: 'Trechos entre cidades', faixa: [trechosMin, trechosMax], tipo: trechosSemPreco ? 'ESTIMADO' : 'CADASTRADO', nota: trechosSemPreco ? trechosSemPreco + ' trecho(s) sem preço disponível ficaram fora desta linha.' : 'Faixas cadastradas para cada trecho, multiplicadas por ' + pessoas + ' pessoa(s).' },
            { id: 'ingressos', rotulo: 'Ingressos', faixa: ing, tipo: 'CALCULADO', nota: 'Soma apenas das tarifas oficiais cadastradas. ' + ingressos.semTarifa + ' atração(ões) sem tarifa disponível não entraram no cálculo.' },
            { id: 'extras', rotulo: 'Extras e imprevistos do dia', faixa: extras, tipo: 'ESTIMADO', nota: 'Lembranças, cafés, bagagem e pequenas despesas.' },
            { id: 'contingencia', rotulo: 'Contingência (' + Math.round(CONFIG.contingencia * 100) + '%)', faixa: conting, tipo: 'CALCULADO', nota: 'Margem sobre o subtotal terrestre, para variação cambial e imprevistos.' }
        ],
        totalTerrestre: [subMin + conting[0], subMax + conting[1]],
        porPessoa: [(subMin + conting[0]) / pessoas, (subMax + conting[1]) / pessoas],
        porDia: [(subMin + conting[0]) / diasTotais, (subMax + conting[1]) / diasTotais],
        semVoos: true
    };
}

function gerarPlanoB(cfg, dias, roteiro) {
    const planos = [];
    dias.forEach(dia => {
        const abertas = (dia.blocos || []).filter(b => b.tipo === 'atracao').map(b => IDX.atracao(b.atracaoId)).filter(Boolean);
        const expostas = abertas.filter(a => a.chuva === 'baixo');
        if (!expostas.length) return;
        const cobertas = IDX.atracoesDe(dia.cidadeId).filter(a => a.interior && !abertas.some(x => x.id === a.id)).slice(0, 3);
        planos.push({
            data: dia.data, cidade: dia.cidadeNome,
            gatilho: 'Chuva ou vento forte',
            risco: expostas.map(a => a.nome),
            alternativas: cobertas.length ? cobertas.map(a => a.nome) : ['Não há alternativa coberta cadastrada nesta cidade — considere antecipar o programa de outro dia.'],
            nota: 'Ao ativar o plano alternativo, o programa ao ar livre migra para o dia de melhor previsão da mesma cidade.'
        });
    });
    return planos;
}

function selecionarRepresentacoesBrasileiras(cfg, cidadesRota, roteiro) {
    const paises = Array.from(new Set(cidadesRota.map(c => c.dados.paisId)));
    const out = [];
    paises.forEach(p => {
        const reps = IDX.representacoesDe(p);
        const cidadesNoPais = cidadesRota.filter(c => c.dados.paisId === p).map(c => c.dados.nome);
        out.push({
            paisId: p, pais: IDX.pais(p).nome, bandeira: IDX.pais(p).bandeira,
            cidadesDoRoteiro: cidadesNoPais,
            representacoes: reps,
            semRegistro: reps.length === 0
        });
    });
    registrar(roteiro, 'Representação consular',
        'Exibidas as repartições brasileiras dos países do roteiro: ' + paises.map(p => IDX.pais(p).nome).join(', '),
        [['Critério', 'País de cada cidade do roteiro'],
         ['Jurisdição', 'Declarada apenas quando confirmada em fonte oficial; caso contrário, nenhuma competência é afirmada']]);
    return out;
}

/* =====================================================================================
   [11] PONTUAÇÃO (§59) — fórmulas com insumo mensurável, capazes de reprovar
   ===================================================================================== */
function calcularPontuacao(cfg, roteiro) {
    const pesos = pesosObjetivos(cfg);
    const dias = roteiro.dias;
    const atracoesEscolhidas = [];
    dias.forEach(d => (d.blocos || []).forEach(b => { if (b.tipo === 'atracao') atracoesEscolhidas.push(IDX.atracao(b.atracaoId)); }));

    // Interesses: fração do peso dos objetivos efetivamente coberta pelas atrações
    const objetivos = [cfg.objetivoPrincipal].concat(cfg.objetivosSecundarios || []);
    let cobertos = 0;
    objetivos.forEach(o => { if (atracoesEscolhidas.some(a => a && a.cat.indexOf(o) >= 0)) cobertos++; });
    const sInteresses = objetivos.length ? (cobertos / objetivos.length) * 100 : 60;

    // Logística: proporção do tempo útil gasto em deslocamento
    let tVisita = 0, tDesloc = 0;
    dias.forEach(d => (d.blocos || []).forEach(b => {
        if (b.tipo === 'atracao') tVisita += (b.fim - b.ini);
        if (b.tipo === 'desloc') tDesloc += (b.fim - b.ini);
    }));
    const razao = tVisita ? tDesloc / (tVisita + tDesloc) : 0.5;
    const sLogistica = U.clamp(100 - razao * 320, 0, 100);

    // Ritmo: aderência entre atividades/dia planejadas e a faixa do ritmo escolhido
    const alvo = { muito_tranquilo: 2, tranquilo: 3, moderado: 4, intenso: 5, muito_intenso: 6 }[cfg.ritmo] || 4;
    const diasUteis = dias.filter(d => d.tipo === 'normal' || d.tipo === 'transferencia');
    const media = diasUteis.length ? atracoesEscolhidas.length / diasUteis.length : 0;
    const sRitmo = U.clamp(100 - Math.abs(media - alvo) * 26, 0, 100);

    // Perfil: adequação etária e de mobilidade
    let sPerfil = 100;
    if (cfg.viajantes.criancas > 0) {
        const p = atracoesEscolhidas.filter(a => a && a.familia).length / Math.max(1, atracoesEscolhidas.length);
        sPerfil = U.clamp(40 + p * 60, 0, 100);
    } else if (cfg.viajantes.adolescentes > 0) {
        const p = atracoesEscolhidas.filter(a => a && a.juvenil).length / Math.max(1, atracoesEscolhidas.length);
        sPerfil = U.clamp(45 + p * 55, 0, 100);
    }
    if (cfg.caminhada === 'minimizar') {
        const exp = atracoesEscolhidas.filter(a => a && !a.interior).length / Math.max(1, atracoesEscolhidas.length);
        sPerfil = U.clamp(sPerfil - exp * 25, 0, 100);
    }

    // Orçamento: relação entre estimativa e teto informado
    let sOrcamento = 70, notaOrc = 'Sem teto informado — a nota adota valor neutro.';
    if (cfg.orcamentoTotal && roteiro.custos.totalTerrestre) {
        const medio = U.somaFaixa(roteiro.custos.totalTerrestre);
        const r = medio / cfg.orcamentoTotal;
        sOrcamento = r <= 0.8 ? 100 : r <= 1 ? 100 - (r - 0.8) * 150 : U.clamp(70 - (r - 1) * 170, 0, 70);
        notaOrc = 'Estimativa terrestre média equivale a ' + Math.round(r * 100) + '% do teto informado.';
    }

    // Clima
    let sClima = 60, notaClima = 'Avaliação climática indisponível.';
    if (roteiro.clima.length) {
        const probs = roteiro.clima.map(c => c.probChuva).filter(v => v != null);
        if (probs.length) {
            const m = probs.reduce((a, b) => a + b, 0) / probs.length;
            sClima = U.clamp(100 - m * 1.35, 0, 100);
            notaClima = 'Probabilidade média de chuva no período: ' + Math.round(m) + '%.';
        }
    }

    // Transporte e hospedagem
    const trechosOk = roteiro.deslocamentos.filter(t => t.compativel).length;
    const sTransporte = roteiro.deslocamentos.length ? (trechosOk / roteiro.deslocamentos.length) * 100 : 85;
    const hospOk = roteiro.hospedagens.filter(h => !h.semOpcoes).length;
    const sHospedagem = roteiro.hospedagens.length ? (hospOk / roteiro.hospedagens.length) * 100 : 60;

    const itens = [
        { id: 'interesses', rotulo: 'Interesses', valor: sInteresses, peso: CONFIG.pesosPontuacao.interesses, formula: cobertos + ' de ' + objetivos.length + ' objetivos declarados aparecem em ao menos uma atração selecionada.' },
        { id: 'logistica', rotulo: 'Logística', valor: sLogistica, peso: CONFIG.pesosPontuacao.logistica, formula: 'Deslocamento representa ' + Math.round(razao * 100) + '% do tempo ativo. A nota cai 3,2 pontos a cada ponto percentual.' },
        { id: 'perfil', rotulo: 'Perfil dos viajantes', valor: sPerfil, peso: CONFIG.pesosPontuacao.perfil, formula: 'Proporção de atrações adequadas à composição etária, com desconto por exposição ao ar livre quando você pediu minimizar caminhada.' },
        { id: 'ritmo', rotulo: 'Ritmo', valor: sRitmo, peso: CONFIG.pesosPontuacao.ritmo, formula: 'Média de ' + media.toFixed(1) + ' atrações por dia útil contra o alvo de ' + alvo + ' do ritmo escolhido.' },
        { id: 'orcamento', rotulo: 'Orçamento', valor: sOrcamento, peso: CONFIG.pesosPontuacao.orcamento, formula: notaOrc },
        { id: 'clima', rotulo: 'Clima', valor: sClima, peso: CONFIG.pesosPontuacao.clima, formula: notaClima },
        { id: 'transporte', rotulo: 'Transporte', valor: sTransporte, peso: CONFIG.pesosPontuacao.transporte, formula: trechosOk + ' de ' + roteiro.deslocamentos.length + ' trechos compatíveis com o meio de transporte que você escolheu.' },
        { id: 'hospedagem', rotulo: 'Hospedagem', valor: sHospedagem, peso: CONFIG.pesosPontuacao.hospedagem, formula: hospOk + ' de ' + roteiro.hospedagens.length + ' cidades com propriedade concreta cadastrada na base.' }
    ];
    let global = 0;
    itens.forEach(i => { global += i.valor * (i.peso / 100); });
    // Conflitos graves reprovam o roteiro, por mais bonito que ele seja (§82)
    const penalidade = roteiro.conflitos.filter(c => c.grave).length * 12;
    global = U.clamp(global - penalidade, 0, 100);
    return { itens, global: Math.round(global), penalidade };
}

/* =====================================================================================
   [12] VALIDAÇÃO PÓS-GERAÇÃO E REPARAÇÃO (§64, §65)
   ===================================================================================== */
function validarRoteiro(roteiro) {
    const falhas = [];
    const cfg = roteiro.config;
    roteiro.dias.forEach(d => {
        const b = d.blocos || [];
        for (let i = 1; i < b.length; i++) {
            if (b[i].ini < b[i - 1].fim) falhas.push({ tipo: 'sobreposicao', dia: d.data, o: b[i].titulo });
        }
        b.forEach(x => {
            if (x.tipo !== 'atracao') return;
            const a = IDX.atracao(x.atracaoId);
            if (a && a.fechado.indexOf(U.diaSemana(d.data)) >= 0) falhas.push({ tipo: 'fechado', dia: d.data, o: a.nome });
        });
        if (b.length && b[b.length - 1].fim > 24 * 60) falhas.push({ tipo: 'passa_da_meia_noite', dia: d.data, o: b[b.length - 1].titulo });
    });
    const noitesSoma = roteiro.cidades.reduce((s, c) => s + c.noites, 0);
    const noitesEsperadas = U.diffDias(cfg.dataInicio, cfg.dataFim);
    if (noitesSoma !== noitesEsperadas) falhas.push({ tipo: 'noites', o: noitesSoma + ' contra ' + noitesEsperadas });
    const vistos = {};
    roteiro.dias.forEach(d => (d.blocos || []).forEach(b => {
        if (b.tipo === 'atracao') { if (vistos[b.atracaoId]) falhas.push({ tipo: 'duplicada', o: b.titulo }); vistos[b.atracaoId] = 1; }
    }));
    /* Restricao rigida (§25): atracao marcada como "nao quero perder" precisa estar no
       cronograma. A verificacao existe sobretudo para a edicao manual: remove-la e
       admitido, mas nunca em silencio. A reparacao automatica ignora esta falha de
       proposito — reinserir uma atracao que o usuario retirou seria decidir por ele. */
    (cfg.obrigatorias || []).forEach(id => {
        const a = IDX.atracao(id);
        if (a && !vistos[id]) falhas.push({ tipo: 'obrigatoria_ausente', o: a.nome });
    });
    return { ok: falhas.length === 0, falhas };
}

function repararRoteiro(roteiro) {
    let tentativa = 0;
    let v = validarRoteiro(roteiro);
    while (!v.ok && tentativa < CONFIG.maxTentativasReparo) {
        tentativa++;
        v.falhas.forEach(f => {
            if (f.tipo === 'fechado') {
                const dia = roteiro.dias.find(d => d.data === f.dia);
                if (!dia) return;
                const idx = dia.blocos.findIndex(b => b.tipo === 'atracao' && IDX.atracao(b.atracaoId) && IDX.atracao(b.atracaoId).nome === f.o);
                if (idx >= 0) {
                    const removido = dia.blocos.splice(idx, 1)[0];
                    const a = IDX.atracao(removido.atracaoId);
                    roteiro.descartadas.push({ atracao: a, cidade: dia.cidadeNome, motivo: 'Retirada pela reparação automática: fechada em ' + U.dataExtenso(dia.data) + '.' });
                    roteiro.avisos.push('Reparação automática retirou ' + a.nome + ' de ' + U.dataBR(dia.data) + ' — a atração fecha nesse dia da semana.');
                }
            }
            if (f.tipo === 'sobreposicao' || f.tipo === 'passa_da_meia_noite') {
                const dia = roteiro.dias.find(d => d.data === f.dia);
                if (!dia) return;
                let t = dia.blocos.length ? dia.blocos[0].ini : 540;
                dia.blocos.forEach(b => { const dur = b.fim - b.ini; b.ini = t; b.fim = t + dur; t = b.fim; });
            }
        });
        v = validarRoteiro(roteiro);
    }
    roteiro.validacao = { ok: v.ok, falhas: v.falhas, tentativas: tentativa, limite: CONFIG.maxTentativasReparo };
    return roteiro;
}

/* =====================================================================================
   [13] AVALIAÇÃO CLIMÁTICA (§33) — distingue previsão de climatologia
   ===================================================================================== */
async function avaliarClima(cfg, cidadesRota, roteiro) {
    const hoje = U.dataISO(new Date());
    const antecedencia = U.diffDias(hoje, cfg.dataInicio);
    const regime = antecedencia <= 0 ? 'em_andamento' : (antecedencia <= CONFIG.limiteDiasPrevisao ? 'proxima' : 'distante');
    const out = [];
    for (const c of cidadesRota) {
        const dias = roteiro.dias.filter(d => d.cidadeId === c.id).map(d => d.data).sort();
        const ini = dias[0] || cfg.dataInicio, fim = dias[dias.length - 1] || cfg.dataFim;
        let registro = { cidadeId: c.id, cidade: c.dados.nome, glifo: c.dados.glifo, ini, fim, noites: c.noites };
        try {
            // Sem coordenadas não há consulta possível. Chutar um ponto no mapa para
            // fazer o provedor responder devolveria um clima que não é o do destino.
            if (c.dados.lat == null || c.dados.lon == null) {
                throw new Error('Coordenadas não informadas para ' + c.dados.nome + '.');
            }
            if (regime === 'distante') {
                const cl = await Providers.WeatherProvider.climatologia(c.dados, ini, fim);
                Object.assign(registro, {
                    tipo: 'HISTORICO', max: cl.max, min: cl.min, mm: cl.mmPeriodo, probChuva: cl.probChuvaDia,
                    fonte: cl.fonte, consultadoEm: cl.consultadoEm,
                    rotulo: 'Climatologia histórica — não é previsão'
                });
            } else {
                const pv = await Providers.WeatherProvider.previsao(c.dados, ini, fim);
                const ds = pv.dias.length ? pv.dias : [];
                const max = ds.reduce((s, d) => s + (d.max || 0), 0) / Math.max(1, ds.length);
                const min = ds.reduce((s, d) => s + (d.min || 0), 0) / Math.max(1, ds.length);
                const mm = ds.reduce((s, d) => s + (d.mm || 0), 0);
                const prob = ds.reduce((s, d) => s + (d.prob || 0), 0) / Math.max(1, ds.length);
                Object.assign(registro, {
                    tipo: 'EXTERNO', max, min, mm, probChuva: Math.round(prob), detalhe: ds,
                    fonte: pv.fonte, consultadoEm: pv.consultadoEm,
                    rotulo: regime === 'em_andamento' ? 'Condições atuais e previsão' : 'Previsão meteorológica'
                });
            }
        } catch (e) {
            const fb = DB.climatologiaFallback[c.id];
            if (fb) {
                Object.assign(registro, {
                    tipo: 'HISTORICO', max: fb.max, min: fb.min, mm: fb.mm,
                    probChuva: Math.round((fb.diasChuva / 30) * 100),
                    fonte: FONTE_REF + ' — climatologia de contingência (novembro)', consultadoEm: null,
                    rotulo: 'Climatologia de contingência — serviço externo indisponível',
                    degradado: true
                });
            } else {
                Object.assign(registro, { tipo: 'INDISPONIVEL', rotulo: 'Sem dado climático disponível para esta cidade' });
            }
        }
        out.push(registro);
    }
    roteiro.regimeClimatico = regime;
    return out;
}

/* Casa cada mensagem de validarConfig() com o campo do formulário que a resolve — usada
   só pelo botão "# Ir para o campo" em Conflitos. Por palavra-chave, e não por lista de
   códigos, porque as mensagens de validarConfig() já são a fonte da verdade do texto
   mostrado ao usuário; duplicar isso em códigos separados divergiria com o tempo. */
function campoParaErroConfig(msg) {
    if (msg.indexOf('cidade') >= 0) return '#cityDropdownToggle';
    if (msg.indexOf('data de início') >= 0) return '#f_dataInicio';
    if (msg.indexOf('data de término') >= 0 || msg.indexOf('posterior à data de início') >= 0) return '#f_dataFim';
    if (msg.indexOf('viajante') >= 0) return '#f_adultos';
    if (msg.indexOf('objetivo principal') >= 0) return '#chipsObjetivoPrincipal';
    return null;
}

/* =====================================================================================
   [14] ORQUESTRAÇÃO — criarRoteiro(config)
   ===================================================================================== */
async function criarRoteiro(cfg) {
    limparRoteiroAnterior();
    const roteiro = novoRoteiro(cfg);

    const pre = validarConfig(cfg);
    if (!pre.ok) { roteiro.conflitos = pre.erros.map(e => ({ grave: true, titulo: 'Configuração incompleta', campo: campoParaErroConfig(e), problema: e, impacto: 'A geração não pode prosseguir.', opcoes: [] })); return roteiro; }
    pre.avisos.forEach(a => roteiro.conflitos.push({ grave: false, titulo: a.titulo, campo: a.campo || null, problema: a.texto, impacto: 'O sistema não altera sua escolha em silêncio — decida como prefere prosseguir.', opcoes: a.opcoes }));

    // Cidades e noites
    const rota = selecionarCidades(cfg, roteiro);
    calcularNoites(cfg, rota, roteiro);
    roteiro.cidades = rota;

    // Moeda do roteiro: só troca do padrão EUR quando toda a rota pertence a um único
    // país com moeda cadastrada — ver comentário de MOEDA_ATUAL. Precisa ser calculada
    // antes de calcularIngressos()/calcularCustos(), que formatam valores com U.eur().
    const moedasDaRota = Array.from(new Set(rota.map(c => {
        const p = DB.paises[c.dados.paisId];
        return p && p.moeda;
    }).filter(Boolean)));
    const codigoMoeda = (moedasDaRota.length === 1 && CONFIG.simbolosMoeda[moedasDaRota[0]]) ? moedasDaRota[0] : 'EUR';
    MOEDA_ATUAL = { codigo: codigoMoeda, simbolo: CONFIG.simbolosMoeda[codigoMoeda] };
    roteiro.moeda = codigoMoeda;

    // Deslocamentos entre cidades
    for (let i = 0; i < rota.length - 1; i++) {
        const t = IDX.trecho(rota[i].id, rota[i + 1].id);
        const compat = trechoCompativel(cfg, t);
        if (t) {
            roteiro.deslocamentos.push(Object.assign({}, t, { deNome: rota[i].dados.nome, paraNome: rota[i + 1].dados.nome, compativel: compat }));
            if (!compat) roteiro.avisos.push('O trecho ' + rota[i].dados.nome + ' → ' + rota[i + 1].dados.nome + ' é feito de ' + t.modo + ', diferente do transporte que você preferiu.');
            continue;
        }
        const est = estimarTrechoPorDistancia(rota[i].dados, rota[i + 1].dados);
        if (est) {
            roteiro.deslocamentos.push(Object.assign({}, est, { de: rota[i].id, para: rota[i + 1].id, deNome: rota[i].dados.nome, paraNome: rota[i + 1].dados.nome, compativel: true }));
            roteiro.avisos.push('O trecho ' + rota[i].dados.nome + ' → ' + rota[i + 1].dados.nome + ' não está cadastrado na base: duração e custo foram estimados por distância geográfica (' + est.distanciaKm + ' km) e ficam ajustáveis no console de edição.');
            continue;
        }
        roteiro.deslocamentos.push({ de: rota[i].id, para: rota[i + 1].id, deNome: rota[i].dados.nome, paraNome: rota[i + 1].dados.nome, modo: 'indisponivel', icone: '❓', duracao: null, custoPP: null, compativel: false, obs: 'Trecho não cadastrado na base e sem coordenadas suficientes para estimar por distância. O sistema não inventa duração nem preço.' });
    }

    // Distribuição de datas e tipos de dia
    let cursor = cfg.dataInicio;
    const todosOsDias = [];
    rota.forEach((c, ci) => {
        const datas = [], tipos = [];
        for (let n = 0; n < c.noites; n++) {
            const data = U.addDias(cursor, n);
            datas.push(data);
            tipos.push(ci === 0 && n === 0 ? 'chegada' : (n === 0 ? 'transferencia' : 'normal'));
        }
        if (ci === rota.length - 1) { datas.push(cfg.dataFim); tipos.push('partida'); }
        cursor = U.addDias(cursor, c.noites);
        const pool = selecionarAtracoes(cfg, c, roteiro);
        const dias = montarDiasDaCidade(cfg, c, pool, datas, tipos, roteiro);
        todosOsDias.push.apply(todosOsDias, dias);
    });

    roteiro.dias = montarCronograma(cfg, todosOsDias, roteiro);
    roteiro.atracoes = [];
    roteiro.dias.forEach(d => (d.blocos || []).forEach(b => { if (b.tipo === 'atracao') roteiro.atracoes.push(IDX.atracao(b.atracaoId)); }));

    roteiro.voos = selecionarVoos(cfg, rota, roteiro);
    roteiro.hospedagens = selecionarHospedagens(cfg, rota, roteiro);
    roteiro.alimentacao = rota.map(c => DB.alimentacao.find(a => a.cidadeId === c.id)).filter(Boolean);
    roteiro.ingressos = calcularIngressos(cfg, roteiro.dias, roteiro);
    roteiro.custos = calcularCustos(cfg, rota, roteiro.dias, roteiro.ingressos, roteiro);
    roteiro.planoB = gerarPlanoB(cfg, roteiro.dias, roteiro);
    roteiro.representacoes = selecionarRepresentacoesBrasileiras(cfg, rota, roteiro);

    // Dados externos
    roteiro.clima = await avaliarClima(cfg, rota, roteiro);
    try {
        roteiro.cambio = await Providers.ExchangeRateProvider.taxa(MOEDA_ATUAL.codigo, 'BRL');
    } catch (e) { roteiro.cambio = naoDisponivel('Serviço de câmbio indisponível no momento'); }

    repararRoteiro(roteiro);
    roteiro.pontuacao = calcularPontuacao(cfg, roteiro);

    roteiro.fontes = [
        { nome: FONTE_REF, uso: 'Endereços, tarifas oficiais registradas, hospedagens concretas e climatologia de contingência' },
        { nome: Providers.WeatherProvider.nome + ' (' + Providers.WeatherProvider.site + ')', uso: 'Previsão meteorológica e reanálise climatológica' },
        { nome: Providers.ExchangeRateProvider.nome, uso: 'Taxa de câmbio ' + MOEDA_ATUAL.codigo + '/BRL' },
        { nome: 'Ministério das Relações Exteriores — Portal Consular', uso: 'Identificação das representações brasileiras (dados de contato não verificáveis automaticamente)' }
    ];
    roteiro.atualizadoEm = new Date().toISOString();
    return roteiro;
}
/* =====================================================================================
   [15] COMPONENTES DE RENDERIZAÇÃO
   Funções puras: recebem o objeto do roteiro e devolvem marcação. Nenhuma delas lê
   variável global de roteiro anterior — é o que garante o isolamento do §7.
   ===================================================================================== */
const R = {
    tt(texto, ajuda) {
        return '<span class="tt" tabindex="0">' + U.esc(texto) + '<span class="tt-body">' + ajuda + '</span></span>';
    },
    selo(tipo, fonte, consultadoEm, extra) {
        const p = PROV[tipo] || PROV.INDISPONIVEL;
        let corpo = '<b>' + p.rotulo + '.</b> ' + p.ajuda;
        if (fonte) corpo += '<br>Fonte: ' + U.esc(fonte) + '.';
        if (consultadoEm) corpo += '<br>Consultado em ' + U.esc(consultadoEm) + '.';
        else if (fonte) corpo += '<br>Data da consulta não registrada.';
        if (extra) corpo += '<br>' + extra;
        return '<span class="prov ' + p.classe + ' tt" tabindex="0">' + p.rotulo +
            '<span class="tt-body">' + corpo + '</span></span>';
    },
    /* Legenda fixa dos selos — sem ela, entender o eixo de proveniência exige passar
       o mouse ou o foco em cada selo individualmente para ler o tooltip. Gerada a
       partir de PROV, então nunca destoa dos selos reais. */
    legendaProv() {
        const itens = Object.keys(PROV).map(k => {
            const p = PROV[k];
            return '<li><span class="prov ' + p.classe + '">' + p.rotulo + '</span><span>' + U.esc(p.ajuda) + '</span></li>';
        }).join('');
        return '<details class="prov-legenda"><summary>Como ler os selos de proveniência (' + Object.keys(PROV).length + ')</summary>' +
            '<ul>' + itens + '</ul></details>';
    },
    valorOuNada(d, formatador) {
        if (!d || d.tipo === 'INDISPONIVEL' || d.valor == null) {
            return '<span class="indisponivel">Informação não disponível</span>' +
                R.selo('INDISPONIVEL', d && d.fonte ? d.fonte : null, null);
        }
        const v = formatador ? formatador(d.valor) : U.esc(d.valor);
        return v + R.selo(d.tipo, d.fonte, d.consultadoEm, d.nota ? U.esc(d.nota) : null);
    },
    maps(nome, endereco) {
        if (!endereco) return '';
        return '<a class="map-link" target="_blank" rel="noopener" href="' + U.esc(U.mapsUrl(nome, endereco)) + '">Google Maps ↗</a>';
    },
    /* Agrupamento de endereços por categoria (aeroportos, estações, hospedagens, atrações,
       representações) — compartilhado por Render.enderecos e Render.resumoExecutivo para
       não duplicar a lógica de agregação. */
    gruposEndereco(r) {
        const grupos = [];
        const aeros = r.cidades.map(c => (c.dados.aeroportos || []).map(a => IDX.aeroporto(a))).flat().filter(Boolean);
        if (aeros.length) grupos.push(['✈️ Aeroportos', aeros.map(a => ({ nome: a.nome, sub: a.codigo, end: a.endereco, fonte: a.fonte }))]);
        const ests = r.cidades.map(c => (c.dados.estacoes || []).map(e => IDX.estacao(e))).flat().filter(Boolean);
        if (ests.length) grupos.push(['🚆 Estações', ests.map(e => ({ nome: e.nome, sub: '', end: e.endereco, fonte: e.fonte }))]);
        const hots = r.hospedagens.map(hp => hp.opcoes).flat();
        if (hots.length) grupos.push(['🏨 Hospedagens', hots.map(o => ({ nome: o.nome, sub: o.categoria, end: o.endereco, fonte: o.fonte }))]);
        const ats = Array.from(new Set(r.atracoes.map(a => a.id))).map(id => IDX.atracao(id));
        if (ats.length) grupos.push(['📍 Atrações', ats.map(a => ({ nome: a.nome, sub: a.cat[0], end: a.endereco, fonte: FONTE_REF }))]);
        const reps = r.representacoes.map(p => p.representacoes).flat().filter(x => x.endereco && x.endereco.valor);
        grupos.push(['🇧🇷 Representações brasileiras', reps.length ? reps.map(x => ({ nome: x.nomeOficial, sub: x.cidade, end: x.endereco.valor, fonte: x.fonte })) : []]);
        return grupos;
    },
    porque(linhas, totalRotulo) {
        if (!linhas || !linhas.length) return '';
        let h = '<details class="porque"><summary>Por que esta decisão?</summary><table>';
        linhas.forEach(l => { h += '<tr><td>' + U.esc(l[0]) + '</td><td>' + U.esc(l[1]) + '</td></tr>'; });
        if (totalRotulo) h += '<tr class="tot"><td>' + U.esc(totalRotulo[0]) + '</td><td>' + U.esc(totalRotulo[1]) + '</td></tr>';
        return h + '</table></details>';
    },
    secao(id, eyebrow, titulo, corpo, tocRotulo, tocAjuda) {
        return { id, eyebrow, titulo, corpo, tocRotulo, tocAjuda };
    },
    /* Lista "Trechos entre cidades" — vive em Voos & Conexões (transporte aéreo + terrestre
       concentrados numa só aba), separada do mapa visual da jornada (Render.jornada). */
    trechosEntreCidades(r) {
        let h = '<h3>Trechos entre cidades</h3><div class="trecho-list">';
        r.deslocamentos.forEach((t, idx) => {
            const estimado = !!(t.estimadoPorDistancia || t.ajustadoPeloUsuario);
            h += '<div class="trecho-row">';
            h += '<div class="trecho-titulo">' + U.esc(t.deNome) + ' → ' + U.esc(t.paraNome) + '</div>';
            h += '<div class="trecho-detalhes">';
            h += '<span>' + t.icone + ' ' + U.esc(t.modo) +
                (t.categoria ? ' <span class="chip chip-cat-' + U.esc(t.categoria) + '">' + U.esc({ alta_velocidade: 'alta velocidade', regional: 'regional' }[t.categoria] || t.categoria) + '</span>' : '') +
                (t.compativel ? '' : ' <span class="risk risk-mid">difere da preferência</span>') + '</span>';
            h += '<span>' + (t.duracao ? U.dur(t.duracao) + R.selo(estimado ? 'ESTIMADO' : 'CADASTRADO', t.fonte, null, estimado ? 'Estimativa por distância, não trecho pesquisado.' : 'Duração porta a porta estimada.') : '<span class="indisponivel">duração não disponível</span>') + '</span>';
            h += '<span>' + (t.custoPP ? U.faixaEur(t.custoPP[0], t.custoPP[1]) + '/pessoa' + R.selo(estimado ? 'ESTIMADO' : 'CADASTRADO', t.fonte, null) : '<span class="indisponivel">custo não disponível</span>' + R.selo('INDISPONIVEL')) + '</span>';
            if (t.obs) h += '<span class="td-obs">' + U.esc(t.obs) + '</span>';
            if (estimado) {
                h += '<span class="trecho-ajuste-inline" title="Trecho sem curadoria — a estimativa por distância pode ser corrigida livremente aqui.">' +
                    '<label>Duração (min)</label><input type="number" min="1" value="' + t.duracao + '" data-ed="trecho" data-idx="' + idx + '" data-tcampo="duracao" title="Substitui a duração estimada pelo valor que você pesquisar ou souber para este trecho.">' +
                    '<label>Custo mín. (' + MOEDA_ATUAL.simbolo.trim() + ')</label><input type="number" min="0" value="' + (t.custoPP ? t.custoPP[0] : 0) + '" data-ed="trecho" data-idx="' + idx + '" data-tcampo="custoMin" title="Substitui o piso da faixa de custo por pessoa estimada.">' +
                    '<label>Custo máx. (' + MOEDA_ATUAL.simbolo.trim() + ')</label><input type="number" min="0" value="' + (t.custoPP ? t.custoPP[1] : 0) + '" data-ed="trecho" data-idx="' + idx + '" data-tcampo="custoMax" title="Substitui o teto da faixa de custo por pessoa estimada.">' +
                    '</span>';
            }
            h += '</div></div>';
        });
        h += '</div>';
        return h;
    }
};

const Render = {
    /* --------------------------------------------------------------- RESUMO */
    resumo(r) {
        const cfg = r.config;
        const cidades = r.cidades.map(c => c.dados.nome + ' (' + c.noites + 'n)').join(' · ');
        const v = cfg.viajantes;
        const comp = [];
        if (v.adultos) comp.push(v.adultos + ' adulto' + (v.adultos > 1 ? 's' : ''));
        if (v.adolescentes) comp.push(v.adolescentes + ' adolescente' + (v.adolescentes > 1 ? 's' : ''));
        if (v.criancas) comp.push(v.criancas + ' criança' + (v.criancas > 1 ? 's' : ''));
        const obj = CATALOGO.objetivos.find(o => o.id === cfg.objetivoPrincipal);
        const ritmo = (CONFIG.ritmos[cfg.ritmo] || {}).rotulo;
        const dias = r.dias.length;

        let h = '<p class="lede">' + U.esc(r.cidades.map(c => c.dados.nome).join(', ')) +
            ' em ' + dias + ' dias, para ' + U.esc(comp.join(' + ')) + ', com ênfase em ' +
            U.esc(obj ? obj.rotulo.toLowerCase() : '—') + '. Todo o conteúdo abaixo decorre das respostas do formulário: alterar qualquer uma delas reconstrói o roteiro inteiro.</p>';

        h += '<div class="highlight-strip">';
        h += '<div class="highlight-card"><span class="hg">📅</span><span class="hn">' + dias + ' dias</span><span class="hd">' + U.dataBR(cfg.dataInicio) + ' – ' + U.dataBR(cfg.dataFim) + '</span></div>';
        h += '<div class="highlight-card"><span class="hg">🌍</span><span class="hn">' + r.cidades.length + ' cidade' + (r.cidades.length > 1 ? 's' : '') + '</span><span class="hd">' + U.esc(r.cidades.reduce((s, c) => s + c.noites, 0)) + ' noites</span></div>';
        h += '<div class="highlight-card"><span class="hg">👥</span><span class="hn">' + v.total + ' viajante' + (v.total > 1 ? 's' : '') + '</span><span class="hd">' + U.esc(comp.join(' + ')) + '</span></div>';
        h += '<div class="highlight-card"><span class="hg">📍</span><span class="hn">' + r.atracoes.length + ' atrações</span><span class="hd">ritmo ' + U.esc((ritmo || '').toLowerCase()) + '</span></div>';
        h += '<div class="highlight-card"><span class="hg">⭐</span><span class="hn">' + r.pontuacao.global + '/100</span><span class="hd">compatibilidade</span></div>';
        h += '</div>';

        h += '<h3>Parâmetros que geraram este roteiro</h3><div class="ind-grid">';
        const params = [
            ['ind-teal', 'Origem', cfg.origem || 'Não informada'],
            ['ind-blue', 'Entrada internacional', r.cidades[0].dados.nome],
            ['ind-blue', 'Saída internacional', r.cidades[r.cidades.length - 1].dados.nome],
            ['ind-gold', 'Cidades e noites', cidades],
            ['ind-coral', 'Objetivo principal', obj ? obj.rotulo : '—'],
            ['ind-olive', 'Objetivos secundários', (cfg.objetivosSecundarios || []).map(o => (CATALOGO.objetivos.find(x => x.id === o) || {}).rotulo).filter(Boolean).join(', ') || 'Nenhum'],
            ['ind-teal', 'Ritmo', ritmo],
            ['ind-brown', 'Caminhada', (CATALOGO.caminhada.find(c => c.id === cfg.caminhada) || {}).rotulo || '—'],
            ['ind-gold', 'Classe de orçamento', (CONFIG.orcamento[cfg.orcamento] || {}).rotulo || '—'],
            ['ind-blue', 'Transporte entre cidades', (CATALOGO.transporteInterno.find(t => t.id === cfg.transporteInterno) || {}).rotulo || 'Combinação']
        ];
        params.forEach(p => {
            h += '<div class="ind-card ' + p[0] + '"><div class="lbl">' + U.esc(p[1]) + '</div><div class="desc">' + U.esc(p[2]) + '</div></div>';
        });
        h += '</div>';

        if (r.avisos.length) {
            h += '<div class="callout callout-nota"><strong>Notas da geração.</strong><ul style="margin:6px 0 0;padding-left:18px;">' +
                r.avisos.map(a => '<li>' + U.esc(a) + '</li>').join('') + '</ul></div>';
        }
        h += Render.corpoConflitos(r);
        h += '<p class="source-note">Versão do motor ' + CONFIG.versao + ' · roteiro ' + U.esc(r.id) +
            ' · gerado em ' + new Date(r.criadoEm).toLocaleString('pt-BR') + '.</p>';
        h += R.legendaProv();
        return R.secao('sec-resumo', 'Visão geral', '📊 Resumo do roteiro', h, '📊 Resumo do roteiro', 'Perfil da viagem, parâmetros informados, conflitos e decisões pendentes.');
    },

    /* --------------------------------------------------------------- JORNADA */
    jornada(r) {
        const cfg = r.config;
        let h = '<p class="lede">Sequência efetiva da viagem, com o ícone de cada trecho refletindo o meio de transporte cadastrado.</p>';
        h += '<div class="journey"><span class="caption">Mapa da jornada</span>';
        const paradas = [];
        if (cfg.origem) paradas.push({ glifo: '🏠', nome: cfg.origem, tick: 'origem' });
        r.cidades.forEach(c => paradas.push({ glifo: c.dados.glifo, nome: c.dados.nome, tick: c.noites + ' noites' }));
        if (cfg.origem) paradas.push({ glifo: '🏠', nome: cfg.origem, tick: 'retorno' });

        paradas.forEach((p, i) => {
            h += '<div class="stop" style="--i:' + i + '"><div class="glyph">' + p.glifo + '</div><small>' +
                U.esc(p.nome.toUpperCase()) + '</small><span class="tick">' + U.esc(p.tick) + '</span></div>';
            if (i < paradas.length - 1) {
                let modo = 'aviao', icone = '✈️', rot = 'voo';
                const ci = cfg.origem ? i - 1 : i;
                if (ci >= 0 && ci < r.deslocamentos.length) {
                    const t = r.deslocamentos[ci];
                    modo = t.modo; icone = t.icone; rot = t.duracao ? U.dur(t.duracao) : 'sem dado';
                }
                const cls = modo === 'trem' ? 'by-train' : (modo === 'carro' ? 'by-car' : '');
                h += '<div class="leg" style="--i:' + i + '"><div class="rail"></div><div class="glow"></div>' +
                    '<div class="craft ' + cls + '">' + icone + '</div><span class="mode">' + U.esc(rot) + '</span></div>';
            }
        });
        h += '</div>';
        return R.secao('sec-jornada', 'Logística', '🗺️ Mapa da jornada', h, '🗺️ Mapa da jornada', 'Sequência visual de cidades e trechos da viagem, com o meio de transporte e a duração de cada etapa.');
    },

    /* --------------------------------------------------------------- CONFLITOS
       Absorvido dentro de "Resumo do roteiro" (não é mais seção própria) — devolve só o
       corpo HTML, vazio quando não há conflito, preservando o comportamento de antes em
       que a seção inteira sumia (callout de "validação aprovada" também não aparecia
       isolado sem conflito nenhum para contextualizá-lo). */
    corpoConflitos(r) {
        if (!r.conflitos.length) return '';
        let h = '<h3 style="margin-top:20px;">⚠️ Conflitos e decisões pendentes</h3>';
        h += '<p class="lede">O sistema jamais altera em silêncio o que você escolheu. Quando a configuração e a realidade não cabem uma na outra, o conflito é exposto com as opções de resolução.</p>';
        r.conflitos.forEach(c => {
            h += '<div class="conflito' + (c.grave ? '' : ' aviso') + '">';
            h += '<h4>' + (c.grave ? '⚠️ CONFLITO DETECTADO' : '⚠️ ATENÇÃO') + ' — ' + U.esc(c.titulo) +
                (c.campo ? ' <button type="button" class="btn-ghost conflito-ir" data-campo-ir="' + U.esc(c.campo) + '" title="Vai direto até o campo do formulário mais relevante para resolver isto, abrindo a seção se estiver fechada."># Ir para o campo</button>' : '') +
                '</h4>';
            h += '<p style="margin:4px 0;"><strong>Problema.</strong> ' + U.esc(c.problema) + '</p>';
            h += '<p style="margin:4px 0;"><strong>Impacto.</strong> ' + U.esc(c.impacto) + '</p>';
            if (c.opcoes && c.opcoes.length) {
                h += '<div class="opcoes">' + c.opcoes.map(o => '<span class="chip chip-cost">' + U.esc(o) + '</span>').join('') + '</div>';
            }
            h += '</div>';
        });
        if (r.validacao && !r.validacao.ok) {
            h += '<div class="callout callout-atencao"><strong>Validação final.</strong> Restaram ' + r.validacao.falhas.length +
                ' inconsistência(s) após ' + r.validacao.tentativas + ' tentativa(s) de reparo automático (limite de ' + r.validacao.limite + ').</div>';
        } else {
            h += '<div class="callout callout-dica"><strong>Validação final aprovada.</strong> Nenhuma sobreposição de horário, nenhuma visita em dia de fechamento e nenhuma duplicação de atração. ' +
                (r.validacao && r.validacao.tentativas ? 'Foram necessárias ' + r.validacao.tentativas + ' rodada(s) de reparo automático.' : 'Nenhum reparo foi necessário.') + '</div>';
        }
        return h;
    },

    /* --------------------------------------------------------------- CLIMA */
    clima(r) {
        const regime = { distante: 'Viagem distante — a base é a climatologia histórica, jamais apresentada como previsão.', proxima: 'Viagem próxima — previsão meteorológica determinística disponível para o período.', em_andamento: 'Viagem em andamento — condições atuais somadas à previsão.' }[r.regimeClimatico];
        let h = '<p class="lede">' + U.esc(regime || '') + '</p>';
        h += '<div class="climate-grid">';
        r.clima.forEach(c => {
            if (c.tipo === 'INDISPONIVEL') {
                h += '<div class="climate-card"><div class="cc-head"><span class="cc-city">' + (c.glifo || '') + ' ' + U.esc(c.cidade) + '</span></div>' +
                    '<p class="indisponivel" style="margin:10px 0 0;">Sem dado climático disponível.</p>' + R.selo('INDISPONIVEL') + '</div>';
                return;
            }
            const risco = c.probChuva >= 45 ? 'flag-alert' : (c.probChuva >= 28 ? 'flag-best-w' : 'flag-ok');
            const riscoTxt = c.probChuva >= 45 ? '⚠️ Risco pluviométrico alto — plano B necessário' : (c.probChuva >= 28 ? 'Risco moderado de chuva' : 'Baixo risco de chuva');
            h += '<div class="climate-card">';
            h += '<div class="cc-head"><span class="cc-city">' + (c.glifo || '') + ' ' + U.esc(c.cidade) + '</span><span class="cc-days">' + U.dataBR(c.ini) + '–' + U.dataBR(c.fim) + ' · ' + c.noites + ' noites</span></div>';
            h += '<div class="cc-temps"><span class="cc-max">' + Math.round(c.max) + '°C</span><span class="cc-sep">/</span><span class="cc-min">' + Math.round(c.min) + '°C</span></div>';
            // Montado à mão, e não com R.tt() — R.tt() escapa o texto do gatilho (correto
            // para os demais usos, onde é texto livre), o que aqui transformava o <b> em
            // código visível em vez de negrito. O texto do gatilho é seguro por
            // construção (só número calculado e marcação fixa, nunca dado externo).
            h += '<div class="cc-rain"><span class="tt" tabindex="0">🌧️ <b>' + c.probChuva + '%</b> de chance de chuva por dia<span class="tt-body">' +
                (c.tipo === 'HISTORICO'
                    ? 'Calculado como a proporção de dias com precipitação igual ou superior a 1 mm na mesma janela de calendário dos três anos anteriores. <b>Não é previsão.</b>'
                    : 'Maior probabilidade diária de precipitação prevista para o período, obtida do provedor meteorológico.') +
                '</span></span></div>';
            h += '<ul class="cc-meta"><li>Precipitação no período: <b>' + Math.round(c.mm) + ' mm</b></li>' +
                '<li>' + U.esc(c.rotulo) + '</li></ul>';
            h += '<span class="cc-flag ' + risco + '">' + U.esc(riscoTxt) + '</span>';
            h += '<p class="source-note">' + R.selo(c.tipo, c.fonte, c.consultadoEm) + '</p>';
            h += '</div>';
        });
        h += '</div>';
        h += '<div class="callout callout-atencao"><strong>Distinção deliberada.</strong> Climatologia histórica descreve o que costuma acontecer; previsão descreve o que se espera acontecer. O sistema nunca troca uma pela outra, e o selo em cada card informa qual das duas você está lendo.</div>';
        return R.secao('sec-clima', 'Ambiente', '🌦️ Clima e chuva', h, '🌦️ Clima & Chuva', 'Temperatura, precipitação e risco pluviométrico por cidade, distinguindo previsão de climatologia histórica.');
    },

    /* --------------------------------------------------------------- VOOS */
    voos(r) {
        let h = '<p class="lede">Sem provedor aberto de tarifas aéreas, o sistema apresenta a rota sugerida e deixa explicitamente em branco o que não pode confirmar. Informe abaixo o voo efetivamente emitido para que ele seja incorporado como dado confirmado.</p>';
        r.voos.forEach(v => {
            h += '<div class="flight-box"><h3>' + U.esc(v.sentido) + ' — ' + U.dataExtenso(v.data) + '</h3><div class="flight-grid">';
            h += '<div class="flight-item"><span class="small">Origem</span><strong>' + U.esc(v.origem) + '</strong></div>';
            h += '<div class="flight-item"><span class="small">Destino</span><strong>' + U.esc(v.destino) + (v.codigo ? ' (' + v.codigo + ')' : '') + '</strong></div>';
            if (vooTemDado(v.manual)) {
                const m = v.manual;
                const resumo = [[m.companhia, m.numero].filter(Boolean).join(' '), m.data ? U.dataBR(m.data) : '',
                    [m.horaPartida, m.horaChegada].filter(Boolean).join(' → ')].filter(Boolean).join(' · ');
                h += '<div class="flight-item"><span class="small">Voo informado por você</span><strong>' + U.esc(resumo || '—') + '</strong>' + R.selo('CONFIRMADO', 'Entrada manual do viajante', null) + '</div>';
                if (m.precoPago != null) {
                    h += '<div class="flight-item"><span class="small">Preço pago por pessoa</span><strong>' + U.eur(m.precoPago) + '</strong>' + R.selo('CONFIRMADO', 'Entrada manual do viajante', null) + '</div>';
                }
                if (m.obs) h += '<div class="flight-item"><span class="small">Observação</span><strong>' + U.esc(m.obs) + '</strong></div>';
            } else {
                h += '<div class="flight-item"><span class="small">Número, horário e tarifa</span><strong class="indisponivel">Informação não disponível</strong>' + R.selo('INDISPONIVEL', 'Nenhum provedor aberto de tarifas', null) + '</div>';
            }
            if (v.cadastro) {
                const cd = v.cadastro;
                const companhias = Array.from(new Set(cd.pernas.flatMap(p => p.companhias || []))).join(' · ') || 'companhia não confirmada';
                const duracao = cd.pernas.reduce((s, p) => s + (p.duracaoMin || 0), 0);
                const fontes = cd.pernas.map(p => p.fonte).filter(Boolean).join(' · ');
                h += '<div class="flight-item"><span class="small">' + (cd.tipo === 'direto' ? 'Rota direta pesquisada' : 'Conexão usual via ' + U.esc(cd.hub)) +
                    '</span><strong>' + U.esc(companhias) + '</strong>' +
                    R.selo('CADASTRADO', fontes, null, 'Rota pesquisada em fonte aberta — não é o horário nem o número do seu voo específico. A malha aérea muda por temporada; confirme na companhia antes de comprar.') + '</div>';
                if (duracao) h += '<div class="flight-item"><span class="small">Duração estimada de voo</span><strong>~' + U.dur(duracao) + '</strong></div>';
                const freqs = cd.pernas.map(p => p.frequencia).filter(Boolean);
                if (freqs.length) h += '<div class="flight-item"><span class="small">Frequência pesquisada</span><strong>' + U.esc(freqs.join(' + ')) + '</strong></div>';
            }
            h += '</div><p class="source-note">' + U.esc(v.obs) + '</p></div>';
        });
        h += '<div class="callout callout-nota"><strong>Rota aérea sugerida, não itinerário emitido.</strong> ' + U.esc(Providers.FlightProvider.motivo) + '</div>';
        h += R.trechosEntreCidades(r);
        return R.secao('sec-voos', 'Transporte', '✈️ Voos e conexões', h, '✈️ Voos & Conexões', 'Rota aérea de entrada e saída, mais os trechos terrestres entre cidades — modo, duração e custo de cada deslocamento.');
    },

    /* --------------------------------------------------------------- CRONOGRAMA */
    cronograma(r) {
        let h = '<p class="lede">Cada dia é montado com horários reais, deslocamentos explícitos e sem sobreposição. O dia de chegada e o de partida recebem carga reduzida por construção. O cronograma abaixo é editável: acrescente, remova, mova ou reposicione blocos, feche intervalos quando quiser, e desfaça ou refaça o caminho. O sistema revalida e recalcula tudo a cada alteração.</p>';
        h += Edicao.painel(r);
        r.dias.forEach((d, i) => {
            const rotuloTipo = { chegada: 'chegada', partida: 'partida', transferencia: 'transferência', normal: '' }[d.tipo];
            h += '<div class="dia-head"><span class="dia-n">' + String(i + 1).padStart(2, '0') + '</span>' +
                '<span class="dia-data">' + U.dataExtenso(d.data) + '</span>' +
                '<span class="dia-cidade">' + U.esc(d.cidadeNome) + (rotuloTipo ? ' · ' + rotuloTipo : '') + '</span>' +
                '<span class="chip chip-day">' + R.tt('capacidade ' + U.dur(d.capacidade),
                    'Minutos de visita disponíveis neste dia. Vem da janela do ritmo <b>' + U.esc((CONFIG.ritmos[r.config.ritmo] || {}).rotulo) +
                    '</b>, descontadas as refeições e multiplicada pela taxa de ocupação do ritmo. Dias de chegada e partida recebem fatores de 35% e 30%.') + '</span></div>';
            h += '<div class="sched">';
            (d.blocos || []).forEach((b, j) => {
                const cls = b.tipo === 'desloc' ? ' is-desloc' : (b.tipo === 'refeicao' ? ' is-refeicao' : '');
                h += '<div class="sched-row' + cls + '">';
                h += '<div class="sched-hora">' + U.hhmm(b.ini) + '–' + U.hhmm(b.fim) + '</div>';
                h += '<div class="sched-ico">' + b.icone + '</div>';
                h += '<div><div class="sched-t">' + U.esc(b.titulo) + '</div>' +
                    (b.desc ? '<div class="sched-d">' + U.esc(b.desc) + '</div>' : '') +
                    (b.porque ? R.porque(b.porque, ['Pontuação final', String(b.score)]) : '') +
                    Edicao.controles(r, i, j, b, d) + '</div>';
                h += '<div class="sched-val">' + U.dur(b.fim - b.ini) + '</div>';
                h += '</div>';
            });
            h += '</div>';
            h += Edicao.acoesDia(r, i, d);
        });
        return R.secao('sec-cronograma', 'Dia a dia', '📅 Cronograma detalhado', h, '📅 Cronograma', 'Programação hora a hora, com deslocamentos, refeições e justificativa de cada atração selecionada.');
    },

    /* --------------------------------------------------------------- ATRAÇÕES */
    atracoes(r) {
        let h = '<p class="lede">Todas as atrações selecionadas, com o motivo da escolha aberto à inspeção. Abaixo, as que ficaram de fora e por quê.</p>';
        const porCidade = {};
        r.dias.forEach(d => (d.blocos || []).forEach(b => {
            if (b.tipo !== 'atracao') return;
            (porCidade[d.cidadeNome] = porCidade[d.cidadeNome] || []).push({ b, data: d.data });
        }));
        Object.keys(porCidade).forEach(cid => {
            h += '<h3>' + U.esc(cid) + '</h3><div class="hotel-grid">';
            porCidade[cid].forEach(({ b, data }) => {
                const a = IDX.atracao(b.atracaoId);
                if (!a) return;
                h += '<div class="hotel-card h-teal"><div class="hotel-head"><div>' +
                    '<h4 class="hotel-name">' + U.esc(a.nome) + '</h4>' +
                    '<span class="hotel-cat">' + U.esc(a.cat.join(' · ')) + '</span></div>' +
                    '<span class="hotel-price">' + U.dur(a.dur) + '</span></div>';
                h += '<p class="hotel-body">' + U.esc(a.desc) + '</p>';
                h += '<ul class="hotel-meta">';
                h += '<li><b>Quando:</b> ' + U.dataExtenso(data) + '</li>';
                h += '<li><b>Endereço:</b> ' + U.esc(a.endereco) + ' ' + R.maps(a.nome, a.endereco) + '</li>';
                h += '<li><b>Horário:</b> ' + R.valorOuNada(a.horario) + '</li>';
                h += '<li><b>Reserva:</b> ' + (a.reserva ? 'obrigatória ou fortemente recomendada' : 'não exigida') + '</li>';
                if (a.fechado.length) h += '<li><b>Fecha:</b> ' + a.fechado.map(d => ['domingos', 'segundas', 'terças', 'quartas', 'quintas', 'sextas', 'sábados'][d]).join(', ') + '</li>';
                if (a.oficial) h += '<li><b>Sítio oficial:</b> <a class="map-link" target="_blank" rel="noopener" href="' + U.esc(a.oficial) + '">abrir ↗</a></li>';
                h += '</ul>';
                h += R.porque(b.porque, ['Pontuação final', String(b.score)]);
                h += '</div>';
            });
            h += '</div>';
        });

        if (r.descartadas.length) {
            h += '<h3>Atrações consideradas e não incluídas</h3>';
            h += '<table class="tbl-sejud"><thead><tr><th>Atração</th><th>Cidade</th><th>Motivo</th><th>' +
                R.tt('Reinserir', 'Devolve a atração ao cronograma, no dia que você escolher entre os dias daquela cidade. ' +
                    'A inserção ocorre antes do jantar e da logística de fim de dia, os blocos seguintes são reencadeados e ' +
                    'ingressos, custos, plano B e nota são recalculados. Se a atração for uma das que você marcou como ' +
                    '<b>“não quero perder”</b>, a volta <b>desfaz o conflito grave</b> correspondente e devolve os doze pontos descontados. ' +
                    'Atrações barradas por idade mínima não são oferecidas: é restrição rígida.') + '</th></tr></thead><tbody>';
            r.descartadas.slice(0, 30).forEach(d => {
                h += '<tr><td><strong>' + U.esc(d.atracao.nome) + '</strong></td><td>' + U.esc(d.cidade) + '</td><td>' + U.esc(d.motivo) + '</td>' +
                    '<td>' + Edicao.seletorReinserir(r, d.atracao) + '</td></tr>';
            });
            h += '</tbody></table><p class="source-note">Nenhuma atração desaparece sem explicação: esta é a resposta à pergunta “por que determinada atração ficou de fora?”. A coluna de reinserção devolve a decisão a você: o motivo do descarte é informativo, não impeditivo.</p>';
        }
        return R.secao('sec-atracoes', 'Seleção', '📍 Atrações e justificativas', h, '📍 Atrações', 'Atrações escolhidas com a pontuação que motivou cada escolha, e a lista das descartadas com o motivo.');
    },

    /* --------------------------------------------------------------- HOSPEDAGEM */
    hospedagem(r) {
        let h = '<p class="lede">Sem provedor aberto de tarifas hoteleiras, o preço aparece apenas como faixa estimada da classe de orçamento escolhida — nunca como diária praticada. As propriedades nominais vêm da curadoria manual da base.</p>';
        r.hospedagens.forEach(hp => {
            h += '<h3>' + U.esc(hp.cidadeNome) + ' — ' + hp.noites + ' noite' + (hp.noites > 1 ? 's' : '') + '</h3>';
            h += '<div class="ind-card ind-gold"><div class="lbl">Faixa de diária estimada · classe ' + U.esc(hp.classe) + '</div>' +
                '<div class="desc">' + U.faixaEur(hp.faixaDiaria[0], hp.faixaDiaria[1]) +
                ' <span class="price-scope">por quarto / noite</span></div>' +
                R.selo('ESTIMADO', 'Faixas por classe de orçamento — ' + FONTE_REF, null, 'Distinção deliberada entre preço por quarto e preço por pessoa.') +
                '<p style="font-size:12px;color:var(--muted);margin:6px 0 0;">Bairros recomendados: ' +
                (hp.bairros ? U.esc(hp.bairros) : '<span class="indisponivel">Informação não disponível para esta cidade</span>') + '</p></div>';
            if (hp.semOpcoes) {
                h += '<p class="indisponivel">Nenhuma propriedade concreta cadastrada para esta cidade na base interna. O sistema não inventa hotéis.</p>';
            } else {
                h += Edicao.seletorHotel(r, hp);
                const escolhido = Edicao.hotelEscolhido(hp);
                h += '<div class="hotel-grid">';
                hp.opcoes.forEach(o => {
                    h += '<div class="hotel-card h-teal' + (o.id === escolhido ? ' is-escolhido' : '') + '"><div class="hotel-head"><div>' +
                        '<h4 class="hotel-name">' + U.esc(o.nome) + '</h4><span class="hotel-cat">' + U.esc(o.categoria) + '</span></div></div>';
                    h += '<p class="hotel-body">' + U.esc(o.nota) + '</p>';
                    h += '<ul class="hotel-meta"><li><b>Endereço:</b> ' + U.esc(o.endereco) + ' ' + R.maps(o.nome, o.endereco) + '</li>' +
                        '<li><b>Diária:</b> <span class="indisponivel">preço real não disponível</span>' + R.selo('INDISPONIVEL', 'Sem provedor de tarifas hoteleiras') + '</li></ul>';
                    h += '<span class="hotel-flag ' + o.flag + '">' + (o.flag === 'flag-best' ? 'Base recomendada' : o.flag === 'flag-alt' ? 'Alternativa' : 'Verificar acesso') + '</span>';
                    h += '<p class="source-note">' + R.selo('CADASTRADO', o.fonte, null) + '</p>';
                    h += '</div>';
                });
                h += '</div>';
            }
        });
        return R.secao('sec-hospedagem', 'Bases', '🏨 Hospedagem por cidade', h, '🏨 Hospedagem', 'Bairros recomendados, faixa de diária estimada por classe e propriedades concretas cadastradas.');
    },

    /* --------------------------------------------------------------- ALIMENTAÇÃO */
    alimentacao(r) {
        const prefs = (r.config.alimentacao || []);
        let h = '<p class="lede">Orientação por bairro e tipo de estabelecimento. Sem provedor aberto de restaurantes, o sistema não indica casas nominais que não possa confirmar.</p>';
        r.alimentacao.forEach(a => {
            const casa = prefs.length ? a.tags.filter(t => prefs.indexOf(t) >= 0) : [];
            h += '<div class="food-card"><h3>' + U.esc(a.titulo) + '</h3><p>' + U.esc(a.texto) + '</p>';
            h += '<p style="margin-top:8px;">' + a.tags.map(t => {
                const rot = (CATALOGO.alimentacao.find(x => x.id === t) || { rotulo: t }).rotulo;
                const ativo = casa.indexOf(t) >= 0;
                return '<span class="chip ' + (ativo ? 'chip-day' : 'chip-star') + '">' + U.esc(rot) + (ativo ? ' ✓' : '') + '</span>';
            }).join('') + '</p>';
            if (casa.length) h += '<p class="source-note">Compatível com a preferência alimentar que você declarou.</p>';
            h += '</div>';
        });
        h += '<div class="callout callout-nota">' + U.esc(Providers.RestaurantProvider.motivo) + '</div>';
        return R.secao('sec-alimentacao', 'Mesa', '🍝 Alimentação por cidade', h, '🍝 Alimentação', 'Estratégia alimentar por cidade, cruzada com as preferências declaradas no formulário.');
    },

    /* --------------------------------------------------------------- INGRESSOS */
    ingressos(r) {
        const i = r.ingressos;
        let h = '<p class="lede">Somente tarifas de fonte identificada entram no cálculo. Onde a tarifa não é conhecida, o campo permanece vazio, com o endereço oficial para verificação.</p>';
        h += '<table class="tbl-sejud"><thead><tr><th>Atração</th><th>Adulto</th><th>Menor de 18</th><th>Reserva</th><th style="text-align:right;">Total do grupo</th></tr></thead><tbody>';
        i.linhas.forEach(l => {
            h += '<tr><td><strong>' + U.esc(l.nome) + '</strong>' + (l.oficial ? ' <a class="map-link" target="_blank" rel="noopener" href="' + U.esc(l.oficial) + '">oficial ↗</a>' : '') +
                (l.nota ? '<div class="sched-d">' + U.esc(l.nota) + '</div>' : '') + '</td>';
            if (l.tipo === 'INDISPONIVEL') {
                h += '<td colspan="3"><span class="indisponivel">Tarifa não disponível na base</span>' + R.selo('INDISPONIVEL', l.fonte) + '</td><td style="text-align:right;">—</td>';
            } else {
                h += '<td>' + (l.adulto ? U.eur(l.adulto) : 'sem cobrança') + '</td>' +
                    '<td>' + U.esc(l.menorTexto == null ? '—' : l.menorTexto) + (l.detalhe ? '<div class="sched-d">' + U.esc(l.detalhe) + '</div>' : '') + '</td>' +
