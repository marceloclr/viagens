                    '<td>' + (l.reserva ? 'obrigatória' : '—') + '</td>' +
                    '<td style="text-align:right;font-weight:bold;color:var(--accent2);">' + (l.total ? U.eur(l.total) : '—') + '</td>';
            }
            h += '</tr>';
        });
        h += '<tr class="tr-total"><td colspan="4">Subtotal com tarifas conhecidas · ' + i.adultos + ' adulto(s) + ' + i.menores + ' menor(es)</td>' +
            '<td style="text-align:right;">' + U.eur(i.somaConhecida) + '</td></tr>';
        h += '</tbody></table>';
        h += '<div class="callout callout-atencao"><strong>' + i.semTarifa + ' atração(ões) sem tarifa disponível.</strong> Esse valor não foi estimado nem embutido no total: some-o à parte após consultar os sítios oficiais indicados.</div>';
        return R.secao('sec-ingressos', 'Reservas', '🎟️ Ingressos e reservas', h, '🎟️ Ingressos', 'Tarifas oficiais conhecidas, cálculo para a composição do grupo e sinalização do que não pôde ser confirmado.');
    },

    /* --------------------------------------------------------------- CUSTOS */
    custos(r) {
        const c = r.custos;
        const fx = r.cambio && r.cambio.valor;
        let h = '<p class="lede">Estimativa terrestre para ' + c.pessoas + ' pessoa(s), ' + c.noites + ' noites e ' + c.dias + ' dias, na classe ' + U.esc(c.classe) + '. Voos internacionais não entram: o sistema não estima passagem aérea.</p>';
        h += '<div class="finance-grid">';
        c.linhas.forEach(l => {
            h += '<div class="finance-card"><div class="fl">' + U.esc(l.rotulo) + '</div>';
            if (l.valor != null) {
                h += '<div class="fv">' + U.eur(l.valor) + '</div>';
            } else if (!l.faixa) {
                h += '<div class="fv indisponivel">não disponível</div>';
            } else {
                h += '<div class="fv">' + U.faixaEur(l.faixa[0], l.faixa[1]) + '</div>';
            }
            h += '<div class="fs">' + R.selo(l.tipo, null, null, U.esc(l.nota)) + '</div>';
            h += '<div class="fs">' + U.esc(l.nota) + '</div></div>';
        });
        h += '</div>';

        h += '<div class="ind-card ind-teal" style="margin-top:16px;"><div class="lbl">Total terrestre estimado — ' + c.pessoas + ' pessoa(s)</div>' +
            '<div class="cost-total">' + R.tt(U.faixaEur(c.totalTerrestre[0], c.totalTerrestre[1]),
                'Soma de hospedagem, alimentação, transporte urbano, trechos entre cidades, ingressos conhecidos e extras, acrescida de <b>' +
                Math.round(CONFIG.contingencia * 100) + '%</b> de contingência. <b>Não inclui voos internacionais.</b>') + '</div>';
        if (fx) {
            h += '<p style="font-size:12.5px;color:var(--muted);margin:6px 0 0;">Equivalente a ' +
                'R$ ' + Math.round(c.totalTerrestre[0] * fx).toLocaleString('pt-BR') + '–' +
                Math.round(c.totalTerrestre[1] * fx).toLocaleString('pt-BR') + ' pela taxa de ' +
                U.esc(String(fx.toFixed ? fx.toFixed(3) : fx)) + ' ' + R.selo(r.cambio.tipo, r.cambio.fonte, r.cambio.consultadoEm) + '</p>';
        } else {
            h += '<p class="indisponivel" style="font-size:12.5px;margin:6px 0 0;">Conversão para real indisponível no momento.</p>';
        }
        h += '</div>';

        h += '<div class="ind-grid" style="margin-top:12px;">';
        h += '<div class="ind-card ind-gold"><div class="lbl">Por pessoa</div><div class="desc">' + U.faixaEur(c.porPessoa[0], c.porPessoa[1]) + '</div></div>';
        h += '<div class="ind-card ind-blue"><div class="lbl">Por dia (grupo)</div><div class="desc">' + U.faixaEur(c.porDia[0], c.porDia[1]) + '</div></div>';
        const vooLinha = c.linhas.find(l => l.id === 'voos');
        h += '<div class="ind-card ind-coral"><div class="lbl">Voos internacionais</div><div class="desc' + (vooLinha.valor != null ? '' : ' indisponivel') + '">' +
            (vooLinha.valor != null ? U.eur(vooLinha.valor) : 'não estimado') + '</div></div>';
        h += '</div>';
        return R.secao('sec-custos', 'Finanças', '💶 Sumarização financeira', h, '💶 Custos', 'Composição do orçamento por rubrica, com a metodologia de cada estimativa e conversão cambial.');
    },

    /* --------------------------------------------------------------- CONSULAR */
    consular(r) {
        let h = '<p class="lede">Módulo gerado automaticamente a partir dos países do roteiro. A fonte prioritária é o Ministério das Relações Exteriores; nenhum telefone, WhatsApp ou horário é publicado sem confirmação oficial.</p>';
        r.representacoes.forEach(p => {

                h += '<p class="indisponivel">Nenhuma representação brasileira cadastrada para este país na base.</p>';

            p.representacoes.forEach(rep => {
                const tipoRot = { embaixada: 'Embaixada', consulado_geral: 'Consulado-Geral', consulado: 'Consulado', honorario: 'Consulado honorário' }[rep.tipo] || rep.tipo;
                h += '<div class="consul-card">';
                h += '<div class="consul-head"><span class="consul-nome">🇧🇷 ' + U.esc(rep.nomeOficial) + '</span><span class="consul-tipo">' + U.esc(tipoRot) + '</span></div>';

                h += '<li><span>Endereço</span><span>' + R.valorOuNada(rep.endereco) + '</span></li>';
                h += '<li><span>Telefone geral</span><span>' + R.valorOuNada(rep.telefoneGeral) + '</span></li>';
                h += '<li><span>Telefone consular</span><span>' + R.valorOuNada(rep.telefoneConsular) + '</span></li>';
                h += '<li><span>WhatsApp</span><span>' + R.valorOuNada(rep.whatsappConsular) + '</span></li>';
                h += '<li><span>Atendimento geral</span><span>' + R.valorOuNada(rep.horarioAtendimento) + '</span></li>';
                h += '<li><span>Atendimento consular</span><span>' + R.valorOuNada(rep.horarioConsular) + '</span></li>';
                h += '<li><span>Jurisdição consular</span><span>' + R.valorOuNada(rep.jurisdicao) + '</span></li>';

                if (rep.endereco && rep.endereco.valor) h += '<li><span>Localização</span><span>' + R.maps(rep.nomeOficial, rep.endereco.valor) + '</span></li>';

                if (rep.observacoes) h += '<p class="source-note">' + U.esc(rep.observacoes) + '</p>';

                    '<p><strong>Plantão consular — uso exclusivo para emergências.</strong> O Ministério das Relações Exteriores considera emergência, entre outras hipóteses, risco à vida, acidentes graves, prisões e detenções, desaparecimentos, violência, hospitalização e tráfico de pessoas. Problemas correntes de documentação não são emergência.</p>' +
                    '<p>Telefone de plantão: ' + R.valorOuNada(rep.telefonePlantao) + '</p>' +
                    '<p>WhatsApp de plantão: ' + R.valorOuNada(rep.whatsappPlantao) + '</p>' +
                    '<p class="source-note">O sistema jamais apresenta um telefone de plantão como telefone geral do posto, e só exibe WhatsApp quando a fonte oficial indicar expressamente essa funcionalidade.</p></div>';

                    ' ⚠️ Informação consular pode estar desatualizada. Telefones, endereços e horários mudam sem aviso — verifique no sítio oficial antes de qualquer deslocamento.</p>';

    },

    /* --------------------------------------------------------------- PLANO B */
    planoB(r) {

            h += '<div class="planob-col alternativo"><h4>Plano B — ' + U.esc(p.gatilho) + '</h4><ul>' + p.alternativas.map(x => '<li>' + U.esc(x) + '</li>').join('') + '</ul></div>';

        return R.secao('sec-planob', 'Contingência', '🌂 Plano B', h, '🌂 Plano B', 'Alternativas cobertas para dias de chuva, fechamento inesperado ou atraso.');

    /* --------------------------------------------------------------- ENDEREÇOS */
    enderecos(r) {
        let h = '<p class="lede">Referência operacional consolidada. Cada item abre a busca direta no Google Maps — recurso complementar, jamais dependência do motor.</p>';

                h += '<div class="ind-card ind-blue"><div class="lbl">' + U.esc(it.sub || '') + '</div>' +

        });

    },

    /* --------------------------------------------------------------- RESUMO EXECUTIVO
       Existe só para a impressão (§ .only-print) — "Exportar PDF" mostra isto no lugar
       das 15 seções completas do roteiro. Não recalcula nada: só lê e condensa os mesmos
       campos de r já usados por Render.voos/jornada/hospedagem/consular/enderecos. */
    resumoExecutivo(r) {
        let h = '<p class="lede">Resumo condensado para consulta rápida em viagem. O roteiro completo, com justificativas e detalhamento de cada escolha, fica disponível na tela do aplicativo.</p>';

        h += '<h3>✈️ Voos</h3>';
        r.voos.forEach(v => {
            h += '<p><strong>' + U.esc(v.sentido) + '</strong> · ' + U.dataExtenso(v.data) + ' · ' +
                U.esc(v.origem) + ' → ' + U.esc(v.destino) + (v.codigo ? ' (' + v.codigo + ')' : '') + '<br>';
            if (vooTemDado(v.manual)) {
                const m = v.manual;
                const resumo = [[m.companhia, m.numero].filter(Boolean).join(' '), m.data ? U.dataBR(m.data) : '',
                    [m.horaPartida, m.horaChegada].filter(Boolean).join(' → ')].filter(Boolean).join(' · ');
                h += 'Voo informado: ' + U.esc(resumo || '—');
            } else {
                h += 'Número e horário: informação não disponível';
            }
            if (v.cadastro) {
                const cd = v.cadastro;
                const companhias = Array.from(new Set(cd.pernas.flatMap(p => p.companhias || []))).join(' · ') || 'companhia não confirmada';
                const duracao = cd.pernas.reduce((s, p) => s + (p.duracaoMin || 0), 0);
                h += ' · Rota pesquisada: ' + U.esc(companhias) + (duracao ? ' (~' + U.dur(duracao) + ')' : '');
            }
            h += '</p>';
        });

        if (r.deslocamentos.length) {
            h += '<h3>🚆 Trechos entre cidades</h3><ul>';
            r.deslocamentos.forEach(t => {
                h += '<li>' + U.esc(t.deNome) + ' → ' + U.esc(t.paraNome) + ' — ' + t.icone + ' ' + U.esc(t.modo) +
                    (t.duracao ? ' · ' + U.dur(t.duracao) : ' · duração não disponível') + '</li>';
            });
            h += '</ul>';
        }

        h += '<h3>🏨 Hospedagem</h3>';
        r.hospedagens.forEach(hp => {
            h += '<p><strong>' + U.esc(hp.cidadeNome) + '</strong> · ' + hp.noites + ' noite' + (hp.noites > 1 ? 's' : '') +
                (hp.bairros ? ' · Bairros: ' + U.esc(hp.bairros) : '') + '<br>';
            if (hp.semOpcoes) {
                h += 'Nenhuma propriedade cadastrada para esta cidade.';
            } else {
                const escolhidoId = Edicao.hotelEscolhido(hp);
                const escolhido = hp.opcoes.find(o => o.id === escolhidoId) || hp.opcoes[0];
                if (escolhido) h += U.esc(escolhido.nome) + ' (' + U.esc(escolhido.categoria) + ') — ' + U.esc(escolhido.endereco);
            }
            h += '</p>';
        });

        h += '<h3>🇧🇷 Consulados — contato de emergência</h3>';
        r.representacoes.forEach(p => {
            if (p.semRegistro) return;
            p.representacoes.forEach(rep => {
                h += '<p><strong>' + U.esc(rep.nomeOficial) + '</strong> — ' + U.esc(rep.cidade) + '<br>' +
                    'Endereço: ' + R.valorOuNada(rep.endereco) + '<br>' +
                    'Plantão: ' + R.valorOuNada(rep.telefonePlantao) + ' · WhatsApp: ' + R.valorOuNada(rep.whatsappPlantao) + '</p>';
            });
        });

        h += '<h3>📍 Endereços</h3>';
        R.gruposEndereco(r).forEach(g => {
            if (!g[1].length) return;
            h += '<p><strong>' + g[0] + '</strong></p><ul>';
            g[1].forEach(it => { h += '<li>' + U.esc(it.nome) + (it.sub ? ' (' + U.esc(it.sub) + ')' : '') + ' — ' + U.esc(it.end) + '</li>'; });
            h += '</ul>';
        });

        return R.secao('sec-resumo-executivo', 'Resumo', '🖨️ Resumo executivo (impressão)', h,
            '🖨️ Resumo executivo', 'Versão condensada para impressão: voos, trechos, hospedagem, endereços e contatos consulares de emergência.');
    },

    /* --------------------------------------------------------------- PONTUAÇÃO */
    pontuacao(r) {
        const p = r.pontuacao;
        let h = '<p class="lede">A nota não é ornamento: cada dimensão tem fórmula própria, insumo mensurável e capacidade de reprovar. Conflitos graves descontam doze pontos cada.</p>';
        h += '<div class="score-global"><div class="big">' + p.global + '<small>/100</small></div>' +
            '<div><div style="font-family:Consolas,monospace;font-weight:800;color:#fff;font-size:15px;">' +
            (p.global >= 85 ? 'Roteiro recomendado' : p.global >= 70 ? 'Roteiro viável, com ajustes possíveis' : p.global >= 55 ? 'Roteiro com tensões relevantes' : 'Roteiro precisa de revisão') + '</div>' +
            '<div style="font-size:12.5px;color:var(--muted);margin-top:4px;">Média ponderada das oito dimensões' +
            (p.penalidade ? ', com desconto de ' + p.penalidade + ' pontos por conflito grave' : '') + '.</div></div></div>';
        h += '<div class="score-grid">';
        p.itens.forEach(i => {
            h += '<div class="score-item"><div class="sl"><span>' + U.esc(i.rotulo) + '</span><span class="sv">' + Math.round(i.valor) + '</span></div>' +
                '<div class="score-bar"><i style="width:' + Math.round(i.valor) + '%"></i></div>' +
                '<div class="sw">' + R.tt('peso ' + i.peso + '% · como foi calculado', U.esc(i.formula)) + '</div></div>';
        });
        h += '</div>';

        h += '<h3>Registro de decisões do motor</h3>';
        h += '<p style="font-size:13px;color:var(--muted);">Gravado no instante de cada decisão, não reconstruído depois.</p>';
        r.decisoes.forEach(d => {
            h += '<div class="ind-card ind-olive" style="margin-top:10px;"><div class="lbl">' + U.esc(d.escopo) + '</div>' +
                '<div class="desc">' + U.esc(d.decisao) + '</div>' + R.porque(d.criterios) + '</div>';
        });

        h += '<h3>Fontes utilizadas</h3><ul>';
        r.fontes.forEach(f => { h += '<li><strong>' + U.esc(f.nome) + '</strong> — ' + U.esc(f.uso) + '</li>'; });
        h += '</ul>';

        h += '<div class="notas-print"><h3>Notas metodológicas (apêndice de impressão)</h3><ul>' +
            Object.keys(PROV).map(k => '<li><strong>' + PROV[k].rotulo + ':</strong> ' + PROV[k].ajuda + '</li>').join('') +
            '</ul></div>';
        return R.secao('sec-pontuacao', 'Transparência', '⭐ Pontuação e explicabilidade', h, '⭐ Pontuação', 'Como cada nota foi calculada e por que o motor tomou cada decisão relevante.');
    }
};

/* =====================================================================================
   [16] MONTAGEM DAS SEÇÕES NO DOCUMENTO
   ===================================================================================== */
function renderRoteiro(r) {
    const main = document.getElementById('mainContent');
    const toc = document.getElementById('tocLista');
    const secoes = [
        Render.resumo(r), Render.jornada(r), Render.clima(r),
        Render.voos(r), Render.cronograma(r), Render.atracoes(r), Render.hospedagem(r),
        Render.alimentacao(r), Render.ingressos(r), Render.custos(r), Render.consular(r),
        Render.planoB(r), Render.enderecos(r), Render.pontuacao(r), Render.resumoExecutivo(r)
    ].filter(Boolean);

    secoes.forEach(s => {
        const el = document.createElement('section');
        el.id = s.id;
        el.innerHTML = '<span class="eyebrow">' + U.esc(s.eyebrow) + '</span><h2>' + s.titulo + '</h2>' + s.corpo;
        main.appendChild(el);
        // sec-resumo-executivo só existe para impressão (§ .only-print) — não entra no
        // índice de navegação nem no carrossel de módulos em tela.
        if (s.id === 'sec-resumo-executivo') { el.classList.add('only-print'); return; }
        const a = document.createElement('a');
        a.href = '#' + s.id;
        a.setAttribute('data-gerado', '1');
        a.title = s.tocAjuda;
        a.textContent = s.tocRotulo;
        toc.appendChild(a);
    });

    const marca = document.getElementById('brandLine');
    const nomes = r.cidades.map(c => c.dados.nome).join(' · ');
    const bandeiras = Array.from(new Set(r.cidades.map(c => IDX.pais(c.dados.paisId).bandeira))).join('');
    marca.innerHTML = '<span class="brand-destinos">' + bandeiras + ' ' + U.esc(nomes.toUpperCase()) + '</span>' +
        '<small>' + r.dias.length + ' dias · ' + U.dataBR(r.config.dataInicio) + '–' + U.dataBR(r.config.dataFim) +
        ' · ' + U.esc(r.config.viajantes.total) + ' viajante(s)</small>';

    Nav.reindexar();
    document.getElementById('acoesRoteiro').hidden = false;
}

            '<span class="hint">Selecione cidades no Nível 1 para que as atrações apareçam aqui.</span></div>';
        h += '<div class="fgrid" style="margin-top:14px;">';
        h += Form.campoTexto('horaChegadaPrevista', 'Hora prevista de chegada no primeiro dia', e.horaChegadaPrevista, 'O dia de chegada começa neste horário e recebe 35% da capacidade normal, descontados imigração, bagagem, deslocamento e check-in.');
        h += Form.campoNumero('antecedenciaAeroporto', 'Antecedência no aeroporto (minutos)', e.antecedenciaAeroporto, 'Bloco reservado no dia de partida. O motor não preenche a manhã de partida com atrações que comprometam essa margem.');
        h += '</div>';
        h += Form.campoVoo('vooIda', 'ida', e.vooIda);
        h += Form.campoVoo('vooVolta', 'volta', e.vooVolta);
        h += '</div></details>';

        h += '<div class="form-actions">';
        h += '<button type="button" class="btn-primary" id="btnGerar" title="Executa a cadeia completa: validação, seleção de cidades, distribuição de noites, seleção e ordenação de atrações, cronograma, custos, clima, plano B, validação final e pontuação.">⚙️ Gerar roteiro</button>';
        h += '<button type="button" class="btn-ghost" id="btnExemplo" title="Preenche o formulário com o cenário de peregrinação que originou este sistema, para comparação.">Carregar cenário de exemplo</button>';
        /* A importação também vive aqui, e não só no console de edição: é justamente
           quando não há roteiro na tela — depois de recarregar a página — que ela
           precisa estar ao alcance. */
        h += '<button type="button" class="btn-ghost" id="btnImportar" title="Abre um arquivo .json exportado por este sistema e reconstrói o roteiro completo, com o formulário espelhando a configuração importada. ' +
            'As escolhas vêm do arquivo; tarifas, durações, endereços e horários de funcionamento vêm da base atual, e cada divergência entre os dois é declarada. ' +
            'Ingressos, custos, plano B, validação e nota são recalculados; clima e câmbio são reconsultados na hora.">⬆ Importar roteiro (.json)</button>';
        h += '<span class="hint" id="formStatus"></span>';
        h += '</div>';
        h += '</div>';

        document.getElementById('formBody').innerHTML = h;
        Form.ligarEventos();
        Form.montarOutroDestino();
        Form.atualizarBloqueioPais();
        Form.atualizarSeletorCidades();
        Form.atualizarCidades();
    },

    /* Países com ao menos uma cidade disponível — inclui os declarados por você, para que
       um destino declarado possa ser filtrado como qualquer outro. */
    paisesDisponiveis() {
        const ids = Array.from(new Set(IDX.cidadesDisponiveis().map(c => c.paisId)));
        return ids.map(id => IDX.pais(id)).sort((a, b) => a.nome.localeCompare(b.nome, 'pt-BR'));
    },

    /* O filtro é de exibição apenas: jamais remove da seleção o que ele esconde. */
    cidadesFiltradas() {
        const e = Form.estado;
        const q = U.slug(e.filtroTexto || '');
        return IDX.cidadesDisponiveis().filter(c =>
            (!e.filtroPais || c.paisId === e.filtroPais) &&
            (!q || U.slug(c.nome).indexOf(q) >= 0));
    },

    /* Reconstrói só as <option> do seletor de país (não o campo inteiro). Precisa ser
       chamado à parte sempre que Form.paisesDisponiveis() puder ter mudado fora de um
       Form.montar() completo — declarar cidade (e, com ela, possivelmente um país novo)
       ou remover a última cidade declarada de um país. */
    atualizarSelectPais() {
        const sel = document.getElementById('f_filtroPais');
        if (!sel) return;
        const e = Form.estado;
        sel.innerHTML = [['', 'Selecione um país…']].concat(Form.paisesDisponiveis().map(p => [p.id, p.bandeira + ' ' + p.nome]))
            .map(o => '<option value="' + U.esc(o[0]) + '"' + (o[0] === e.filtroPais ? ' selected' : '') + '>' + U.esc(o[1]) + '</option>').join('');
        sel.value = e.filtroPais;
    },

    /* O país de destino só é liberado depois das duas datas: a duração da viagem é o que
       torna a escolha de cidades/noites significativa, e evita montar uma rota que depois
       precisa ser refeita porque a janela de dias mudou. Espelha o mesmo padrão de bloqueio
       condicional já usado em atualizarSeletorCidades() (linhas acima) para o dropdown de
       cidades quando nenhum país está escolhido ainda. */
    atualizarBloqueioPais() {
        const sel = document.getElementById('f_filtroPais');
        if (!sel) return;
        const completo = !!(Form.estado.dataInicio && Form.estado.dataFim);
        sel.disabled = !completo;
        const campo = sel.closest('.field');
        let dica = document.getElementById('hintFiltroPais');
        if (!dica && campo) {
            dica = document.createElement('span');
            dica.id = 'hintFiltroPais';
            dica.className = 'hint';
            campo.appendChild(dica);
        }
        if (dica) dica.textContent = completo ? '' : 'Informe as duas datas da viagem para escolher o país.';
    },

    /* Sugestão de data de término ao informar a data de início — só entra em campo ainda
       em branco (mesmo princípio da sugestão de coordenadas do gazetteer, adiante: nunca
       sobrescreve o que o usuário já escolheu). Existe só para poupar cliques de "próximo
       mês" no seletor nativo do navegador, que abre mostrando o mês do valor já preenchido:
       mesmo mês do início (fim = último dia do mês, sempre posterior ao início) ou o mês
       seguinte quando o início cai nos últimos 10 dias do mês (fim = mesmo dia do mês
       seguinte, clampado ao tamanho dele). A sugestão é só um ponto de partida editável. */
    sugerirDataFim(iso) {
        const d = new Date(iso + 'T12:00:00');
        const dia = d.getDate();
        const diasNoMes = new Date(d.getFullYear(), d.getMonth() + 1, 0).getDate();
        if (dia > diasNoMes - 10) {
            const alvo = new Date(d.getFullYear(), d.getMonth() + 1, 1, 12);
            const diasAlvo = new Date(alvo.getFullYear(), alvo.getMonth() + 1, 0).getDate();
            alvo.setDate(Math.min(dia, diasAlvo));
            return U.dataISO(alvo);
        }
        return U.dataISO(new Date(d.getFullYear(), d.getMonth(), diasNoMes, 12));
    },

    /* Painel de seleção de cidades — dropdown fechado por padrão, escolher o país é
       pré-requisito para ver e marcar cidades, checkbox permite seleção múltipla. Cabe
       curadas + sugeridas + declaradas sem o espaço que um chipset de botões exigiria. */
    atualizarSeletorCidades() {
        const btn = document.getElementById('cityDropdownToggle');
        const lista = document.getElementById('cityCheckList');
        if (!btn || !lista) return;
        const e = Form.estado;
        if (!e.filtroPais) {
            btn.textContent = 'Selecione um país acima para ver as cidades';
            btn.disabled = true;
            lista.innerHTML = '<span class="hint">Escolha um país no campo acima.</span>';
            Form.fecharPainelCidades();
            return;
        }
        btn.disabled = false;
        Form.atualizarBotaoCidades();
        const filtradas = Form.cidadesFiltradas();
        const e2 = Form.estado;
        const ocultasSelecionadas = e2.cidadesSelecionadas.filter(s => !filtradas.some(c => c.id === s.id)).length;
        if (!filtradas.length) {
            lista.innerHTML = '<span class="hint">Nenhuma cidade corresponde à busca. Use <b>Outro destino</b>, logo abaixo, para declarar uma cidade que não está na lista.</span>';
        } else {
            lista.innerHTML = filtradas.map(c => {
                const on = e2.cidadesSelecionadas.some(x => x.id === c.id);
                const marca = c.declarada ? ' ✎' : (c.sugerida ? ' ◇' : (c.curada ? '' : ' ·'));
                const tit = c.declarada
                    ? 'Declarada por você. Entra no roteiro com noites e custo de estada, sem atrações, hospedagem nominal ou trechos cadastrados.'
                    : (c.sugerida
                        ? 'Sugestão de turismo religioso, sem atrações, hospedagem ou trechos cadastrados: ' + U.esc(c.resumo || '')
                        : (c.curada
                            ? 'Curada com profundidade: ' + IDX.atracoesDe(c.id).length + ' atrações, zonas de deslocamento, hospedagem e trechos cadastrados. Ideal de ' + c.noitesIdeal + ' noites.'
                            : 'Nó logístico com base reduzida: ' + IDX.atracoesDe(c.id).length + ' atrações cadastradas. Ideal de ' + c.noitesIdeal + ' noites.'));
                // Vários nomes da curadoria trazem o equivalente local entre parênteses
                // (Friburgo (Fribourg), Éfeso (Selçuk), Cafarnaum (Capernaum)...) —
                // informação real, não redundância, mas junto ao glifo e ao marcador ela
                // pesava na leitura da lista. Separado num tom mais claro, o nome principal
                // continua o primeiro a ser lido.
                const nomeSep = c.nome.match(/^(.+?)\s*(\([^)]*\))$/);
                const nomePrincipal = nomeSep ? nomeSep[1] : c.nome;
                const nomeAlt = nomeSep ? nomeSep[2] : '';
                return '<label class="city-check-item" title="' + U.esc(tit) + '">' +
                    '<input type="checkbox" data-cidade="' + U.esc(c.id) + '"' + (on ? ' checked' : '') + '>' +
                    '<span>' + (c.glifo || '📍') + ' ' + U.esc(nomePrincipal) +
                    (nomeAlt ? ' <span class="city-alt">' + U.esc(nomeAlt) + '</span>' : '') +
                    marca + '</span></label>';
            }).join('');
        }
        if (ocultasSelecionadas) {
            lista.innerHTML += '<span class="hint" style="display:block;margin-top:6px;">' + ocultasSelecionadas +
                ' cidade(s) já selecionada(s) em outro país ou fora da busca continuam no roteiro e aparecem na lista abaixo.</span>';
        }
    },

    /* Só o rótulo do botão — usado depois de marcar/desmarcar uma cidade, sem redesenhar
       a lista de checkboxes (preserva rolagem e o foco no campo de busca). */
    atualizarBotaoCidades() {
        const btn = document.getElementById('cityDropdownToggle');
        if (!btn) return;
        const e = Form.estado;
        if (!e.filtroPais) return;
        const pais = IDX.pais(e.filtroPais);
        const marcadas = e.cidadesSelecionadas.filter(s => { const c = IDX.cidade(s.id); return c && c.paisId === e.filtroPais; }).length;
        btn.textContent = 'Cidades de ' + (pais ? pais.bandeira + ' ' + pais.nome : e.filtroPais) +
            ' — ' + (marcadas ? marcadas + ' selecionada' + (marcadas > 1 ? 's' : '') : 'nenhuma selecionada');
    },

    abrirPainelCidades() {
        const painel = document.getElementById('cityDropdownPanel');
        const btn = document.getElementById('cityDropdownToggle');
        if (!painel || !btn || btn.disabled) return;
        painel.hidden = false;
        btn.setAttribute('aria-expanded', 'true');
    },
    fecharPainelCidades() {
        const painel = document.getElementById('cityDropdownPanel');
        const btn = document.getElementById('cityDropdownToggle');
        if (painel) painel.hidden = true;
        if (btn) btn.setAttribute('aria-expanded', 'false');
    },

    /* Reconstrói só o corpo de "Outro destino" (não o <details> em volta), para que
       abrir/fechar essa seção sobreviva a uma mudança de país ou ao preenchimento de
       coordenadas sugeridas pelo gazetteer — antes, essas ações remontavam o formulário
       inteiro e fechavam a seção enquanto o usuário ainda estava preenchendo. */
    montarOutroDestino() {
        const body = document.getElementById('outroDestinoBody');
        if (!body) return;
        const e = Form.estado;
        let h = '<p class="hint" style="margin-top:0;">Fora da base curada: entra com noites, custo de estada e lugar na rota — <b>sem</b> atrações, hospedagem, trechos ou plano B, que aqui não existem e não serão inventados.</p>';
        h += '<div class="fgrid">';
        h += Form.campoTexto('declNome', 'Nome da cidade', e.declNome, 'Como você quer vê-la escrita no roteiro. É o nome que aparecerá no mapa da jornada, no cronograma e na tabela de endereços.');
        h += Form.campoSelect('declPais', 'País',
            Form.paisesDisponiveis().map(p => [p.id, p.bandeira + ' ' + p.nome]).concat([['__novo__', '✎ Declarar outro país…']]),
            e.declPais, 'O país determina qual representação brasileira aparece no módulo consular. Escolher um país já cadastrado aproveita as repartições existentes; declarar um novo país deixa o módulo consular explicitamente vazio para ele, sem inventar endereços nem telefones.');
        if (e.declPais === '__novo__') {
            h += Form.campoTexto('declPaisNome', 'Nome do novo país', e.declPaisNome, 'Registrado apenas para nomear o país no roteiro. Nenhuma embaixada ou consulado será exibido, porque a base não tem registro oficial para ele.');
        }
        h += Form.campoNumero('declNoites', 'Noites ideais nesta cidade', e.declNoites, 'Entra na distribuição de noites como o “ideal” da cidade, do mesmo modo que o valor curado das cidades da base. Mínimo fixado em 1 noite. É a sua estimativa, e o roteiro a identifica como tal.');
        h += Form.campoTexto('declLat', 'Latitude (opcional)', e.declLat, 'Aceita qualquer formato usual: grau decimal com ponto ou vírgula (41.9028 ou 41,9028), com letra cardinal (41.9028 N), ou grau/minuto/segundo (41°54\'10"N). Pode colar o par "latitude, longitude" inteiro aqui e deixar o campo de longitude em branco. Informada, habilita a consulta climática real para esta cidade. Em branco, o card de clima dirá “sem dado disponível” — o sistema não escolhe um ponto próximo no mapa para fazer o provedor responder.');
        h += Form.campoTexto('declLon', 'Longitude (opcional)', e.declLon, 'Mesmos formatos aceitos da latitude (decimal com ponto ou vírgula, letra cardinal, ou grau/minuto/segundo). Só tem efeito em conjunto com a latitude.');
        h += '</div>';
        h += '<div class="form-actions" style="margin-top:10px;">' +
            '<button type="button" class="btn-ghost" id="btnDeclarar" title="Acrescenta a cidade à lista de destinos disponíveis e já a seleciona. A declaração vale para esta sessão do navegador e pode ser removida abaixo. Nenhum dado sobre a cidade é buscado ou presumido.">✎ Acrescentar destino declarado</button>' +
            '<span class="hint" id="declStatus"></span></div>';
        h += '<div id="listaDeclaradas" style="margin-top:10px;"></div>';
        body.innerHTML = h;
        Form.atualizarDeclaradas();
        Form.atualizarBotaoOutroDestino();
    },

    /* Só o rótulo do botão de "Outro destino" — mesmo padrão de atualizarBotaoCidades():
       reflete quantas cidades já foram declaradas nesta sessão sem redesenhar o painel. */
    atualizarBotaoOutroDestino() {
        const lbl = document.getElementById('outroDestinoLabel');
        if (!lbl) return;
        const n = DB.cidadesDeclaradas.length;
        lbl.textContent = n ? n + ' declarada' + (n > 1 ? 's' : '') : 'Declarar cidade';
    },

    atualizarDeclaradas() {
        const cont = document.getElementById('listaDeclaradas');
        if (!cont) return;
        if (!DB.cidadesDeclaradas.length) {
            cont.innerHTML = '<span class="hint">Nenhum destino declarado nesta sessão.</span>';
            return;
        }
        cont.innerHTML = DB.cidadesDeclaradas.map(c =>
            '<div class="city-row"><div class="city-info"><div class="cname">✎ ' + U.esc(c.nome) + '</div>' +
            '<div class="cmeta">' + U.esc(IDX.pais(c.paisId).nome) + ' · ideal ' + c.noitesIdeal + ' noites · ' +
            (c.lat != null && c.lon != null ? 'coordenadas informadas' : 'sem coordenadas — clima indisponível') + '</div></div>' +
            '<span class="cmeta">declarada</span>' +
            '<button type="button" class="ed-btn ed-rm" data-remdecl="' + U.esc(c.id) + '" ' +
            'title="Remove a declaração desta cidade da base de trabalho e a retira da seleção. Roteiros já gerados não são alterados: eles vivem em memória própria.">✕ Remover declaração</button></div>'
        ).join('');
    },

    declarar() {
        const e = Form.estado;
        const st = document.getElementById('declStatus');
        const diga = t => { if (st) st.textContent = t; };
        const nome = String(e.declNome || '').trim();
        if (!nome) return diga('Informe o nome da cidade.');

        let paisId = e.declPais || '';
        if (paisId === '__novo__') {
            const pn = String(e.declPaisNome || '').trim();
            if (!pn) return diga('Informe o nome do novo país.');
            paisId = 'decl_' + U.slug(pn);
            DB.paisesDeclarados[paisId] = { id: paisId, nome: pn, bandeira: '🏳️', moeda: null, idioma: null, declarado: true };
        }
        if (!paisId) return diga('Escolha o país.');

        const id = 'decl_' + U.slug(nome) + '_' + paisId;
        const existente = IDX.cidade(id);
        // Uma cidade curada ou sugerida não se "redeclara" por cima — declará-la de novo
        // seria abandonar a base já pesquisada por uma versão sem atrações nem hospedagem.
        if (existente && !existente.declarada) return diga('“' + nome + '” já existe na base curada — escolha-a na lista de cidades em vez de declará-la.');

        // Aceita o par colado inteiro num campo só ("37.9915, 23.7332" na latitude, a
        // longitude em branco) — só quando o texto já tem um ponto decimal, para não
        // confundir com a vírgula decimal de um número só (37,9915). Cada metade ainda
        // passa por U.parseCoord(), que por si só já aceita grau/min/seg e letra cardinal.
        let latTxt = String(e.declLat || '').trim(), lonTxt = String(e.declLon || '').trim();
        if (!lonTxt && latTxt.indexOf(',') >= 0 && latTxt.indexOf('.') >= 0) {
            const partes = latTxt.split(',').map(p => p.trim()).filter(Boolean);
            if (partes.length === 2) { latTxt = partes[0]; lonTxt = partes[1]; }
        }
        const lat = U.parseCoord(latTxt);
        const lon = U.parseCoord(lonTxt);
        const ideal = Math.max(1, parseInt(e.declNoites, 10) || 2);
        let reeditada = false;

        if (existente) {
            // Já declarada antes: corrige os dados no mesmo registro, em vez de recusar
            // com "já consta da lista" — era exatamente essa recusa que impedia você de
            // corrigir uma latitude/longitude errada sem primeiro remover a cidade e
            // perder o lugar dela na seleção e no roteiro em memória.
            existente.lat = isNaN(lat) ? existente.lat : lat;
            existente.lon = isNaN(lon) ? existente.lon : lon;
            existente.noitesIdeal = ideal;
            existente.noitesMax = Math.max(ideal, existente.noitesMax || 8);
            existente.declaradoEm = new Date().toISOString();
            reeditada = true;
            if (!e.cidadesSelecionadas.some(c => c.id === id)) e.cidadesSelecionadas.push({ id: id, papel: 'intermediaria', prioridade: 'normal' });
        } else {
            DB.cidadesDeclaradas.push({
                id: id, paisId: paisId, nome: nome, glifo: '✎',
                declarada: true, curada: false,
                lat: isNaN(lat) ? null : lat, lon: isNaN(lon) ? null : lon,
                noitesMin: 1, noitesIdeal: ideal, noitesMax: Math.max(ideal, 8),
                // Perfil vazio de propósito: sem afinidade declarada, calcularNoites() adota
                // o valor neutro em vez de atribuir vocações que ninguém verificou.
                perfil: {},
                transporteUrbano: null, aeroportos: [], estacoes: [],
                bairrosBase: null, resumo: null,
                fonte: 'Declarado por você no formulário', declaradoEm: new Date().toISOString()
            });
            e.cidadesSelecionadas.push({ id: id, papel: 'intermediaria', prioridade: 'normal' });
        }
        e.declNome = ''; e.declPaisNome = ''; e.declLat = ''; e.declLon = '';
        // Já filtra pelo país da cidade recém-declarada, para que ela apareça marcada no
        // seletor sem exigir mais um clique. O <select> de país precisa ser reconstruído
        // aqui porque, ao contrário de um Form.montar() completo, o remonte agora é
        // cirúrgico e não passaria mais por ele sozinho — inclusive quando o país também
        // acabou de ser declarado (“✎ Declarar outro país…”), que ainda não tinha option.
        e.filtroPais = paisId;
        Form.montarOutroDestino();
        Form.atualizarSelectPais();
        Form.atualizarSeletorCidades();
        Form.atualizarCidades();
        const st2 = document.getElementById('declStatus');
        if (st2) st2.textContent = reeditada
            ? nome + ' foi atualizada — clique em Gerar roteiro (ou Recalcular Roteiro) para que a correção valha.'
            : nome + ' foi acrescentada aos destinos disponíveis e já está selecionada.';
    },

    removerDeclarada(id) {
        const i = DB.cidadesDeclaradas.findIndex(c => c.id === id);
        if (i < 0) return;
        DB.cidadesDeclaradas.splice(i, 1);
        Form.estado.cidadesSelecionadas = Form.estado.cidadesSelecionadas.filter(x => x.id !== id);
        Form.montarOutroDestino();
        // Se essa era a última cidade do país declarado, o país some de paisesDisponiveis()
        // — o <select> precisa refletir isso, não só a lista de checkboxes.
        Form.atualizarSelectPais();
        Form.atualizarSeletorCidades();
        Form.atualizarCidades();
    },

    ajuda(txt) { return '<span class="tt" tabindex="0" style="border:none;color:var(--accent);font-weight:800;">ⓘ<span class="tt-body">' + txt + '</span></span>'; },
    campoTexto(id, rot, val, aj) {
        return '<div class="field"><label for="f_' + id + '">' + U.esc(rot) + ' ' + Form.ajuda(aj) + '</label>' +
            '<input type="text" id="f_' + id + '" data-campo="' + id + '" value="' + U.esc(val == null ? '' : val) + '"></div>';
    },
    campoNumero(id, rot, val, aj) {
        return '<div class="field"><label for="f_' + id + '">' + U.esc(rot) + ' ' + Form.ajuda(aj) + '</label>' +
            '<input type="number" min="0" id="f_' + id + '" data-campo="' + id + '" value="' + U.esc(val == null ? '' : val) + '"></div>';
    },
    campoData(id, rot, val, aj) {
        return '<div class="field"><label for="f_' + id + '">' + U.esc(rot) + ' ' + Form.ajuda(aj) + '</label>' +
            '<input type="date" id="f_' + id + '" data-campo="' + id + '" value="' + U.esc(val) + '"></div>';
    },
    campoSelect(id, rot, opcoes, val, aj) {
        let h = '<div class="field"><label for="f_' + id + '">' + U.esc(rot) + ' ' + Form.ajuda(aj) + '</label><select id="f_' + id + '" data-campo="' + id + '">';
        opcoes.forEach(o => { h += '<option value="' + U.esc(o[0]) + '"' + (o[0] === val ? ' selected' : '') + '>' + U.esc(o[1]) + '</option>'; });
        return h + '</select></div>';
    },

    /* Voo "já emitido" (§13/§51): grupo de campos estruturados para a perna de ida ou
       de volta, em vez do texto livre anterior. O preço pago passa a ter campo próprio
       para que possa entrar na Finanças como dado CONFIRMADO — o resto (companhia,
       número, horários) continua sem obrigatoriedade nenhuma. */
    campoVoo(chave, sentido, v) {
        let h = '<h4 style="margin:16px 0 4px;">Voo de ' + sentido + ' já emitido (opcional) ' +
            Form.ajuda('Preencha só o que você já tem confirmado. Nada aqui é estimado: o que ficar em branco continua indisponível.') + '</h4>';
        h += '<div class="fgrid">';
        h += Form.campoTexto(chave + '.companhia', 'Companhia aérea', v.companhia, 'Ex.: TAP Portugal.');
        h += Form.campoTexto(chave + '.numero', 'Número do voo', v.numero, 'Ex.: TP 0016.');
        h += Form.campoData(chave + '.data', 'Data', v.data, 'Data deste voo.');
        h += Form.campoTexto(chave + '.horaPartida', 'Horário de partida', v.horaPartida, 'Ex.: 22:05.');
        h += Form.campoTexto(chave + '.horaChegada', 'Horário de chegada', v.horaChegada, 'Ex.: 09:35 — pode cair no dia seguinte por causa do fuso.');
        h += Form.campoNumero(chave + '.precoPago', 'Preço pago por pessoa', v.precoPago, 'O que você efetivamente pagou. Entra na Finanças como dado confirmado pelo viajante, nunca como estimativa.');
        h += '</div>';
        h += Form.campoTexto(chave + '.obs', 'Observação (opcional)', v.obs, 'Qualquer detalhe adicional — conexão, bagagem, assento.');
        return h;
    },

    campoRadio(id, rot, opcoes, val, aj) {
        let h = '<div class="field field-full"><label>' + U.esc(rot) + ' ' + Form.ajuda(aj) + '</label><div style="display:flex;flex-direction:column;gap:6px;margin-top:4px;">';
        opcoes.forEach(o => {
            h += '<label style="display:flex;align-items:center;gap:8px;font-weight:400;cursor:pointer;">' +
                '<input type="radio" name="' + id + '" data-campo="' + id + '" value="' + U.esc(o[0]) + '"' + (o[0] === val ? ' checked' : '') + '> ' + U.esc(o[1]) + '</label>';
        });
        return h + '</div></div>';
    },

    /* Chamada a cada Form.montar() — mas #formBody é um contêiner estável entre
       remontagens (só o innerHTML é trocado, o próprio nó nunca é recriado), então os
       ouvintes aqui plugados nunca somem sozinhos. Sem esta guarda, cada remontagem
       empilhava mais um conjunto inteiro de ouvintes sobre o mesmo #formBody e sobre
       document — depois de N remontagens (gerar de novo, limpar, carregar exemplo,
       cada cenário do arnês em ?debug=1...), marcar uma cidade disparava o handler de
       seleção N vezes, empurrando a mesma cidade N vezes para cidadesSelecionadas. */
    ligarEventos() {
        const body = document.getElementById('formBody');
        if (body.dataset.eventosLigados) return;
        body.dataset.eventosLigados = '1';
        body.addEventListener('input', ev => {
            const c = ev.target.getAttribute && ev.target.getAttribute('data-campo');
            if (!c) return;
            let v = ev.target.value;
            // Campos de voo estruturado ("vooIda.precoPago" etc.) endereçam um objeto
            // aninhado em vez de uma chave direta de Form.estado — ver Form.campoVoo().
            if (c.indexOf('.') >= 0) {
                const [obj, chave] = c.split('.');
                if (!Form.estado[obj]) Form.estado[obj] = vooVazio();
                Form.estado[obj][chave] = chave === 'precoPago' ? (v === '' ? null : Number(v)) : v;
                return;
            }
            if (c === 'idades') v = v.split(',').map(x => parseInt(x, 10)).filter(x => !isNaN(x));
            else if (['adultos', 'adolescentes', 'criancas', 'orcamentoTotal', 'antecedenciaAeroporto'].indexOf(c) >= 0) v = v === '' ? null : Number(v);
            Form.estado[c] = v;
            // Filtro é exibição: repinta só a lista de checkboxes, preservando o foco da busca.
            if (c === 'filtroTexto' || c === 'filtroPais') Form.atualizarSeletorCidades();
            // Muda o que a lista de cidades selecionadas precisa mostrar (setas de ordem,
            // campo de noites), sem remontar o formulário inteiro.
            if (c === 'modoRota' || c === 'modoDias') Form.atualizarCidades();
            if (c === 'dataInicio' || c === 'dataFim') Form.atualizarBloqueioPais();
        });
        body.addEventListener('change', ev => {
            const c = ev.target.getAttribute && ev.target.getAttribute('data-campo');
            if (c === 'filtroPais') { Form.estado.filtroPais = ev.target.value; Form.atualizarSeletorCidades(); }
            // O campo de nome do novo país só existe quando “outro país” está escolhido —
            // remonta só o corpo de "Outro destino", preservando o <details> aberto.
            if (c === 'declPais') { Form.estado.declPais = ev.target.value; Form.montarOutroDestino(); }
            // Sugestão de coordenadas a partir do gazetteer: só preenche o que ainda está
            // em branco — nunca sobrescreve latitude/longitude que você já tenha digitado.
            if (c === 'declNome' || c === 'declPais') {
                const paisRef = Form.estado.declPais === '__novo__' ? null : Form.estado.declPais;
                const g = IDX.gazetteer(Form.estado.declNome, paisRef);
                if (g && !Form.estado.declLat && !Form.estado.declLon) {
                    Form.estado.declLat = String(g.lat);
                    Form.estado.declLon = String(g.lon);
                    Form.montarOutroDestino();
                }
            }
            if (c === 'dataInicio' && ev.target.value && !Form.estado.dataFim) {
                Form.estado.dataFim = Form.sugerirDataFim(ev.target.value);
                const campoFim = document.getElementById('f_dataFim');
                if (campoFim) campoFim.value = Form.estado.dataFim;
                Form.atualizarBloqueioPais();
            }
        });
        body.addEventListener('click', ev => {
            const dec = ev.target.closest ? ev.target.closest('#btnDeclarar') : null;
            if (dec) { ev.preventDefault(); Form.declarar(); return; }
            const rem = ev.target.closest ? ev.target.closest('button[data-remdecl]') : null;
            if (rem) { ev.preventDefault(); Form.removerDeclarada(rem.getAttribute('data-remdecl')); return; }
            const toggleCid = ev.target.closest ? ev.target.closest('#cityDropdownToggle') : null;
            if (toggleCid) {
                ev.preventDefault();
                const painel = document.getElementById('cityDropdownPanel');
                if (painel && !painel.hidden) Form.fecharPainelCidades(); else Form.abrirPainelCidades();
                return;
            }
            const fecharCid = ev.target.closest ? ev.target.closest('#btnFecharPainelCidades') : null;
            if (fecharCid) { ev.preventDefault(); Form.fecharPainelCidades(); return; }
            // Objetivo principal: seleção única, exclusiva — não é toggle como os demais
            // chipsets (Form.alternar), por isso trocado à parte, antes do bloco genérico.
            const bp = ev.target.closest ? ev.target.closest('button[data-obj-principal]') : null;
            if (bp) { Form.selecionarObjetivoPrincipal(bp.dataset.objPrincipal); return; }
            const b = ev.target.closest('button[data-obj],button[data-alim],button[data-obrig]');
            if (!b) return;
            const on = b.getAttribute('aria-pressed') === 'true';
            b.setAttribute('aria-pressed', String(!on));
            if (b.dataset.obj) Form.alternar(Form.estado.objetivosSecundarios, b.dataset.obj);
            if (b.dataset.alim) Form.alternar(Form.estado.alimentacao, b.dataset.alim);
            if (b.dataset.obrig) Form.alternar(Form.estado.obrigatorias, b.dataset.obrig);
        });
        // Fecha o painel de cidades ao clicar fora dele — inclusive fora do formulário.
        document.addEventListener('click', ev => {
            const dd = document.getElementById('cityDropdown');
            const painel = document.getElementById('cityDropdownPanel');
            if (!dd || !painel || painel.hidden) return;
            if (!dd.contains(ev.target)) Form.fecharPainelCidades();
        });
        // Mesmo comportamento para o painel de "Outro destino": <details> nativo não fecha
        // sozinho ao clicar fora, e o painel flutuante ficaria aberto sobre o resto do
        // formulário até um segundo clique manual no próprio resumo.
        document.addEventListener('click', ev => {
            const dd = document.getElementById('outroDestinoDetails');
            if (!dd || !dd.open) return;
            if (!dd.contains(ev.target)) dd.open = false;
        });
        body.addEventListener('change', ev => {
            const chk = ev.target.matches && ev.target.matches('input[type=checkbox][data-cidade]') ? ev.target : null;
            if (chk) {
                const id = chk.dataset.cidade;
                if (chk.checked) Form.estado.cidadesSelecionadas.push({ id: id, papel: 'intermediaria', prioridade: 'normal' });
                else Form.estado.cidadesSelecionadas = Form.estado.cidadesSelecionadas.filter(x => x.id !== id);
                Form.atualizarBotaoCidades();
                Form.atualizarCidades();
                return;
            }
            const sel = ev.target.closest('select[data-cidade-campo], input[data-cidade-campo]');
            if (!sel) return;
            const item = Form.estado.cidadesSelecionadas.find(x => x.id === sel.dataset.cidadeId);
            if (!item) return;
            if (sel.dataset.cidadeCampo === 'noites') item.noites = parseInt(sel.value, 10) || null;
            else item[sel.dataset.cidadeCampo] = sel.value;
        });
        /* Reordenar cidades por arrastar e soltar — drag-and-drop nativo do HTML5, sem
           biblioteca. A linha inteira é arrastável e também o alvo do soltar; só os
           controles interativos (select de papel/prioridade, campo de noites) cancelam
           o arrasto que começaria neles, para não atrapalhar clique e digitação. */
        body.addEventListener('dragstart', ev => {
            const row = ev.target.closest ? ev.target.closest('.city-row[data-cidade-id]') : null;
            if (!row) return;
            if (ev.target.closest && ev.target.closest('select, input, label')) { ev.preventDefault(); return; }
            ev.dataTransfer.effectAllowed = 'move';
            ev.dataTransfer.setData('text/plain', row.getAttribute('data-cidade-id'));
        });
        body.addEventListener('dragover', ev => {
            const row = ev.target.closest ? ev.target.closest('.city-row[data-cidade-id]') : null;
            if (!row) return;
            ev.preventDefault();
            ev.dataTransfer.dropEffect = 'move';
            row.classList.add('arrasto-sobre');
        });
        body.addEventListener('dragleave', ev => {
            const row = ev.target.closest ? ev.target.closest('.city-row[data-cidade-id]') : null;
            if (row) row.classList.remove('arrasto-sobre');
        });
        body.addEventListener('drop', ev => {
            const row = ev.target.closest ? ev.target.closest('.city-row[data-cidade-id]') : null;
            if (!row) return;
            ev.preventDefault();
            row.classList.remove('arrasto-sobre');
            Form.moverCidade(ev.dataTransfer.getData('text/plain'), row.getAttribute('data-cidade-id'));
        });
        document.getElementById('btnGerar').addEventListener('click', App.gerar);
        document.getElementById('btnExemplo').addEventListener('click', Form.exemplo);
        const bImp = document.getElementById('btnImportar');
        if (bImp) bImp.addEventListener('click', function () {
            const st = document.getElementById('formStatus');
            if (st) st.textContent = 'Selecione o arquivo .json do roteiro…';
            Transferencia.abrirSeletor(function () {
                const s = document.getElementById('formStatus');
                if (!s) return;
                if (Transferencia.erro) s.innerHTML = '<span style="color:var(--accent3);font-weight:700;">' + U.esc(Transferencia.erro) + '</span>';
                else if (Transferencia.relatorio) {
                    const d = Transferencia.relatorio.divergencias.length;
                    s.innerHTML = 'Roteiro importado — nota ' + Transferencia.relatorio.nota + '/100 · ' +
                        (d ? d + ' divergência(s) declarada(s) no console de edição.' : 'sem divergências em relação à base atual.');
                } else s.textContent = '';
            });
        });
    },
    alternar(arr, v) { const i = arr.indexOf(v); if (i >= 0) arr.splice(i, 1); else arr.push(v); },
    /* Objetivo principal é seleção única e obrigatória (validarConfig exige o campo) —
       ao contrário dos chipsets multi-seleção, marca só o clicado e desmarca os demais. */
    selecionarObjetivoPrincipal(id) {
        Form.estado.objetivoPrincipal = id;
        document.querySelectorAll('#chipsObjetivoPrincipal button').forEach(btn => {
            btn.setAttribute('aria-pressed', String(btn.dataset.objPrincipal === id));
        });
    },

    /* Espelha uma configuração no formulário. Vive aqui, e não dentro de App.iniciar(),
       porque duas entradas precisam dela: a preferência recuperada do localStorage e a
       configuração que chega dentro de um roteiro importado. Regenerar em cima de
       respostas antigas seria alterar em silêncio a escolha do usuário (§62). */
    carregarConfig(cfg) {
        if (!cfg) return;
        const v = cfg.viajantes || {};
        Object.assign(Form.estado, {
            origem: cfg.origem, cidadesSelecionadas: JSON.parse(JSON.stringify(cfg.cidades || [])),
            modoRota: cfg.modoRota || 'manual', modoDias: cfg.modoDias || 'automatico',
            dataInicio: cfg.dataInicio, dataFim: cfg.dataFim,
            adultos: v.adultos, adolescentes: v.adolescentes, criancas: v.criancas, idades: (v.idades || []).slice(),
            objetivoPrincipal: cfg.objetivoPrincipal, objetivosSecundarios: (cfg.objetivosSecundarios || []).slice(),
            perfilGrupo: cfg.perfilGrupo, ritmo: cfg.ritmo, caminhada: cfg.caminhada,
            orcamento: cfg.orcamento, orcamentoTotal: cfg.orcamentoTotal,
            alimentacao: (cfg.alimentacao || []).slice(), transporteInterno: cfg.transporteInterno,
            obrigatorias: (cfg.obrigatorias || []).slice(),
            horaChegadaPrevista: cfg.horaChegadaPrevista, antecedenciaAeroporto: cfg.antecedenciaAeroporto,
            // Um roteiro exportado antes desta versão trazia vooIda/vooVolta como texto
            // livre — importar esse arquivo antigo não pode quebrar o formulário, então
            // o texto vira a observação do voo estruturado, em vez de descartado.
            vooIda: typeof cfg.vooIda === 'string' ? Object.assign(vooVazio(), { obs: cfg.vooIda }) : (cfg.vooIda || vooVazio()),
            vooVolta: typeof cfg.vooVolta === 'string' ? Object.assign(vooVazio(), { obs: cfg.vooVolta }) : (cfg.vooVolta || vooVazio())
        });
    },

    atualizarCidades() {
        const cont = document.getElementById('linhasCidades');
        const sel = Form.estado.cidadesSelecionadas;
        if (!sel.length) { cont.innerHTML = '<p class="hint">Nenhuma cidade selecionada ainda.</p>'; }
        else {
            let h = '';
            sel.forEach((s, i) => {
                const c = IDX.cidade(s.id);
                if (!c) return;
                const nAtr = IDX.atracoesDe(c.id).length;
                const proc = c.declarada
                    ? 'declarada por você · sem base de atrações, hospedagem ou trechos'
                    : nAtr + ' atrações cadastradas';
                const nomeSepSel = c.nome.match(/^(.+?)\s*(\([^)]*\))$/);
                const cnameHtml = nomeSepSel
                    ? U.esc(nomeSepSel[1]) + ' <span class="city-alt">' + U.esc(nomeSepSel[2]) + '</span>'
                    : U.esc(c.nome);
                h += '<div class="city-row" data-cidade-id="' + U.esc(c.id) + '" draggable="true">' +
                    '<span class="ordem-arrasto" title="Clique e arraste em qualquer ponto da linha para reordenar a visita. Passa a ordem para manual automaticamente.">☰</span>' +
                    '<span class="city-ordem" title="Posição na sequência de visita.">' + (i + 1) + 'º</span>' +
                    '<div class="city-info"><div class="cname">' + (c.glifo || '📍') + ' ' + cnameHtml + '</div>' +
                    '<div class="cmeta">ideal ' + c.noitesIdeal + ' noites · mínimo ' + c.noitesMin + ' · máximo ' + c.noitesMax +
                    ' · ' + U.esc(proc) + '</div></div>' +
                    '<div class="city-controles">' +
                    '<label class="city-controle"><span>Tipo de parada</span><select data-cidade-campo="papel" data-cidade-id="' + c.id + '" title="Entrada e saída internacionais podem ser cidades distintas: rotas abertas são plenamente suportadas.">' +
                    ['intermediaria|Intermediária', 'entrada|Entrada internacional', 'saida|Saída internacional', 'entrada_saida|Entrada e saída'].map(o => {
                        const p = o.split('|'); return '<option value="' + p[0] + '"' + (s.papel === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
                    }).join('') + '</select></label>' +
                    '<label class="city-controle"><span>Prioridade</span><select data-cidade-campo="prioridade" data-cidade-id="' + c.id + '" title="A prioridade multiplica o peso da cidade na distribuição de noites: alta 1,35 · normal 1,00 · baixa 0,75.">' +
                    ['normal|Normal', 'alta|Alta', 'baixa|Baixa'].map(o => {
                        const p = o.split('|'); return '<option value="' + p[0] + '"' + (s.prioridade === p[0] ? ' selected' : '') + '>' + p[1] + '</option>';
                    }).join('') + '</select></label>' +
                    (Form.estado.modoDias === 'manual'
                        ? '<label class="city-controle"><span>Noites</span><input type="number" min="1" max="60" value="' + (s.noites != null ? s.noites : c.noitesIdeal) + '" data-cidade-campo="noites" data-cidade-id="' + c.id + '" title="Noites nesta cidade, definidas por você. Faixa cadastrada: ' + c.noitesMin + '–' + c.noitesMax + '."></label>'
                        : '') +
                    '</div></div>';
            });
            cont.innerHTML = h;
        }
        // Atrações candidatas a "não quero perder"
        const co = document.getElementById('chipsObrig');
        if (co) {
            const ats = sel.map(s => IDX.atracoesDe(s.id)).flat();
            co.innerHTML = ats.length
                ? ats.map(a => '<button type="button" class="chip-sel v-coral" data-obrig="' + a.id + '" aria-pressed="' +
                    (Form.estado.obrigatorias.indexOf(a.id) >= 0) + '">' + U.esc(a.nome) + '</button>').join('')
                : '<span class="hint">Selecione cidades no Nível 1.</span>';
        }
        Form.atualizarOrdemNoites();
        Form.atualizarMoedaOrcamento();
    },

    /* Atualiza só o texto do rótulo de "Teto de orçamento" (Nível 2) para a moeda das
       cidades selecionadas no momento — chamada por Form.atualizarCidades() em vez de um
       Form.montar() completo, que perderia o estado de abertura dos <details> do formulário. */
    atualizarMoedaOrcamento() {
        const label = document.querySelector('label[for="f_orcamentoTotal"]');
        if (!label || !label.firstChild) return;
        const nome = CONFIG.nomesMoeda[Form.moedaSelecionada()] || 'euros';
        label.firstChild.nodeValue = 'Teto de orçamento em ' + nome + ' (opcional) ';
    },

    /* Move a cidade "origemId" para a posição em que "destinoId" está — usada pelo
       arrastar-e-soltar da lista de destinos. Extraída em função própria (em vez de
       calcular direto no handler de "drop") para o arnês testar a reordenação sem
       precisar simular DataTransfer, que o DOM de fachada do teste não tem. */
    moverCidade(origemId, destinoId) {
        if (!origemId || !destinoId || origemId === destinoId) return;
        const arr = Form.estado.cidadesSelecionadas;
        const iOrig = arr.findIndex(x => x.id === origemId);
        const iDest = arr.findIndex(x => x.id === destinoId);
        if (iOrig < 0 || iDest < 0) return;
        const [item] = arr.splice(iOrig, 1);
        arr.splice(iDest, 0, item);
        // Arrastar é um ato de definir a ordem manualmente — não faz sentido a mão
        // reordenar e o modo continuar "otimizado", que ignoraria essa ordem ao gerar.
        Form.estado.modoRota = 'manual';
        Form.atualizarCidades();
    },

    /* Ordem das cidades e noites manuais só importam com 2+ destinos: com 0 ou 1 cidade
       a ordem é trivial e a distribuição de noites não tem o que distribuir. Extraído em
       função própria para o arnês testar a regra sem depender do DOM. */
    ordemNoitesVisivel() { return Form.estado.cidadesSelecionadas.length > 1; },
    atualizarOrdemNoites() {
        const cont = document.getElementById('blocoOrdemNoites');
        if (!cont) return;
        const e = Form.estado;
        if (!Form.ordemNoitesVisivel()) { cont.innerHTML = ''; return; }
        let h = '<div class="fgrid" style="margin-top:16px;">';
        h += Form.campoSelect('modoRota', 'Ordem das cidades no roteiro',
            [['manual', 'Manter a ordem em que você selecionou (arraste ☰ na lista acima para reordenar)'],
             ['otimizado', 'Deixar o sistema calcular a ordem que minimiza o deslocamento total']],
            e.modoRota,
            'Manual: a sequência de visita é exatamente a ordem das cidades na lista acima. Otimizado: o sistema mantém a cidade de entrada e a de saída que você definiu e reordena só as intermediárias, minimizando o tempo total de deslocamento entre elas — o critério fica registrado em “Por que esta decisão?”, na seção Jornada.');
        h += Form.campoSelect('modoDias', 'Noites em cada cidade',
            [['automatico', 'Distribuir automaticamente por afinidade com seus objetivos'],
             ['manual', 'Definir manualmente as noites de cada cidade (campo aparece na lista acima)']],
            e.modoDias,
            'Automático: o sistema distribui a duração total da viagem entre as cidades, dando mais peso a quem tem maior afinidade com seus objetivos e maior prioridade. Manual: você digita as noites de cada cidade; se a soma não bater com a duração da viagem, o roteiro segue a soma informada e a diferença é declarada, não corrigida.');
        h += '</div>';
        cont.innerHTML = h;
    },

    exemplo() {
        Object.assign(Form.estado, {
            origem: 'Fortaleza',
            cidadesSelecionadas: [
                { id: 'roma', papel: 'entrada', prioridade: 'alta' },
                { id: 'cassino', papel: 'intermediaria', prioridade: 'normal' },
                { id: 'monte_santangelo', papel: 'intermediaria', prioridade: 'normal' },

    coletar() {
        const e = Form.estado;
        const total = (e.adultos || 0) + (e.adolescentes || 0) + (e.criancas || 0);
        return {
            origem: e.origem, cidades: e.cidadesSelecionadas.slice(),
            modoRota: e.modoRota || 'manual', modoDias: e.modoDias || 'automatico',
            dataInicio: e.dataInicio, dataFim: e.dataFim,
            viajantes: { total, adultos: e.adultos || 0, adolescentes: e.adolescentes || 0, criancas: e.criancas || 0, idades: e.idades || [] },
            objetivoPrincipal: e.objetivoPrincipal, objetivosSecundarios: e.objetivosSecundarios.slice(),
            perfilGrupo: e.perfilGrupo, ritmo: e.ritmo, caminhada: e.caminhada,
            orcamento: e.orcamento, orcamentoTotal: e.orcamentoTotal,
            alimentacao: e.alimentacao.slice(), transporteInterno: e.transporteInterno,
            obrigatorias: e.obrigatorias.slice(),
            horaChegadaPrevista: e.horaChegadaPrevista, antecedenciaAeroporto: e.antecedenciaAeroporto,
            vooIda: Object.assign({}, e.vooIda), vooVolta: Object.assign({}, e.vooVolta)
        };
    }
};

/* =====================================================================================
   [18] NAVEGAÇÃO — herdada do sistema original, tornada reindexável
   ===================================================================================== */
const Nav = {
    container: null, progress: null, counter: null, navPrev: null, navNext: null,
    GRUPOS: ['ind-grid', 'hotel-grid', 'timeline', 'flight-box', 'climate-grid', 'score-grid', 'finance-grid', 'highlight-strip', 'location-grid'],
    observer: null,

    /* :not(.only-print) exclui o resumo executivo (Render.resumoExecutivo) — ele fica
       escondido fora da impressão (§ .only-print) e não deve contar como módulo do
       carrossel nem entrar na navegação por setas/scroll. */
    secoes() { return Array.prototype.slice.call(document.querySelectorAll('main.content > section:not(.only-print)')); },
    links() { return Array.prototype.slice.call(document.querySelectorAll('.toc a')); },

    ehGrupo(el) { return el.classList && Nav.GRUPOS.some(g => el.classList.contains(g)); },

    /* A topbar cresce em altura quando a lista de cidades quebra em 2 linhas (§ .brand-destinos).
       Sidebar, conteúdo e setas de navegação usam --topbar-h para se alinhar logo abaixo dela;
       sem este ajuste, esses elementos ficam presos na altura mínima original e o indicador de
       módulo — por estar na base da pilha da identidade — acaba sobreposto à borda da barra. */
    sincronizarTopbar() {
        const tb = document.querySelector('.topbar');
        if (!tb) return;
        const raiz = document.documentElement;
        raiz.style.setProperty('--topbar-h', '84px');
        const altura = Math.max(84, Math.ceil(tb.getBoundingClientRect().height));
        raiz.style.setProperty('--topbar-h', altura + 'px');
    },

    reindexar() {
        Nav.sincronizarTopbar();
        const secoes = Nav.secoes();
        secoes.forEach(sec => {
            let n = 0;
            Array.prototype.slice.call(sec.children).forEach(el => {
                if (el.classList.contains('reveal')) return;
                const alvos = Nav.ehGrupo(el)
                    ? (el.classList.contains('flight-box')
                        ? Array.prototype.slice.call(el.querySelectorAll('.flight-item'))
                        : Array.prototype.slice.call(el.children))
                    : [el];
                alvos.forEach(alvo => { alvo.classList.add('reveal'); alvo.style.setProperty('--n', Math.min(n, 12)); n++; });
            });
        });
        if (Nav.observer) Nav.observer.disconnect();
        if ('IntersectionObserver' in window) {
            Nav.observer = new IntersectionObserver(entries => {
                entries.forEach(en => {
                    if (en.isIntersecting) {
                        en.target.classList.add('in');
                        if (en.intersectionRatio >= 0.45) Nav.ativar(en.target.id);
                    }
                });
            }, { root: Nav.container, threshold: [0.15, 0.45, 0.7] });
            secoes.forEach(s => Nav.observer.observe(s));
        } else {
            secoes.forEach(s => s.classList.add('in'));
        }
        if (secoes.length) { secoes[0].classList.add('in'); Nav.ativar(secoes[0].id); }
        try {
            if (window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
                secoes.forEach(s => s.classList.add('in'));
            }
        } catch (e) {}
        Nav.progresso();
    },

    ativar(id) {
        Nav.links().forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
        const secoes = Nav.secoes();
        const i = secoes.findIndex(s => s.id === id);
        if (i >= 0 && Nav.counter) Nav.counter.innerHTML = 'MÓDULO <b>' + (i + 1) + '</b>/' + secoes.length;
    },

    indiceAtual() { return Math.round(Nav.container.scrollLeft / (Nav.container.clientWidth || 1)); },
    ir(dir) {
        const secoes = Nav.secoes();
        const d = U.clamp(Nav.indiceAtual() + dir, 0, secoes.length - 1);
        secoes[d].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
    },
    progresso() {
        const c = Nav.container;
        const percorrivel = c.scrollWidth - c.clientWidth;
        const razao = percorrivel > 0 ? c.scrollLeft / percorrivel : 0;
        if (Nav.progress) Nav.progress.style.width = (razao * 100).toFixed(2) + '%';
        if (Nav.navPrev) Nav.navPrev.disabled = c.scrollLeft <= 4;
        if (Nav.navNext) Nav.navNext.disabled = c.scrollLeft >= percorrivel - 4;
    },

    iniciar() {
        Nav.container = document.getElementById('mainContent');
        Nav.progress = document.getElementById('progressFill');
        Nav.counter = document.getElementById('stepCounter');
        Nav.navPrev = document.getElementById('navPrev');
        Nav.navNext = document.getElementById('navNext');

        document.querySelector('.toc').addEventListener('click', ev => {
            const l = ev.target.closest('a');
            if (!l) return;
            const alvo = document.querySelector(l.getAttribute('href'));
            if (!alvo) return;
            ev.preventDefault();
            alvo.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
            Nav.ativar(alvo.id);
        });

        document.addEventListener('keydown', ev => {
            const tag = (ev.target && ev.target.tagName) ? ev.target.tagName.toLowerCase() : '';
            if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
            if (ev.key === 'ArrowRight') { ev.preventDefault(); Nav.ir(1); }
            if (ev.key === 'ArrowLeft') { ev.preventDefault(); Nav.ir(-1); }
        });

        let pend = false;
        Nav.container.addEventListener('scroll', () => {
            if (!pend) { pend = true; window.requestAnimationFrame(() => { Nav.progresso(); pend = false; }); }
        }, { passive: true });
        window.addEventListener('resize', Nav.progresso);

        let pendTopbar = false;
        window.addEventListener('resize', () => {
            if (!pendTopbar) { pendTopbar = true; window.requestAnimationFrame(() => { Nav.sincronizarTopbar(); pendTopbar = false; }); }
        });
        Nav.sincronizarTopbar();

        /* Roda do mouse: rolagem vertical dentro do módulo, avanço horizontal nas bordas.
           O formulário é exceção — dentro dele a roda nunca troca de módulo. */
        Nav.container.addEventListener('wheel', ev => {
            const alvo = ev.target && ev.target.closest ? ev.target.closest('main.content > section') : null;
            if (!alvo || !Nav.container.contains(alvo)) return;
            if (Math.abs(ev.deltaX || 0) > Math.abs(ev.deltaY || 0)) return;
            let dy = ev.deltaY || 0;
            if (ev.deltaMode === 1) dy *= 16;
            if (ev.deltaMode === 2) dy *= (Nav.container.clientHeight || 600);
            if (!dy) return;
            const maxTop = Math.max(0, alvo.scrollHeight - alvo.clientHeight);
            const top = alvo.scrollTop, tol = 2;
            const descendo = dy > 0;
            if ((descendo && top < maxTop - tol) || (!descendo && top > tol)) return;
            if (alvo.id === 'sec-form') return;
            const secoes = Nav.secoes();
            const destino = secoes.indexOf(alvo) + (descendo ? 1 : -1);
            if (destino < 0 || destino >= secoes.length) return;
            ev.preventDefault(); ev.stopPropagation();
            secoes[destino].scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
        }, { passive: false, capture: true });

        window.addEventListener('beforeprint', () => Nav.secoes().forEach(s => s.classList.add('in')));
        window.scrollSection = Nav.ir;
    }
};

/* =====================================================================================
   [19] PERSISTÊNCIA E VERSÕES (§68, §69)
   ===================================================================================== */
const Persist = {
    CHAVE_CFG: 'rot2_config', CHAVE_VERSOES: 'rot2_versoes', ESQUEMA: 2,
    salvarConfig(cfg) {
        try { localStorage.setItem(Persist.CHAVE_CFG, JSON.stringify({ esquema: Persist.ESQUEMA, cfg })); } catch (e) {}
    },
    lerConfig() {
        try {
            const o = JSON.parse(localStorage.getItem(Persist.CHAVE_CFG) || 'null');
            if (!o) return null;
            if (o.esquema !== Persist.ESQUEMA) return null;   // migração explícita, nunca leitura de esquema alheio
            return o.cfg;
        } catch (e) { return null; }
    },
    limparConfig() {
        try { localStorage.removeItem(Persist.CHAVE_CFG); } catch (e) {}
    },
    salvarVersao(r) {
        try {
            const l = JSON.parse(localStorage.getItem(Persist.CHAVE_VERSOES) || '[]');
            l.unshift({
                id: r.id, criadoEm: r.criadoEm, esquema: Persist.ESQUEMA,
                rotulo: r.cidades.map(c => c.dados.nome).join(' + ') + ' — ' + r.dias.length + ' dias — ' + (CONFIG.orcamento[r.config.orcamento] || {}).rotulo,
                nota: r.pontuacao.global, config: r.config
            });
            localStorage.setItem(Persist.CHAVE_VERSOES, JSON.stringify(l.slice(0, 12)));
        } catch (e) {}
    },
    versoes() {
        try { return JSON.parse(localStorage.getItem(Persist.CHAVE_VERSOES) || '[]'); } catch (e) { return []; }
    }
};

/* Reposiciona o balão .tt-body quando ele estouraria a viewport — delegado em document
   porque os .tt são gerados dinamicamente via innerHTML (R.tt, R.selo, Form.ajuda etc.),
   então um listener por elemento teria que ser religado a cada renderRoteiro()/Form.montar(). */
const Tooltip = {
    posicionar(gatilho) {
        const corpo = gatilho.querySelector(':scope > .tt-body');
        if (!corpo) return;
        corpo.classList.remove('flip-right', 'flip-down');
        const rg = gatilho.getBoundingClientRect();
        const rc = corpo.getBoundingClientRect();
        if (rg.left + rc.width > window.innerWidth) corpo.classList.add('flip-right');
        if (rg.top - rc.height < 0) corpo.classList.add('flip-down');
    },
    limpar(gatilho) {
        const corpo = gatilho.querySelector(':scope > .tt-body');
        if (corpo) corpo.classList.remove('flip-right', 'flip-down');
        gatilho.classList.remove('is-open');
    },
    iniciar() {
        document.addEventListener('mouseover', ev => {
            const t = ev.target.closest('.tt');
            if (t && !t.contains(ev.relatedTarget)) Tooltip.posicionar(t);
        });
        document.addEventListener('mouseout', ev => {
            const t = ev.target.closest('.tt');
            if (t && !t.contains(ev.relatedTarget)) Tooltip.limpar(t);
        });
        document.addEventListener('focusin', ev => {
            const t = ev.target.closest('.tt');
            if (t) { t.classList.add('is-open'); Tooltip.posicionar(t); }
        });
        document.addEventListener('focusout', ev => {
            const t = ev.target.closest('.tt');
            if (t && !t.contains(ev.relatedTarget)) Tooltip.limpar(t);
        });
    }
};

/* =====================================================================================
   [20] APLICAÇÃO
   ===================================================================================== */
const App = {
    async gerar() {
        const status = document.getElementById('formStatus');
        const btn = document.getElementById('btnGerar');
        let cfg, pre;
        try {
            cfg = Form.coletar();
            pre = validarConfig(cfg);
        } catch (e) {
            console.error(e);
            if (status) status.innerHTML = '<span style="color:var(--accent3);">Falha ao ler o formulário: ' + U.esc(e.message) + '</span>';
            return;
        }
        if (!pre.ok) { status.innerHTML = '<span style="color:var(--accent3);font-weight:700;">' + U.esc(pre.erros[0]) + '</span>'; return; }
        btn.disabled = true; status.textContent = 'Consultando serviços externos e montando o roteiro…';
        // O relatório de importação pertence ao roteiro importado, não ao próximo (§7).
        Transferencia.relatorio = null; Transferencia.erro = null;
        try {
            const r = await criarRoteiro(cfg);
            appState.roteiroConfig = cfg;
            appState.roteiroAtual = r;
            renderRoteiro(r);
            Persist.salvarConfig(cfg);
            Persist.salvarVersao(r);
            status.innerHTML = 'Roteiro gerado — nota ' + r.pontuacao.global + '/100. Use as setas ou o menu lateral.';
            const alvo = document.getElementById('sec-resumo');
            if (alvo) alvo.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
        } catch (e) {
            status.innerHTML = '<span style="color:var(--accent3);">Falha ao gerar: ' + U.esc(e.message) + '</span>';
            console.error(e);
        } finally { btn.disabled = false; }
    },

    /* "# Ir para o campo" — usada pelos cartões de Conflitos e decisões pendentes.
       O formulário vive dentro de um carrossel horizontal de seções (#sec-form) e, dentro
       dele, os níveis 2 e 3 são <details> que podem estar fechados: chegar ao campo exige
       primeiro o scroll horizontal até a seção, depois abrir a seção certa e só então
       rolar verticalmente até o campo — na ordem errada, o scroll vertical acontece antes
       do horizontal terminar e erra o alvo. */
    irParaCampo(sel) {
        try {
            const sec = document.getElementById('sec-form');
            if (sec) sec.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
            setTimeout(() => {
                const alvo = document.querySelector(sel);
                if (!alvo) return;
                const painel = alvo.closest ? alvo.closest('details.form-nivel') : null;
                if (painel && !painel.open) painel.open = true;
                const realce = (alvo.closest && alvo.closest('.field, .field-full')) || alvo;
                realce.scrollIntoView({ behavior: 'smooth', block: 'center' });
                realce.classList.add('campo-em-foco');
                setTimeout(() => realce.classList.remove('campo-em-foco'), 1900);
            }, 380);
        } catch (e) { console.error(e); }
    },

    /* Envolvida em try/catch (ao contrário de App.gerar, chamada direto por um clique):
       um erro aqui não pode falhar em silêncio sem nenhum retorno visível na tela — foi
       exatamente esse sintoma ("o botão não funciona") que motivou o reforço. */
    regenerar() {
        try {
            const sec = document.getElementById('sec-form');
            if (sec) sec.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
            App.gerar();
        } catch (e) {
            console.error(e);
            const status = document.getElementById('formStatus');
            if (status) status.innerHTML = '<span style="color:var(--accent3);">Falha ao regenerar: ' + U.esc(e.message) + '</span>';
        }
    },

    /* "Limpar Roteiro" — ao contrário do que o nome anterior ("Novo roteiro") sugeria
       sem cumprir, isto precisa devolver o formulário genuinamente em branco: sem isso,
       o próximo "Gerar roteiro" reaproveita em silêncio o país e as cidades da sessão
       anterior (§5, "nenhuma escolha é alterada em silêncio" vale também para não
       persistir uma escolha que o usuário acabou de pedir para descartar). */
    limparRoteiro() {
        try {
            limparRoteiroAnterior();
            Transferencia.relatorio = null; Transferencia.erro = null;
            Object.assign(Form.estado, estadoFormPadrao());
            Persist.limparConfig();
            Form.fecharPainelCidades();
            Form.montar();
            document.getElementById('acoesRoteiro').hidden = true;
