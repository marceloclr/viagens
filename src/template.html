            document.getElementById('brandLine').innerHTML = '🧭 VIAGENS DO MARCELO - GERADOR DE ROTEIROS <small>Motor v' + CONFIG.versao + ' — responda, gere, analise, valide e aproveite a aventura.</small>';
            Nav.reindexar();
            const sec = document.getElementById('sec-form');
            if (sec) sec.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
        } catch (e) {
            console.error(e);
            const status = document.getElementById('formStatus');
            if (status) status.innerHTML = '<span style="color:var(--accent3);">Falha ao limpar: ' + U.esc(e.message) + '</span>';
        }
    },

    /* "Limpar cache" cobre dois problemas distintos que se confundem sob o mesmo nome:
       (1) o cache interno com validade (§70, Cache.ler/gravar) que guarda respostas de
       provedores (clima, voos etc.) em localStorage sob o prefixo 'rot2_cache_'; e
       (2) a cópia do próprio index.html retida pelo navegador, que pode continuar
       executando uma versão antiga do motor mesmo depois de o servidor já ter sido
       atualizado — foi exatamente esse caso que produziu "Render.conflitos is not a
       function" numa aba que não tinha sido recarregada desde antes da correção.
       Uma query string nova (nunca vista antes) força o navegador a buscar o documento
       de novo na rede em vez de servir uma cópia em cache, independente dos cabeçalhos
       de Cache-Control do servidor — mais confiável do que location.reload(). */
    limparCacheSistema() {
        try {
            Object.keys(localStorage)
                .filter(k => k.indexOf('rot2_cache_') === 0)
                .forEach(k => localStorage.removeItem(k));
        } catch (e) {}
        const url = new URL(location.href);
        url.searchParams.set('_atualizado', Date.now());
        location.href = url.toString();
    },

    iniciar() {
        Tema.iniciar();
        Nav.iniciar();
        Tooltip.iniciar();
        const salvo = Persist.lerConfig();
        if (salvo) Form.carregarConfig(salvo);
        Form.montar();
        Nav.reindexar();
        document.getElementById('btnRegenerar').addEventListener('click', App.regenerar);
        document.getElementById('btnNovo').addEventListener('click', App.limparRoteiro);
        document.getElementById('btnLimparCache').addEventListener('click', App.limparCacheSistema);
        if (location.search.indexOf('debug=1') >= 0) Testes.executar();
    }
};

/* =====================================================================================
   [22] EDIÇÃO MANUAL DO ROTEIRO (§66)
   O roteiro gerado deixa de ser um artefato imutável. As operações admitidas são:
   acrescentar atração a um dia, reinserir atração descartada, remover atração, mover
   atração entre dias da mesma cidade, alterar o horário de início de um bloco,
   reencadear o dia a pedido, trocar a hospedagem entre as opções cadastradas,
   desfazer e refazer.

   Três princípios governam este módulo:

   1. NADA É REVERTIDO EM SILÊNCIO E NADA É APLICADO EM SILÊNCIO. Toda operação é
      executada sobre o objeto real, validada, e — se produzir falha ou conflito que
      não existia antes — desfeita e devolvida ao usuário como proposta pendente. Só
      a confirmação explícita a converte em alteração efetiva. O motor jamais decide
      por conta própria entre manter e reverter.
   2. REPARAÇÃO AUTOMÁTICA NÃO ATUA AQUI. repararRoteiro() remove atrações fechadas
      por conta própria, o que seria inaceitável durante a edição: a decisão pertence
      ao usuário. Usa-se apenas validarRoteiro().
   3. AS PILHAS DE DESFAZER E REFAZER SÃO ESCOPADAS AO ROTEIRO. Elas guardam o id do
      roteiro a que pertencem; um roteiro novo as esvazia. Nenhuma edição atravessa
      gerações (§7). A pilha de refazer é simétrica à de desfazer e se invalida ao
      primeiro passo novo: refazer um caminho abandonado seria ressuscitar um estado
      que o usuário já descartou.
   ===================================================================================== */
const Edicao = {
    LIMITE_PILHA: 20,
    roteiroId: null,
    pilha: [],
    refazerPilha: [],
    pendente: null,
    erro: null,

    /* --------------------------------------------------------- ESCOPO E ISOLAMENTO */
    garantir(r) {
        if (!r) return false;
        if (Edicao.roteiroId !== r.id) {
            Edicao.roteiroId = r.id;
            Edicao.pilha = [];
            Edicao.refazerPilha = [];
            Edicao.pendente = null;
            Edicao.erro = null;
        }
        if (!r.historico) r.historico = [];
        return true;
    },

    /* ------------------------------------------------------------------ SNAPSHOTS
       Clona apenas o que a edição pode alterar. Referências à base interna (DB) são
       compartilhadas de propósito: são imutáveis e reclonar a base a cada alteração
       seria desperdício sem ganho de segurança. */
    clonarDias(dias) {
        return dias.map(d => Object.assign({}, d, { blocos: JSON.parse(JSON.stringify(d.blocos || [])) }));
    },
    snapshot(r) {
        return {
            dias: Edicao.clonarDias(r.dias),
            deslocamentos: r.deslocamentos.map(t => Object.assign({}, t, { custoPP: t.custoPP ? t.custoPP.slice() : t.custoPP })),
            hospedagens: r.hospedagens.map(h => Object.assign({}, h)),
            atracoes: r.atracoes.slice(),
            descartadas: r.descartadas.map(d => Object.assign({}, d)),
            ingressos: JSON.parse(JSON.stringify(r.ingressos || {})),
            custos: JSON.parse(JSON.stringify(r.custos || {})),
            pontuacao: JSON.parse(JSON.stringify(r.pontuacao || {})),
            planoB: (r.planoB || []).map(p => Object.assign({}, p)),
            conflitos: (r.conflitos || []).map(c => Object.assign({}, c)),
            avisos: (r.avisos || []).slice(),
            decisoes: (r.decisoes || []).slice(),
            validacao: r.validacao ? JSON.parse(JSON.stringify(r.validacao)) : null,
            historico: (r.historico || []).map(h => Object.assign({}, h)),
            atualizadoEm: r.atualizadoEm
        };
    },
    restaurar(r, s) {
        r.dias = s.dias;
        r.deslocamentos = s.deslocamentos;
        r.hospedagens = s.hospedagens;
        r.atracoes = s.atracoes;
        r.descartadas = s.descartadas;
        r.ingressos = s.ingressos;
        r.custos = s.custos;
        r.pontuacao = s.pontuacao;
        r.planoB = s.planoB;
        r.conflitos = s.conflitos;
        r.avisos = s.avisos;
        r.decisoes = s.decisoes;
        r.validacao = s.validacao;
        r.historico = s.historico;
        r.atualizadoEm = s.atualizadoEm;
        return r;
    },

    /* ------------------------------------------------------------- RECÁLCULO (§66)
       Refaz, na ordem de dependência, tudo o que decorre do cronograma. Não refaz a
       seleção de cidades nem os deslocamentos entre elas: a edição manual não muda a
       rota. Para isso existe o botão Regenerar. */
    recalcular(r, origem) {
        const cfg = r.config;
        r.atracoes = [];
        r.dias.forEach(d => (d.blocos || []).forEach(b => {
            if (b.tipo === 'atracao') { const a = IDX.atracao(b.atracaoId); if (a) r.atracoes.push(a); }
        }));
        r.ingressos = calcularIngressos(cfg, r.dias, r);
        r.custos = calcularCustos(cfg, r.cidades, r.dias, r.ingressos, r);
        r.planoB = gerarPlanoB(cfg, r.dias, r);
        const v = validarRoteiro(r);
        r.validacao = { ok: v.ok, falhas: v.falhas, tentativas: 0, limite: CONFIG.maxTentativasReparo, origem: origem || 'edição manual — sem reparação automática' };
        r.pontuacao = calcularPontuacao(cfg, r);
        r.atualizadoEm = new Date().toISOString();
        return r;
    },

    assinatura(f) { return f.tipo + '|' + (f.dia || '') + '|' + (f.o || ''); },

    /* ----------------------------------------------------------------- OPERAÇÕES */
    diaValido(r, i) { return i >= 0 && i < r.dias.length && r.dias[i]; },

    /* ------------------------------------------------------- LEITURAS AUXILIARES
       Nenhuma delas altera o roteiro: servem tanto à interface quanto às operações,
       e é por isso que vivem fora de executar(). */

    /* Menor idade do grupo — mesma regra de selecionarAtracoes(), para que a edição
       manual não admita o que a geração recusou por restrição rígida (§25). */
    menorIdade(cfg) {
        const id = (cfg.viajantes && cfg.viajantes.idades) || [];
        return id.length ? Math.min.apply(null, id) : 30;
    },

    /* Identificadores de tudo o que já está agendado, em qualquer dia. */
    agendadas(r) {
        const s = new Set();
        r.dias.forEach(d => (d.blocos || []).forEach(b => { if (b.atracaoId) s.add(b.atracaoId); }));
        return s;
    },

    /* Minutos de visita já comprometidos no dia — a mesma grandeza que capacidadeDiaria()
       produz, para que a comparação seja entre iguais. */
    ocupacao(dia) {
        return (dia.blocos || []).reduce((s, b) => s + (b.tipo === 'atracao' ? b.fim - b.ini : 0), 0);
    },

    /* Soma dos intervalos abertos antes das âncoras de fim de dia. É o buraco que uma
       remoção deixa e que o reencadeamento sob demanda fecha. */
    intervalo(dia) {
        const b = dia.blocos || [];
        const limite = Edicao.ancoraFinal(dia);
        let g = 0;
        for (let k = 1; k < limite; k++) if (b[k].ini > b[k - 1].fim) g += b[k].ini - b[k - 1].fim;
        return g;
    },

    /* Tarifa cadastrada, resumida para o rótulo da candidata. Jamais estimada: sem
       registro na base, o rótulo diz que não há tarifa disponível (§12). */
    tarifaResumo(a) {
        const c = a.custo;
        if (!c || c.tipo !== 'CADASTRADO' || c.valor == null) return 'tarifa não disponível';
        if (c.valor === 0) return 'entrada gratuita';
        if (typeof c.valor === 'object') {
            const t = (c.valor.adulto || 0) + (c.valor.taxaReserva || 0);
            return t > 0 ? U.eur(t) + '/adulto' : 'entrada gratuita';
        }
        return 'tarifa não disponível';
    },

    /* Candidatas para um dia: atrações cadastradas da cidade daquele dia que ainda não
       estão no cronograma, compatíveis com a idade do grupo, ordenadas pela mesma
       pontuação que decidiu a seleção original — pontuarAtracao() é a função da
       geração, reaproveitada, e não uma segunda régua. */
    candidatasDoDia(r, dia) {
        const cfg = r.config;
        const pesos = pesosObjetivos(cfg);
        const menor = Edicao.menorIdade(cfg);
        const ja = Edicao.agendadas(r);
        const dow = U.diaSemana(dia.data);
        return IDX.atracoesDe(dia.cidadeId)
            .filter(a => !ja.has(a.id) && a.idadeMin <= menor)
            .map(a => {
                const s = pontuarAtracao(a, cfg, pesos);
                return { a: a, score: Math.round(s.total), porque: s.pontos, fecha: a.fechado.indexOf(dow) >= 0 };
            })
            .sort((x, y) => y.score - x.score);
    },

    /* Índice a partir do qual a inserção deve ocorrer: antes do jantar e de toda a
       logística de partida, que são âncoras de fim de dia. */
    ancoraFinal(dia) {
        const b = dia.blocos || [];
        let ins = b.length;
        for (let k = b.length - 1; k >= 0; k--) {
            const x = b[k];
            const ehFim = (x.tipo === 'refeicao' && /Jantar/i.test(x.titulo)) ||
                          (x.tipo === 'logistica' && /(Check-out|aeroporto)/i.test(x.titulo));
            if (ehFim) ins = k; else break;
        }
        return ins;
    },

    /* Reencadeia os blocos a partir de um índice, preservando durações. */
    reencadear(dia, desde) {
        const b = dia.blocos;
        for (let k = Math.max(1, desde); k < b.length; k++) {
            const dur = b[k].fim - b[k].ini;
            if (b[k].ini < b[k - 1].fim) { b[k].ini = b[k - 1].fim; b[k].fim = b[k].ini + dur; }
        }
    },

    /* Retira o bloco da atração e, se houver, o deslocamento que existia apenas para
       alcançá-la. Devolve o bloco removido. */
    extrair(r, diaIdx, blocoIdx) {
        const dia = r.dias[diaIdx];
        const b = dia.blocos[blocoIdx];
        if (!b || b.tipo !== 'atracao') throw new Error('O bloco selecionado não é uma atração.');
        const a = IDX.atracao(b.atracaoId);
        let ini = blocoIdx;
        if (blocoIdx > 0) {
            const ant = dia.blocos[blocoIdx - 1];
            if (ant.tipo === 'desloc' && a && ant.titulo.indexOf(a.nome) >= 0) ini = blocoIdx - 1;
        }
        const removidos = dia.blocos.splice(ini, blocoIdx - ini + 1);
        return { bloco: removidos[removidos.length - 1], atracao: a, dia };
    },

    executar(r, op) {
        const cfg = r.config;

        /* ------------------------------------------------------------- ACRESCENTAR
           Serve tanto ao acréscimo a partir do cronograma quanto à reinserção a partir
           do painel de descartadas: são a mesma operação vista de dois lugares. */
        if (op.tipo === 'adicionar') {
            if (!Edicao.diaValido(r, op.dia)) throw new Error('Dia inexistente.');
            const dia = r.dias[op.dia];
            const a = IDX.atracao(op.atracaoId);
            if (!a) throw new Error('Atração não cadastrada na base interna — o sistema não inventa atrações.');
            if (a.cidadeId !== dia.cidadeId) {
                throw new Error('“' + a.nome + '” pertence a outra cidade e o dia escolhido é em ' + dia.cidadeNome +
                    '. Mudar de cidade altera a rota e exige regenerar o roteiro.');
            }
            if (Edicao.agendadas(r).has(a.id)) throw new Error('“' + a.nome + '” já consta do cronograma — o motor não duplica atrações.');
            const menor = Edicao.menorIdade(cfg);
            if (a.idadeMin > menor) {
                throw new Error('Idade mínima de ' + a.idadeMin + ' anos, incompatível com o integrante mais novo do grupo (' +
                    menor + ' anos). Restrição rígida: não é oferecida sequer como conflito a confirmar.');
            }

            const ritmo = CONFIG.ritmos[cfg.ritmo] || CONFIG.ritmos.moderado;
            const ins = Edicao.ancoraFinal(dia);
            const anterior = ins > 0 ? dia.blocos[ins - 1] : null;
            let t = anterior ? anterior.fim : U.min(ritmo.inicio);

            // Zona da última atração antes do ponto de inserção: se difere, o
            // deslocamento entra como bloco próprio, exatamente como na geração.
            let zonaAnt = null;
            for (let k = ins - 1; k >= 0; k--) {
                if (dia.blocos[k].tipo === 'atracao') { const x = IDX.atracao(dia.blocos[k].atracaoId); if (x) zonaAnt = x.zona; break; }
            }
            const novos = [];
            if (zonaAnt && zonaAnt !== a.zona) {
                const dm = IDX.minutosZona(dia.cidadeId, zonaAnt, a.zona);
                novos.push({
                    ini: t, fim: t + dm, tipo: 'desloc', icone: '🚶', titulo: 'Deslocamento até ' + a.nome,
                    desc: U.dur(dm) + ' entre ' + String(zonaAnt).replace(/_/g, ' ') + ' e ' + String(a.zona).replace(/_/g, ' ') + '. Tempo estimado.'
                });
                t += dm;
            }
            const s = pontuarAtracao(a, cfg, pesosObjetivos(cfg));
            novos.push({
                ini: t, fim: t + a.dur, tipo: 'atracao', icone: '📍', titulo: a.nome, atracaoId: a.id,
                desc: a.desc, score: Math.round(s.total),
                porque: s.pontos.concat([['Inserida manualmente por você', 'decisão do usuário, não do motor']])
            });
            Array.prototype.splice.apply(dia.blocos, [ins, 0].concat(novos));
            Edicao.reencadear(dia, ins);

            // Sai do painel de descartadas, se lá estava, e limpa o conflito grave que
            // a própria retirada havia gerado quando a atração é obrigatória.
            const antesDesc = r.descartadas.length;
            r.descartadas = r.descartadas.filter(d => !d.atracao || d.atracao.id !== a.id);
            const eraDescartada = r.descartadas.length < antesDesc;
            if ((cfg.obrigatorias || []).indexOf(a.id) >= 0) {
                const rotulos = ['Atração obrigatória removida manualmente: ' + a.nome, 'Atração obrigatória não encaixada: ' + a.nome];
                const antesConf = r.conflitos.length;
                r.conflitos = r.conflitos.filter(c => rotulos.indexOf(c.titulo) < 0);
                if (r.conflitos.length < antesConf) {
                    r.avisos.push('Edição manual: com o retorno de ' + a.nome + ' ao cronograma, o conflito grave da atração obrigatória ausente deixa de existir e os doze pontos descontados voltam à nota global.');
                }
            }

            r.avisos.push('Edição manual: ' + a.nome + (eraDescartada ? ' foi reinserida' : ' foi acrescentada') +
                ' em ' + U.dataBR(dia.data) + ', às ' + U.hhmm(novos[novos.length - 1].ini) + ', ocupando ' + U.dur(a.dur) + '.');

            // Capacidade do ritmo: excedê-la é escolha admissível, mas nunca silenciosa.
            const cap = dia.capacidade || 0;
            const oc = Edicao.ocupacao(dia);
            if (cap && oc > cap) {
                r.conflitos.push({
                    grave: false,
                    titulo: 'Capacidade do ritmo excedida em ' + U.dataExtenso(dia.data),
                    campo: '#f_ritmo',
                    problema: 'O ritmo ' + ((CONFIG.ritmos[cfg.ritmo] || {}).rotulo || cfg.ritmo) + ' reserva ' + U.dur(cap) +
                        ' de visitas neste dia. Com ' + a.nome + ' (' + U.dur(a.dur) + '), a programação passa a somar ' +
                        U.dur(oc) + ' — excedente de ' + U.dur(oc - cap) + '.',
                    impacto: 'O dia fica mais cheio do que o ritmo que você declarou comporta. A nota de ritmo cai, e o risco de atraso acumulado ao longo do dia aumenta. Nenhuma atração foi retirada para abrir espaço: a decisão é sua.',
                    opcoes: ['Manter assim e aceitar o dia mais intenso', 'Retirar outra atração deste dia', 'Mover a atração para outro dia da mesma cidade', 'Adotar ritmo mais intenso no formulário e regenerar']
                });
            }
            registrar(r, 'Atração acrescentada — escolha do usuário', a.nome + ' em ' + U.dataExtenso(dia.data),
                [['Origem da decisão', 'Inserção manual, sobrepondo a seleção automática'],
                 ['Pontuação da atração', String(Math.round(s.total)) + ' — mesma fórmula da seleção original'],
                 ['Ocupação do dia após a inserção', U.dur(oc) + ' de ' + U.dur(cap) + ' de capacidade'],
                 ['Tarifa cadastrada', Edicao.tarifaResumo(a)]]);
            return;
        }

        /* -------------------------------------------------------------- REENCADEAR
           Ação explícita: fecha o intervalo deixado por uma remoção. Nunca automática —
           puxar blocos para a frente sem pedido seria alterar horários em silêncio. */
        if (op.tipo === 'reencadear') {
            if (!Edicao.diaValido(r, op.dia)) throw new Error('Dia inexistente.');
            const dia = r.dias[op.dia];
            const b = dia.blocos || [];
            const limite = Edicao.ancoraFinal(dia);
            const ganho = Edicao.intervalo(dia);
            if (!ganho) throw new Error('Não há intervalo a fechar em ' + U.dataBR(dia.data) + ' — os blocos já estão encadeados.');
            for (let k = 1; k < limite; k++) {
                const dur = b[k].fim - b[k].ini;
                if (b[k].ini !== b[k - 1].fim) { b[k].ini = b[k - 1].fim; b[k].fim = b[k].ini + dur; }
            }
            Edicao.reencadear(dia, limite);   // âncoras só andam para a frente, nunca para trás
            r.avisos.push('Edição manual: o dia ' + U.dataBR(dia.data) + ' foi reencadeado a seu pedido, fechando ' +
                U.dur(ganho) + ' de intervalo. Jantar e logística de fim de dia permanecem nos horários em que estavam.');
            return;
        }

        if (op.tipo === 'remover') {
            if (!Edicao.diaValido(r, op.dia)) throw new Error('Dia inexistente.');
            const ex = Edicao.extrair(r, op.dia, op.bloco);
            const a = ex.atracao;
            r.descartadas.push({
                atracao: a, cidade: ex.dia.cidadeNome, score: ex.bloco.score,
                motivo: 'Retirada manualmente por você do dia ' + U.dataExtenso(ex.dia.data) + '.'
            });
            r.avisos.push('Edição manual: ' + a.nome + ' foi retirada de ' + U.dataBR(ex.dia.data) +
                ', liberando ' + U.dur(ex.bloco.fim - ex.bloco.ini) + ' no dia. Os horários dos demais blocos permanecem como estavam.');
            if ((cfg.obrigatorias || []).indexOf(a.id) >= 0) {
                r.conflitos.push({
                    grave: true,
                    titulo: 'Atração obrigatória removida manualmente: ' + a.nome,
                    campo: '#chipsObrig',
                    problema: 'Você marcou ' + a.nome + ' como “não quero perder” e acaba de retirá-la do cronograma de ' + U.dataExtenso(ex.dia.data) + '.',
                    impacto: 'O roteiro deixa de cumprir uma restrição rígida que você mesmo declarou. A nota global perde doze pontos enquanto o conflito existir.',
                    opcoes: ['Desfazer a remoção', 'Retirar a marcação de “não quero perder” no formulário e regenerar', 'Manter a remoção e conviver com o desconto na nota']
                });
            }
            return;
        }

        if (op.tipo === 'mover') {
            if (!Edicao.diaValido(r, op.dia) || !Edicao.diaValido(r, op.destino)) throw new Error('Dia inexistente.');
            if (op.dia === op.destino) throw new Error('Origem e destino são o mesmo dia.');
            const origem = r.dias[op.dia], destino = r.dias[op.destino];
            if (origem.cidadeId !== destino.cidadeId) throw new Error('A movimentação só é admitida entre dias da mesma cidade — mudar de cidade altera a rota e exige regenerar.');
            const ex = Edicao.extrair(r, op.dia, op.bloco);
            const dur = ex.bloco.fim - ex.bloco.ini;
            const ins = Edicao.ancoraFinal(destino);
            const anterior = ins > 0 ? destino.blocos[ins - 1] : null;
            const ritmo = CONFIG.ritmos[cfg.ritmo] || CONFIG.ritmos.moderado;
            const inicio = anterior ? anterior.fim : U.min(ritmo.inicio);
            const novo = Object.assign({}, ex.bloco, { ini: inicio, fim: inicio + dur });
            destino.blocos.splice(ins, 0, novo);
            Edicao.reencadear(destino, ins);
            r.avisos.push('Edição manual: ' + ex.atracao.nome + ' passou de ' + U.dataBR(origem.data) +
                ' para ' + U.dataBR(destino.data) + ', encaixada às ' + U.hhmm(inicio) + '.');
            return;
        }

        if (op.tipo === 'horario') {
            if (!Edicao.diaValido(r, op.dia)) throw new Error('Dia inexistente.');
            const dia = r.dias[op.dia], b = dia.blocos[op.bloco];
            if (!b) throw new Error('Bloco inexistente.');
            const novoIni = U.min(op.valor);
            if (isNaN(novoIni)) throw new Error('Horário inválido.');
            const dur = b.fim - b.ini, antes = b.ini;
            b.ini = novoIni; b.fim = novoIni + dur;
            r.avisos.push('Edição manual: “' + b.titulo + '” em ' + U.dataBR(dia.data) + ' passou de ' +
                U.hhmm(antes) + ' para ' + U.hhmm(novoIni) + '. Os demais blocos não foram deslocados — se houver sobreposição, ela é declarada, não corrigida.');
            return;
        }

        if (op.tipo === 'hotel') {
            const hp = r.hospedagens.find(h => h.cidadeId === op.cidadeId);
            if (!hp) throw new Error('Cidade sem registro de hospedagem.');
            const o = (hp.opcoes || []).find(x => x.id === op.hotelId);
            if (!o) throw new Error('Opção de hospedagem não cadastrada para esta cidade — o sistema não inventa hotéis.');
            hp.escolhaId = o.id;
            registrar(r, 'Hospedagem — escolha do usuário',
                'Base em ' + hp.cidadeNome + ' definida manualmente: ' + o.nome,
                [['Origem da decisão', 'Escolha explícita do usuário, sobrepondo a ordem sugerida'],
                 ['Efeito no orçamento', 'Nenhum: sem provedor de tarifas, a linha de hospedagem continua sendo a faixa estimada da classe ' + hp.classe],
                 ['Zona', o.zona ? String(o.zona).replace(/_/g, ' ') : 'não informada']]);
            r.avisos.push('Edição manual: base de ' + hp.cidadeNome + ' trocada para ' + o.nome +
                '. A estimativa de custo não muda, porque a diária real desta propriedade não está disponível.');
            return;
        }

        if (op.tipo === 'trecho') {
            const t = r.deslocamentos[op.idx];
            if (!t) throw new Error('Trecho inexistente.');
            if (!t.estimadoPorDistancia && !t.ajustadoPeloUsuario) throw new Error('Este trecho vem da base curada — o ajuste aqui é só para estimativas por distância.');
            if (op.campo === 'duracao') {
                const v = parseInt(op.valor, 10);
                if (isNaN(v) || v <= 0) throw new Error('Duração inválida.');
                t.duracao = v;
            } else if (op.campo === 'custoMin' || op.campo === 'custoMax') {
                const v = parseFloat(String(op.valor).replace(',', '.'));
                if (isNaN(v) || v < 0) throw new Error('Custo inválido.');
                const atual = t.custoPP || [0, 0];
                t.custoPP = op.campo === 'custoMin' ? [v, Math.max(v, atual[1])] : [Math.min(atual[0], v), v];
            } else {
                throw new Error('Campo desconhecido.');
            }
            t.ajustadoPeloUsuario = true;
            t.fonte = 'Ajustado por você a partir da estimativa por distância geográfica.';
            r.avisos.push('Edição manual: o trecho ' + t.deNome + ' → ' + t.paraNome + ' foi ajustado manualmente, substituindo a estimativa por distância.');
            return;
        }

        throw new Error('Operação desconhecida.');
    },

    descrever(r, op) {
        try {
            if (op.tipo === 'adicionar') {
                const d = r.dias[op.dia], a = IDX.atracao(op.atracaoId);
                const volta = r.descartadas.some(x => x.atracao && x.atracao.id === op.atracaoId);
                return (volta ? 'Reinserir “' : 'Acrescentar “') + (a ? a.nome : op.atracaoId) + '” em ' + U.dataExtenso(d.data) + ' (' + d.cidadeNome + ')';
            }
            if (op.tipo === 'reencadear') {
                const d = r.dias[op.dia];
                return 'Reencadear o dia ' + U.dataExtenso(d.data) + ', fechando ' + U.dur(Edicao.intervalo(d)) + ' de intervalo';
            }
            if (op.tipo === 'remover') {
                const d = r.dias[op.dia], b = d.blocos[op.bloco];
                return 'Remover “' + b.titulo + '” de ' + U.dataExtenso(d.data) + ' (' + d.cidadeNome + ')';
            }
            if (op.tipo === 'mover') {
                const d = r.dias[op.dia], b = d.blocos[op.bloco], t = r.dias[op.destino];
                return 'Mover “' + b.titulo + '” de ' + U.dataBR(d.data) + ' para ' + U.dataExtenso(t.data);
            }
            if (op.tipo === 'horario') {
                const d = r.dias[op.dia], b = d.blocos[op.bloco];
                return 'Alterar o início de “' + b.titulo + '” em ' + U.dataBR(d.data) + ' de ' + U.hhmm(b.ini) + ' para ' + op.valor;
            }
            if (op.tipo === 'hotel') {
                const hp = r.hospedagens.find(h => h.cidadeId === op.cidadeId);
                const o = hp && (hp.opcoes || []).find(x => x.id === op.hotelId);
                return 'Trocar a base de ' + (hp ? hp.cidadeNome : op.cidadeId) + ' para ' + (o ? o.nome : op.hotelId);
            }
            if (op.tipo === 'trecho') {
                const t = r.deslocamentos[op.idx];
                return 'Ajustar estimativa do trecho ' + (t ? t.deNome + ' → ' + t.paraNome : op.idx) + ' (' + op.campo + ')';
            }
        } catch (e) {}
        return 'Alteração manual';
    },

    /* ------------------------------------------------------------------- APLICAR
       Executa sobre o objeto real, valida e — havendo conflito novo — restaura o
       estado exato anterior e devolve a proposta como pendente. Nada é aplicado nem
       revertido sem que o usuário decida. */
    aplicar(r, op, opts) {
        Edicao.garantir(r);
        Edicao.erro = null;
        const forcar = !!(opts && opts.forcar);
        const descricao = Edicao.descrever(r, op);
        const snap = Edicao.snapshot(r);
        const antes = new Set(validarRoteiro(r).falhas.map(Edicao.assinatura));
        // Identidade, não comprimento: acrescentar uma atração obrigatória pode extinguir
        // um conflito e criar outro no mesmo passo, e a contagem esconderia o novo.
        const conflitosAntes = new Set(r.conflitos);

        try { Edicao.executar(r, op); }
        catch (e) { Edicao.restaurar(r, snap); Edicao.erro = e.message; return { status: 'erro', msg: e.message }; }

        Edicao.recalcular(r);
        const falhasNovas = (r.validacao.falhas || []).filter(f => !antes.has(Edicao.assinatura(f)));
        const conflitosNovos = r.conflitos.filter(c => !conflitosAntes.has(c));

        if ((falhasNovas.length || conflitosNovos.length) && !forcar) {
            Edicao.restaurar(r, snap);
            Edicao.pendente = { op, descricao, falhas: falhasNovas, conflitos: conflitosNovos };
            return { status: 'conflito', falhas: falhasNovas, conflitos: conflitosNovos, descricao };
        }

        Edicao.pendente = null;
        Edicao.pilha.push(snap);
        while (Edicao.pilha.length > Edicao.LIMITE_PILHA) Edicao.pilha.shift();
        // Passo novo abandona o ramo desfeito: refazer deixaria o roteiro num estado
        // que o usuário já descartou, e que agora nem sequer é alcançável.
        Edicao.refazerPilha = [];
        r.historico.push({
            em: new Date().toISOString(), texto: descricao, forcado: forcar,
            conflitos: falhasNovas.map(f => Edicao.rotularFalha(f)).concat(conflitosNovos.map(c => c.titulo)),
            nota: r.pontuacao.global
        });
        return { status: 'aplicado', descricao, nota: r.pontuacao.global };
    },

    confirmarPendente(r) {
        const p = Edicao.pendente;
        if (!p) return { status: 'erro', msg: 'Não há alteração pendente.' };
        Edicao.pendente = null;
        return Edicao.aplicar(r, p.op, { forcar: true });
    },
    cancelarPendente() { Edicao.pendente = null; },

    /* Desfazer e refazer são a mesma mecânica em sentidos opostos: o estado corrente é
       fotografado antes de sair de cena e vai para a pilha oposta, de modo que o
       caminho percorrido continue reversível nas duas direções enquanto nenhum passo
       novo for dado. */
    desfazer(r) {
        Edicao.garantir(r);
        if (!Edicao.pilha.length) return false;
        const atual = Edicao.snapshot(r);
        const s = Edicao.pilha.pop();
        Edicao.restaurar(r, s);
        Edicao.refazerPilha.push(atual);
        while (Edicao.refazerPilha.length > Edicao.LIMITE_PILHA) Edicao.refazerPilha.shift();
        Edicao.pendente = null;
        return true;
    },

    refazer(r) {
        Edicao.garantir(r);
        if (!Edicao.refazerPilha.length) return false;
        const atual = Edicao.snapshot(r);
        const s = Edicao.refazerPilha.pop();
        Edicao.restaurar(r, s);
        Edicao.pilha.push(atual);
        while (Edicao.pilha.length > Edicao.LIMITE_PILHA) Edicao.pilha.shift();
        Edicao.pendente = null;
        return true;
    },

    rotularFalha(f) {
        const m = {
            sobreposicao: 'Sobreposição de horários',
            fechado: 'Atração fechada no dia',
            passa_da_meia_noite: 'Programação ultrapassa a meia-noite',
            noites: 'Divergência na contagem de noites',
            duplicada: 'Atração repetida no roteiro',
            obrigatoria_ausente: 'Atração obrigatória fora do cronograma'
        };
        return (m[f.tipo] || f.tipo) + (f.o ? ': ' + f.o : '') + (f.dia ? ' — ' + U.dataBR(f.dia) : '');
    },

    /* ---------------------------------------------------------------- INTERFACE */
    hotelEscolhido(hp) { return hp.escolhaId || ((hp.opcoes || [])[0] || {}).id || null; },

    painel(r) {
        Edicao.garantir(r);
        const podeDesfazer = Edicao.pilha.length > 0;
        const podeRefazer = Edicao.refazerPilha.length > 0;
        let h = '<div class="ed-console">';
        h += '<div class="ed-console-head"><span class="ed-tag">Edição manual</span>' +
            R.tt('como funciona', 'Toda alteração é executada, <b>validada</b> e só então mantida. ' +
                'Se criar conflito que antes não existia — dia de fechamento, sobreposição, ' +
                'capacidade do ritmo excedida, atração obrigatória retirada — a alteração é suspensa e devolvida para sua decisão: ' +
                'manter mesmo assim ou cancelar. <b>O sistema nunca reverte por conta própria</b> nem aplica ' +
                'sem confirmação. Após cada alteração aceita, ingressos, custos, plano B e pontuação são recalculados.') +
            '<span class="ed-console-acoes">' +
            '<button class="btn-ghost ed-btn" data-ed="desfazer"' + (podeDesfazer ? '' : ' disabled') +
            ' title="Restaura o estado imediatamente anterior à última alteração aceita, incluindo cronograma, ingressos, custos, plano B e nota. A pilha guarda até ' + Edicao.LIMITE_PILHA + ' passos e pertence exclusivamente a este roteiro: gerar outro roteiro a esvazia.">↶ Desfazer' +
            (podeDesfazer ? ' (' + Edicao.pilha.length + ')' : '') + '</button>' +
            '<button class="btn-ghost ed-btn" data-ed="refazer"' + (podeRefazer ? '' : ' disabled') +
            ' title="Reaplica a alteração que você acabou de desfazer, devolvendo o estado intermediário exato — cronograma, ingressos, custos, plano B e nota. A pilha de refazer se esvazia assim que qualquer alteração nova é aceita: o ramo abandonado deixa de ser alcançável. Também pertence apenas a este roteiro.">↷ Refazer' +
            (podeRefazer ? ' (' + Edicao.refazerPilha.length + ')' : '') + '</button>' +
            '<button class="ed-btn ed-transf" data-ed="exportar"' +
            ' title="Grava o roteiro inteiro num arquivo .json: configuração, cidades, dias, horários, blocos, hospedagem escolhida, histórico de edição, decisões e destinos declarados. ' +
            'O arquivo leva impressão digital de cada registro consumido, de modo que a reimportação saiba dizer o que mudou na base desde agora. ' +
            'Serve para guardar, versionar e compartilhar — e para não perder as edições ao recarregar a página, já que elas vivem apenas em memória.">⬇ Exportar roteiro</button>' +
            '<button class="ed-btn ed-transf" data-ed="importar"' +
            ' title="Lê um arquivo .json exportado por este sistema e reidrata o roteiro. As escolhas vêm do arquivo; tarifas, durações, endereços e dias de fechamento vêm sempre da base atual. ' +
            'Ingressos, custos, plano B, validação e pontuação são recalculados; clima e câmbio, reconsultados. Toda divergência entre o arquivo e a base é declarada item a item, e identificador inexistente vira conflito. ' +
            'ATENÇÃO: substitui o roteiro exibido, que não é salvo automaticamente.">⬆ Importar roteiro</button></span></div>';

        h += Transferencia.painel();

        if (Edicao.erro) {
            h += '<div class="ed-alerta erro"><b>Operação não realizada.</b> ' + U.esc(Edicao.erro) + '</div>';
        }

        if (Edicao.pendente) {
            const p = Edicao.pendente;
            h += '<div class="ed-pendente"><h4>⚠️ Conflito detectado — a alteração está suspensa</h4>';
            h += '<p class="ed-prop"><b>Alteração proposta:</b> ' + U.esc(p.descricao) + '</p><ul class="ed-lista">';
            p.falhas.forEach(f => { h += '<li>' + U.esc(Edicao.rotularFalha(f)) + '</li>'; });
            p.conflitos.forEach(c => { h += '<li>' + U.esc(c.titulo) + ' — ' + U.esc(c.problema) + '</li>'; });
            h += '</ul>';
            h += '<p class="ed-nota">O roteiro exibido abaixo <b>ainda é o anterior</b>: nada foi alterado. A decisão é sua.</p>';
            h += '<div class="ed-decisao">' +
                '<button class="btn-primary ed-btn" data-ed="confirmar" title="Aplica a alteração apesar do conflito. O conflito passa a constar do módulo de conflitos e da validação, e conflitos graves descontam doze pontos da nota global. Você continua podendo desfazer.">Manter mesmo assim</button>' +
                '<button class="btn-ghost ed-btn" data-ed="cancelar" title="Descarta a alteração proposta. O roteiro permanece exatamente como está — nenhuma reversão adicional é feita, porque nada chegou a ser aplicado.">Cancelar a alteração</button></div>';
            h += '</div>';
        }

        const hist = (r.historico || []);
        if (hist.length) {
            h += '<div class="ed-hist"><div class="ed-hist-t">Alterações aplicadas nesta sessão · ' + hist.length + '</div><ol>';
            hist.forEach(x => {
                h += '<li>' + U.esc(x.texto) +
                    (x.forcado ? ' <span class="ed-flag">mantida apesar de conflito</span>' : '') +
                    (x.conflitos && x.conflitos.length ? '<br><span class="ed-sub">' + U.esc(x.conflitos.join(' · ')) + '</span>' : '') +
                    ' <span class="ed-sub">nota ' + x.nota + '/100</span></li>';
            });
            h += '</ol><p class="ed-nota">As alterações vivem apenas no roteiro em memória. <b>Regenerar</b> reconstrói tudo a partir do formulário e as descarta.</p></div>';
        }
        h += '</div>';
        return h;
    },

    /* Controles de um bloco do cronograma. Recebem índices, nunca objetos: a
       renderização permanece pura e o estado continua vivendo apenas no roteiro. */
    controles(r, diaIdx, blocoIdx, bloco, dia) {
        let h = '<div class="ed-ctrl">';
        h += '<label class="ed-mini" title="Altera o horário de início deste bloco preservando a duração. Fórmula: fim = novo início + duração atual (' +
            U.dur(bloco.fim - bloco.ini) + '). Os demais blocos do dia NÃO são deslocados: se a mudança criar sobreposição, o conflito é declarado e a decisão de manter fica com você.">' +
            '⏱ <input type="time" class="ed-hora" data-ed="hora" data-dia="' + diaIdx + '" data-bloco="' + blocoIdx +
            '" aria-label="Horário de início de ' + U.esc(bloco.titulo) + ' em ' + U.esc(U.dataExtenso(dia.data)) + '" value="' + U.hhmm(bloco.ini) + '"></label>';

        if (bloco.tipo === 'atracao') {
            const destinos = r.dias.map((d, i) => ({ d, i }))
                .filter(x => x.i !== diaIdx && x.d.cidadeId === dia.cidadeId);
            if (destinos.length) {
                h += '<select class="ed-sel" data-ed="mover" data-dia="' + diaIdx + '" data-bloco="' + blocoIdx +
                    '" aria-label="Mover ' + U.esc(bloco.titulo) + ' para outro dia da mesma cidade" ' +
                    'title="Transfere esta atração para outro dia da mesma cidade. Ela é inserida antes do jantar e da logística de partida, começando ao fim do último bloco do dia de destino; a duração é preservada e os blocos seguintes são reencadeados para não sobrepor. Se a atração fechar no dia escolhido, o conflito aparece antes de qualquer alteração.">' +
                    '<option value="">↷ Mover para…</option>';
                destinos.forEach(x => {
                    const a = IDX.atracao(bloco.atracaoId);
                    const fecha = a && a.fechado.indexOf(U.diaSemana(x.d.data)) >= 0;
                    h += '<option value="' + x.i + '">Dia ' + String(x.i + 1).padStart(2, '0') + ' · ' +
                        U.esc(U.dataExtenso(x.d.data)) + (fecha ? ' — fecha neste dia' : '') + '</option>';
                });
                h += '</select>';
            }
            const obrigatoria = (r.config.obrigatorias || []).indexOf(bloco.atracaoId) >= 0;
            h += '<button class="ed-btn ed-rm' + (obrigatoria ? ' is-obrig' : '') + '" data-ed="remover" data-dia="' + diaIdx + '" data-bloco="' + blocoIdx +
                '" aria-label="Remover ' + U.esc(bloco.titulo) + ' do dia ' + U.esc(U.dataExtenso(dia.data)) + '" ' +
                'title="' + (obrigatoria
                    ? 'ATENÇÃO: atração marcada por você como “não quero perder”. Removê-la gera conflito grave e desconta doze pontos da nota global. A remoção só ocorre após confirmação explícita.'
                    : 'Retira a atração do dia, junto com o deslocamento que existia apenas para alcançá-la. Recalcula ingressos, custos, plano B e pontuação. Os horários dos blocos restantes permanecem onde estão; o tempo liberado fica visível como intervalo.') + '">✕ Remover</button>';
        }
        h += '</div>';
        return h;
    },

    /* Barra de ações do dia inteiro: acrescentar atração e reencadear. Vive abaixo do
       cronograma do dia porque age sobre a estrutura, e não sobre um bloco isolado. */
    acoesDia(r, diaIdx, dia) {
        const cfg = r.config;
        const cap = dia.capacidade || 0;
        const oc = Edicao.ocupacao(dia);
        const vago = Edicao.intervalo(dia);
        const cands = Edicao.candidatasDoDia(r, dia);
        const ritmo = (CONFIG.ritmos[cfg.ritmo] || {}).rotulo || cfg.ritmo;

        let h = '<div class="ed-dia-acoes">';
        h += '<span class="ed-cap' + (cap && oc > cap ? ' is-cheio' : '') + '">' +
            R.tt('ocupação ' + U.dur(oc) + ' / ' + U.dur(cap),
                'Minutos já comprometidos com visitas neste dia, contra a capacidade que o ritmo <b>' + U.esc(ritmo) +
                '</b> reserva. Fórmula da capacidade: (janela do ritmo − refeições) × taxa de ocupação, com fatores de 35% no dia de chegada e 30% no de partida. ' +
                'Acrescentar atração além dessa capacidade é permitido, mas <b>gera conflito declarado</b>: o sistema nomeia a capacidade e o excedente e deixa a decisão com você.') +
            '</span>';

        if (cands.length) {
            h += '<select class="ed-sel ed-add" data-ed="adicionar" data-dia="' + diaIdx + '" ' +
                'aria-label="Acrescentar atração ao dia ' + U.esc(U.dataExtenso(dia.data)) + '" ' +
                'title="Lista apenas as atrações cadastradas de ' + U.esc(dia.cidadeNome) + ' que ainda não estão em nenhum dia do cronograma e que são compatíveis com a idade do integrante mais novo do grupo. ' +
                'A ordem é a da pontuação já calculada pelo motor — a mesma fórmula que decidiu a seleção original. Cada opção mostra duração, tarifa cadastrada (nunca estimada) e se a atração fecha justamente neste dia. ' +
                'A inserção ocorre antes do jantar e da logística de fim de dia; os blocos seguintes são reencadeados para não sobrepor, e ingressos, custos, plano B e nota são recalculados.">' +
                '<option value="">＋ Acrescentar atração…</option>';
            cands.forEach(c => {
                h += '<option value="' + U.esc(c.a.id) + '">' + U.esc(c.a.nome) + ' · ' + U.dur(c.a.dur) +
                    ' · ' + U.esc(Edicao.tarifaResumo(c.a)) + ' · pontuação ' + c.score +
                    (c.fecha ? ' — FECHA NESTE DIA' : '') + '</option>';
            });
            h += '</select>';
        } else {
            h += '<span class="ed-mini">Todas as atrações cadastradas de ' + U.esc(dia.cidadeNome) +
                ' compatíveis com o grupo já estão no cronograma.</span>';
        }

        h += '<button class="ed-btn ed-reenc" data-ed="reencadear" data-dia="' + diaIdx + '"' + (vago ? '' : ' disabled') +
            ' aria-label="Reencadear o dia ' + U.esc(U.dataExtenso(dia.data)) + '" ' +
            'title="' + (vago
                ? 'Fecha ' + U.dur(vago) + ' de intervalo aberto neste dia, puxando cada bloco para começar ao fim do anterior e preservando as durações. Jantar e logística de fim de dia NÃO são antecipados: âncoras só andam para a frente. A ação é sempre explícita — o sistema jamais reencadeia por conta própria depois de uma remoção.'
                : 'Não há intervalo a fechar: os blocos deste dia já começam ao fim do anterior.') + '">⇥ Reencadear o dia' +
            (vago ? ' (' + U.dur(vago) + ')' : '') + '</button>';
        h += '</div>';
        return h;
    },

    /* Coluna de reinserção do painel de descartadas. Uma atração retirada — pelo motor
       ou por você — pode voltar; o que não volta é a que a idade mínima barrou. */
    seletorReinserir(r, a) {
        if (!a) return '<span class="ed-mini">—</span>';
        if (Edicao.agendadas(r).has(a.id)) return '<span class="ed-mini">já reinserida</span>';
        const menor = Edicao.menorIdade(r.config);
        if (a.idadeMin > menor) return '<span class="ed-mini">idade mínima ' + a.idadeMin + ' anos — restrição rígida</span>';
        const dias = r.dias.map((d, i) => ({ d: d, i: i })).filter(x => x.d.cidadeId === a.cidadeId);
        if (!dias.length) return '<span class="ed-mini">sem dia nesta cidade</span>';
        const obrig = (r.config.obrigatorias || []).indexOf(a.id) >= 0;
        let h = '<select class="ed-sel ed-reins" data-ed="adicionar" data-atracao="' + U.esc(a.id) + '" ' +
            'aria-label="Reinserir ' + U.esc(a.nome) + ' no cronograma" ' +
            'title="Devolve ' + U.esc(a.nome) + ' (' + U.dur(a.dur) + ' · ' + U.esc(Edicao.tarifaResumo(a)) + ') ao dia escolhido. ' +
            (obrig ? 'Esta atração foi marcada por você como “não quero perder”: a volta extingue o conflito grave e devolve os doze pontos descontados da nota global. ' : '') +
            'Excedida a capacidade do ritmo, o conflito é declarado e a decisão continua sua.">' +
            '<option value="">↩ Reinserir em…</option>';
        dias.forEach(x => {
            const fecha = a.fechado.indexOf(U.diaSemana(x.d.data)) >= 0;
            h += '<option value="' + x.i + '">Dia ' + String(x.i + 1).padStart(2, '0') + ' · ' +
                U.esc(U.dataExtenso(x.d.data)) + (fecha ? ' — fecha neste dia' : '') + '</option>';
        });
        return h + '</select>';
    },

    seletorHotel(r, hp) {
        if (hp.semOpcoes || (hp.opcoes || []).length < 2) return '';
        const atual = Edicao.hotelEscolhido(hp);
        let h = '<div class="ed-hotel"><label class="ed-mini" for="edh_' + U.esc(hp.cidadeId) + '">Base escolhida para ' + U.esc(hp.cidadeNome) + '</label>' +
            '<select id="edh_' + U.esc(hp.cidadeId) + '" class="ed-sel" data-ed="hotel" data-cidade="' + U.esc(hp.cidadeId) + '" ' +
            'title="Troca a base da cidade entre as propriedades cadastradas na base interna. A escolha é registrada no histórico de decisões. A linha de hospedagem do orçamento NÃO muda: sem provedor de tarifas, ela continua sendo a faixa estimada da classe ' + U.esc(hp.classe) + ' por quarto/noite.">';
        hp.opcoes.forEach(o => {
            h += '<option value="' + U.esc(o.id) + '"' + (o.id === atual ? ' selected' : '') + '>' + U.esc(o.nome) + ' — ' + U.esc(o.categoria) + '</option>';
        });
        h += '</select></div>';
        return h;
    },

    /* Recomposição integral a partir do objeto — mesma via da geração, o que mantém
       a renderização pura e impede que nós antigos sobrevivam a uma edição. */
    recompor(r, foco) {
        const main = document.getElementById('mainContent');
        if (!main) return;
        Array.prototype.slice.call(main.querySelectorAll('section')).forEach(s => { if (s.id !== 'sec-form') s.remove(); });
        document.querySelectorAll('.toc a[data-gerado]').forEach(a => a.remove());
        renderRoteiro(r);
        appState.roteiroAtual = r;
        const alvo = document.getElementById(foco || 'sec-cronograma');
        if (alvo) alvo.scrollIntoView({ behavior: 'auto', inline: 'start', block: 'nearest' });
    },

    /* Delegação: um único par de ouvintes para todos os controles, instalado uma vez
       e independente de quantas vezes o roteiro seja recomposto. */
    tratar(el) {
        const r = appState.roteiroAtual;
        if (!r) return;
        const acao = el.getAttribute('data-ed');
        let foco = 'sec-cronograma', op = null;

        // Transferência: exportar não altera o roteiro; importar o substitui por
        // completo e recompõe sozinho, por isso ambos retornam antes de recompor aqui.
        if (acao === 'exportar') { Transferencia.exportar(r); Edicao.recompor(r, foco); return; }
        if (acao === 'importar') {
            // aplicarArquivo() já recompõe a página quando o arquivo é aceito. A
            // recomposição aqui serve ao caso oposto: sem ela, a recusa ficaria muda,
            // porque o roteiro exibido continua sendo o mesmo e nada dispararia a
            // reescrita do console onde o motivo da recusa é declarado.
            Transferencia.abrirSeletor(function () {
                if (Transferencia.erro) Edicao.recompor(appState.roteiroAtual, 'sec-cronograma');
            });
            return;
        }
        if (acao === 'fecharRelatorio') { Transferencia.relatorio = null; Transferencia.erro = null; Edicao.recompor(r, foco); return; }

        if (acao === 'desfazer') { Edicao.desfazer(r); Edicao.recompor(r, foco); return; }
        if (acao === 'refazer') { Edicao.refazer(r); Edicao.recompor(r, foco); return; }
        if (acao === 'cancelar') { Edicao.cancelarPendente(); Edicao.recompor(r, foco); return; }
        if (acao === 'confirmar') {
            const p = Edicao.pendente;
            if (p && p.op.tipo === 'hotel') foco = 'sec-hospedagem';
            Edicao.confirmarPendente(r);
            Edicao.recompor(r, foco);
            return;
        }
        if (acao === 'adicionar') {
            if (!el.value) return;
            // Dois pontos de origem, uma só operação: na barra do dia o dia é fixo e a
            // atração vem do select; no painel de descartadas é o inverso.
            const idAtr = el.getAttribute('data-atracao');
            if (idAtr) { op = { tipo: 'adicionar', dia: +el.value, atracaoId: idAtr }; foco = 'sec-atracoes'; }
            else op = { tipo: 'adicionar', dia: +el.getAttribute('data-dia'), atracaoId: el.value };
        }
        if (acao === 'reencadear') op = { tipo: 'reencadear', dia: +el.getAttribute('data-dia') };
        if (acao === 'remover') op = { tipo: 'remover', dia: +el.getAttribute('data-dia'), bloco: +el.getAttribute('data-bloco') };
        if (acao === 'mover') {
            if (!el.value) return;
            op = { tipo: 'mover', dia: +el.getAttribute('data-dia'), bloco: +el.getAttribute('data-bloco'), destino: +el.value };
        }
        if (acao === 'hora') op = { tipo: 'horario', dia: +el.getAttribute('data-dia'), bloco: +el.getAttribute('data-bloco'), valor: el.value };
        if (acao === 'hotel') { op = { tipo: 'hotel', cidadeId: el.getAttribute('data-cidade'), hotelId: el.value }; foco = 'sec-hospedagem'; }
        if (acao === 'trecho') { op = { tipo: 'trecho', idx: +el.getAttribute('data-idx'), campo: el.getAttribute('data-tcampo'), valor: el.value }; foco = 'sec-voos'; }
        if (!op) return;

        const resultado = Edicao.aplicar(r, op);
        // Uma alteração suspensa por conflito só tem a decisão (Manter mesmo assim /
        // Cancelar) exibida no console de edição, dentro do Cronograma — nunca na seção
        // de origem do clique. Sem isto, reinserir uma atração descartada a partir do
        // painel de Atrações parecia não fazer nada: o conflito ficava suspenso fora de
        // vista, em outra seção, enquanto o foco devolvia o usuário para onde já estava.
        if (resultado && resultado.status === 'conflito') foco = 'sec-cronograma';
        Edicao.recompor(r, foco);
    },

    instalar() {
        document.addEventListener('click', function (ev) {
            const el = ev.target && ev.target.closest ? ev.target.closest('button[data-ed]') : null;
            if (!el || el.disabled) return;
            ev.preventDefault();
            Edicao.tratar(el);
        });
        document.addEventListener('change', function (ev) {
            const el = ev.target && ev.target.closest ? ev.target.closest('select[data-ed], input[data-ed]') : null;
            if (!el) return;
            Edicao.tratar(el);
        });
        // "# Ir para o campo", nos cartões de Conflitos — instalado aqui porque, como os
        // demais controles do roteiro renderizado, precisa sobreviver a recomposições.
        document.addEventListener('click', function (ev) {
            const el = ev.target && ev.target.closest ? ev.target.closest('button[data-campo-ir]') : null;
            if (!el) return;
            ev.preventDefault();
            App.irParaCampo(el.getAttribute('data-campo-ir'));
        });
    }
};
Edicao.instalar();

/* =====================================================================================
   [23] TRANSFERÊNCIA — EXPORTAR E IMPORTAR O ROTEIRO (§68, §69)

   A disciplina de proveniência só tem valor se a informação puder sair de dentro do
   sistema. Até aqui o roteiro vivia exclusivamente em memória: recarregar a página
   desfazia horas de edição. O arquivo JSON resolve isso e devolve ao viajante algo que
   ele guarda, versiona e compartilha.

   Quatro princípios governam este módulo:

   1. O ARQUIVO CARREGA A ESCOLHA, A BASE CARREGA O DADO. Do arquivo vem o que o
      viajante decidiu — cidades, dias, horários, blocos, hospedagem escolhida,
      histórico. Tarifa, duração, endereço, idade mínima e dia de fechamento vêm
      sempre da base atual, nunca da cópia gravada. Um arquivo antigo não pode
      ressuscitar um preço que mudou.
   2. NADA É ACEITO SEM CONFERÊNCIA. Cada registro exportado leva impressão digital
      dos campos que importam. Na volta, a impressão é recalculada contra a base
      corrente: o que divergir é DECLARADO, item a item, nunca absorvido em silêncio.
      Identificador que não existe mais vira conflito, não exceção capturada.
   3. O RECÁLCULO É INTEGRAL. Ingressos, custos, plano B, validação e pontuação são
      refeitos na importação; a nota gravada no arquivo serve apenas de conferência, e
      a diferença entre ela e a recalculada é informada. Clima e câmbio são
      reconsultados: apresentar previsão de meses atrás como previsão violaria o §33.
   4. A REPARAÇÃO AUTOMÁTICA NÃO ATUA. Como na edição manual, corrigir por conta
      própria o que o viajante planejou seria decidir por ele.
   ===================================================================================== */
const Transferencia = {
    FORMATO: 'gerador-roteiros/roteiro',
    FORMATO_VERSAO: 1,
    relatorio: null,        // último resultado de importação, exibido no console
    erro: null,

    /* ---------------------------------------------------- IMPRESSÃO DIGITAL (FNV-1a)
       Não é criptografia: é detecção de mudança. Basta ser estável, curta e sensível a
       qualquer alteração dos campos que o roteiro consome. */
    digital(o) {
        const s = JSON.stringify(o === undefined ? null : o);
        let h = 0x811c9dc5;
        for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = (h * 0x01000193) >>> 0; }
        return h.toString(16).padStart(8, '0');
    },
    /* Só entram os campos de que o cronograma e o orçamento dependem. Uma correção de
       texto descritivo na curadoria não deve alarmar quem importa. */
    perfilAtracao(a) {
        return a ? { n: a.nome, d: a.dur, i: a.idadeMin, c: a.custo ? a.custo.valor : null, f: (a.fechado || []).join(',') } : null;
    },
    perfilHospedagem(o) { return o ? { n: o.nome, c: o.categoria, z: o.zona || null } : null; },
    perfilTrecho(t) { return t ? { m: t.modo, d: t.duracao, c: t.custoPP || null } : null; },

    impressaoBase(r) {
        const at = {}, ho = {}, tr = {};
        (r.dias || []).forEach(d => (d.blocos || []).forEach(b => {
            if (b.tipo !== 'atracao' || !b.atracaoId) return;
            at[b.atracaoId] = Transferencia.digital(Transferencia.perfilAtracao(IDX.atracao(b.atracaoId)));
        }));
        (r.hospedagens || []).forEach(hp => (hp.opcoes || []).forEach(o => {
            ho[o.id] = Transferencia.digital(Transferencia.perfilHospedagem(o));
        }));
        (r.deslocamentos || []).forEach(t => {
            tr[t.de + '>' + t.para] = Transferencia.digital(Transferencia.perfilTrecho(IDX.trecho(t.de, t.para)));
        });
        return { atracoes: at, hospedagens: ho, trechos: tr };
    },

    /* -------------------------------------------------------------- EMPACOTAMENTO */
    rotulo(r) {
        return r.cidades.map(c => c.dados.nome).join(' + ') + ' — ' + r.dias.length + ' dias — ' +
            ((CONFIG.orcamento[r.config.orcamento] || {}).rotulo || r.config.orcamento);
    },

    /* Apenas os destinos declarados que este roteiro usa. Exportar a sobrecamada
       inteira levaria para o arquivo cidades de outros roteiros da mesma sessão. */
    declaradosUsados(r) {
        const ids = r.cidades.map(c => c.id);
        const cidades = DB.cidadesDeclaradas.filter(c => ids.indexOf(c.id) >= 0);
        const paises = {};
        cidades.forEach(c => { if (DB.paisesDeclarados[c.paisId]) paises[c.paisId] = DB.paisesDeclarados[c.paisId]; });
        return JSON.parse(JSON.stringify({ cidades: cidades, paises: paises }));
    },

    empacotar(r) {
        const semDados = c => {
            const o = Object.assign({}, c);
            delete o.dados;
            o.nome = c.dados ? c.dados.nome : (c.nome || c.id);
            o.paisId = c.dados ? c.dados.paisId : (c.paisId || null);
            return o;
        };
        const semOpcoes = hp => {
            const o = Object.assign({}, hp);
            delete o.opcoes;
            o.escolhaId = Edicao.hotelEscolhido(hp);
            return o;
        };
        return JSON.parse(JSON.stringify({
            formato: Transferencia.FORMATO,
            formatoVersao: Transferencia.FORMATO_VERSAO,
            motorVersao: CONFIG.versao,
            geradoEm: new Date().toISOString(),
            rotulo: Transferencia.rotulo(r),
            aviso: 'Arquivo de roteiro do Gerador de Roteiros. As escolhas do viajante são autoritativas; ' +
                   'tarifas, durações e endereços são reconferidos contra a base do sistema na importação.',
            config: r.config,
            destinosDeclarados: Transferencia.declaradosUsados(r),
            impressaoBase: Transferencia.impressaoBase(r),
            roteiro: {
                id: r.id, criadoEm: r.criadoEm, atualizadoEm: r.atualizadoEm,
                cidades: r.cidades.map(semDados),
                dias: r.dias,
                deslocamentos: r.deslocamentos,
                hospedagens: (r.hospedagens || []).map(semOpcoes),
                descartadas: (r.descartadas || []).map(d => ({
                    atracaoId: d.atracao ? d.atracao.id : null,
                    nome: d.atracao ? d.atracao.nome : null,
                    cidade: d.cidade, score: d.score, motivo: d.motivo
                })),
                voos: r.voos, clima: r.clima, cambio: r.cambio,
                // Derivados: gravados apenas para conferência. A importação os recalcula.
                conferencia: {
                    notaGlobal: (r.pontuacao || {}).global != null ? r.pontuacao.global : null,
                    custoTerrestre: (r.custos || {}).totalTerrestre || null,
                    ingressosSoma: (r.ingressos || {}).somaConhecida != null ? r.ingressos.somaConhecida : null,
                    atracoes: (r.atracoes || []).length
                },
                avisos: r.avisos, conflitos: r.conflitos, decisoes: r.decisoes,
                historico: r.historico || [], fontes: r.fontes
            }
        }));
    },

    nomeArquivo(r) {
        const base = U.slug(r.cidades.map(c => c.dados.nome).join('_')) || 'roteiro';
        return 'roteiro_' + base + '_' + r.config.dataInicio + '_' + r.dias.length + 'dias.json';
    },

    /* Download no navegador. Fora dele — no arnês — o empacotamento continua
       disponível e testável sem tocar em Blob nem em URL. */
    exportar(r) {
        Transferencia.erro = null;
        try {
            const texto = JSON.stringify(Transferencia.empacotar(r), null, 2);
            const blob = new Blob([texto], { type: 'application/json;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = Transferencia.nomeArquivo(r);
            document.body.appendChild(a); a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
            return { ok: true, nome: a.download, bytes: texto.length };
        } catch (e) {
            Transferencia.erro = 'Não foi possível gravar o arquivo: ' + e.message;
            return { ok: false, msg: e.message };
        }
    },

    /* ---------------------------------------------------------------- VALIDAÇÃO
       Arquivo é entrada externa: nada nele é presumido. */
    validarPacote(p) {
        const erros = [];
        if (!p || typeof p !== 'object' || Array.isArray(p)) return { ok: false, erros: ['O arquivo não contém um objeto JSON de roteiro.'] };
        if (p.formato !== Transferencia.FORMATO) {
            erros.push('Formato não reconhecido: esperado “' + Transferencia.FORMATO + '”, encontrado “' + (p.formato || 'ausente') + '”.');
        }
        const v = Number(p.formatoVersao);
        if (!v || v < 1) erros.push('Versão do formato ausente ou inválida.');
        else if (v > Transferencia.FORMATO_VERSAO) {
            erros.push('O arquivo foi gravado no formato v' + v + ', posterior ao que este motor sabe ler (v' +
                Transferencia.FORMATO_VERSAO + '). Ler um formato futuro adivinhando o significado dos campos seria inventar dado.');
        }
        const cfg = p.config;
        if (!cfg || typeof cfg !== 'object') erros.push('Configuração da viagem ausente no arquivo.');
        else {
            if (!cfg.dataInicio || !cfg.dataFim) erros.push('Datas da viagem ausentes na configuração do arquivo.');
            if (!cfg.viajantes || typeof cfg.viajantes !== 'object') erros.push('Composição do grupo ausente na configuração do arquivo.');
            if (!Array.isArray(cfg.cidades) || !cfg.cidades.length) erros.push('Nenhuma cidade na configuração do arquivo.');
        }
        const r = p.roteiro;
        if (!r || typeof r !== 'object') erros.push('Objeto do roteiro ausente no arquivo.');
        else {
            if (!Array.isArray(r.cidades) || !r.cidades.length) erros.push('O roteiro do arquivo não tem cidades.');
            if (!Array.isArray(r.dias) || !r.dias.length) erros.push('O roteiro do arquivo não tem dias.');
            else {
                const mal = r.dias.filter(d => !d || !d.data || !Array.isArray(d.blocos) ||
                    d.blocos.some(b => !b || typeof b.ini !== 'number' || typeof b.fim !== 'number' || b.fim < b.ini));
                if (mal.length) erros.push(mal.length + ' dia(s) do arquivo têm blocos sem data ou com horários inválidos.');
            }
        }
        return { ok: !erros.length, erros: erros };
    },

    /* ---------------------------------------------------------------- IMPORTAÇÃO */
    async importar(p) {
        const val = Transferencia.validarPacote(p);
        if (!val.ok) return { ok: false, erros: val.erros, divergencias: [] };

        const div = [];
        const anota = (nivel, titulo, detalhe) => div.push({ nivel: nivel, titulo: titulo, detalhe: detalhe });
        const fonte = p.roteiro;
        const cfg = JSON.parse(JSON.stringify(p.config));

        /* 1. Sobrecamada declarada — aditiva, ao lado da base curada e jamais dentro
              dela. Um id já existente na base curada nunca é sobrescrito pelo arquivo. */
        const decl = p.destinosDeclarados || {};
        Object.keys(decl.paises || {}).forEach(k => {
            if (!DB.paises[k] && !DB.paisesDeclarados[k]) {
                DB.paisesDeclarados[k] = Object.assign({}, decl.paises[k], { declarado: true });
            }
        });
        (decl.cidades || []).forEach(c => {
            if (IDX.cidade(c.id)) return;
            DB.cidadesDeclaradas.push(Object.assign({}, c, {
                declarada: true, curada: false,
                fonte: (c.fonte || 'Declarado no formulário') + ' · restaurado de arquivo importado'
            }));
            anota('nota', 'Destino declarado restaurado: ' + c.nome,
                'A cidade voltou à sobrecamada de destinos declarados, com as mesmas limitações de origem: sem atrações, hospedagem nominal, trechos ou plano B cadastrados.');
        });

        /* 2. Cidades: identidade vem do arquivo, conteúdo vem sempre da base atual. */
        const rota = [];
        (fonte.cidades || []).forEach(c => {
            let dados = IDX.cidade(c.id);
            if (!dados) {
                const paisId = c.paisId || 'decl_importado';
                if (!DB.paises[paisId] && !DB.paisesDeclarados[paisId]) {
                    DB.paisesDeclarados[paisId] = { id: paisId, nome: 'País não cadastrado', bandeira: '🏳️', moeda: null, idioma: null, declarado: true };
                }
                dados = {
                    id: c.id, paisId: paisId, nome: c.nome || c.id, glifo: '✎',
                    declarada: true, curada: false, lat: null, lon: null,
                    noitesMin: 1, noitesIdeal: Math.max(1, c.noites || 1), noitesMax: 30, perfil: {},
                    transporteUrbano: null, aeroportos: [], estacoes: [], bairrosBase: null, resumo: null,
                    fonte: 'Reconstruída do arquivo importado — sem correspondência na base atual'
                };
                DB.cidadesDeclaradas.push(dados);
                anota('grave', 'Cidade ausente da base atual: ' + dados.nome,
                    'O identificador “' + c.id + '” não existe mais na curadoria. A cidade foi mantida na rota como destino declarado, com noites e lugar preservados, mas sem atrações, hospedagem nominal, trechos ou clima cadastrados. Nada foi inventado para preencher a lacuna.');
            }
            rota.push(Object.assign({}, c, { dados: dados }));
        });

        /* 3. Objeto novo. Id novo de propósito: as pilhas de desfazer e refazer são
              escopadas ao id, e herdar o antigo faria um histórico de outra sessão
              parecer reversível quando os instantâneos não vieram no arquivo (§7). */
        const r = novoRoteiro(cfg);
        r.criadoEm = fonte.criadoEm || r.criadoEm;
        r.importadoDe = {
            id: fonte.id || null, geradoEm: p.geradoEm || null, motorVersao: p.motorVersao || null,
            formatoVersao: p.formatoVersao, rotulo: p.rotulo || null
        };
        r.cidades = rota;
        r.dias = JSON.parse(JSON.stringify(fonte.dias || []));
        r.avisos = (fonte.avisos || []).slice();
        r.conflitos = (fonte.conflitos || []).map(c => Object.assign({}, c));
        r.decisoes = (fonte.decisoes || []).map(d => Object.assign({}, d));
        r.historico = (fonte.historico || []).map(h => Object.assign({}, h));
        r.fontes = (fonte.fontes || []).slice();

        /* 4. Blocos: cada atração é reconferida contra a base corrente. */
        const imprAtr = (p.impressaoBase || {}).atracoes || {};
        r.dias.forEach(d => (d.blocos || []).forEach(b => {
            if (b.tipo !== 'atracao' || !b.atracaoId) return;
            const a = IDX.atracao(b.atracaoId);
            if (!a) {
                b.semBase = true;
                anota('grave', 'Atração fora da curadoria atual: ' + b.titulo,
                    'O identificador “' + b.atracaoId + '” não existe mais na base. O bloco foi preservado no cronograma porque você o planejou, mas sem registro não há tarifa, horário de funcionamento nem justificativa a recalcular: ele não entra na conta de ingressos e não é validado contra dia de fechamento.');
                return;
            }
            const agora = Transferencia.digital(Transferencia.perfilAtracao(a));
            if (imprAtr[b.atracaoId] && imprAtr[b.atracaoId] !== agora) {
                anota('atencao', 'Registro alterado desde a exportação: ' + a.nome,
                    'Duração, tarifa, idade mínima ou dias de fechamento mudaram na base curada. Prevalece o registro atual — o arquivo não ressuscita valores antigos. Ingressos e validação já refletem o dado novo.');
            }
        }));

        /* 5. Descartadas: o painel de reinserção precisa do registro vivo. */
        r.descartadas = [];
        (fonte.descartadas || []).forEach(d => {
            const a = d.atracaoId ? IDX.atracao(d.atracaoId) : null;
            if (!a) {
                if (d.atracaoId) {
                    anota('nota', 'Descartada não reconhecida: ' + (d.nome || d.atracaoId),
                        'A atração constava da lista de descartadas do arquivo e não existe mais na base. Ela deixa de aparecer no painel de reinserção, em vez de ser exibida sem registro.');
                }
                return;
            }
            r.descartadas.push({ atracao: a, cidade: d.cidade, score: d.score, motivo: d.motivo });
        });

        /* 6. Recomposição a partir da base. O rascunho recolhe as decisões que estas
              funções registram, para que a importação não duplique o que o arquivo já
              traz da geração original. */
        const rascunho = { decisoes: [], avisos: [], conflitos: [] };
        r.voos = selecionarVoos(cfg, rota, rascunho);
        r.hospedagens = selecionarHospedagens(cfg, rota, rascunho);
        (fonte.hospedagens || []).forEach(h => {
            if (!h.escolhaId) return;
            const hp = r.hospedagens.find(x => x.cidadeId === h.cidadeId);
            if (!hp) return;
            if ((hp.opcoes || []).some(o => o.id === h.escolhaId)) hp.escolhaId = h.escolhaId;
            else {
                anota('atencao', 'Hospedagem escolhida não está mais cadastrada: ' + (hp.cidadeNome || h.cidadeId),
                    'A propriedade “' + h.escolhaId + '” saiu da curadoria. A base da cidade volta à primeira opção cadastrada, e a troca continua disponível no módulo de hospedagem. Nenhum hotel foi inventado para manter a escolha.');
            }
        });
        r.alimentacao = rota.map(c => DB.alimentacao.find(a => a.cidadeId === c.id)).filter(Boolean);
        r.representacoes = selecionarRepresentacoesBrasileiras(cfg, rota, rascunho);

        /* 7. Trechos: reavaliados contra a base, inclusive a compatibilidade com a
              preferência de transporte — o modo pode ter mudado desde a exportação. */
        const imprTre = (p.impressaoBase || {}).trechos || {};
        r.deslocamentos = (fonte.deslocamentos || []).map(t => {
            const atual = IDX.trecho(t.de, t.para);
            if (!atual) {
                if (t.modo !== 'indisponivel') {
                    anota('atencao', 'Trecho fora da base atual: ' + t.deNome + ' → ' + t.paraNome,
                        'O trecho não está mais cadastrado. Duração e custo passam a constar como não disponíveis, em vez de manter os valores do arquivo.');
                }
                return {
                    de: t.de, para: t.para, deNome: t.deNome, paraNome: t.paraNome,
                    modo: 'indisponivel', icone: '❓', duracao: null, custoPP: null, compativel: false,
                    obs: 'Trecho não cadastrado na base atual. O sistema não inventa duração nem preço.'
                };
            }
            const chave = t.de + '>' + t.para;
            if (imprTre[chave] && imprTre[chave] !== Transferencia.digital(Transferencia.perfilTrecho(atual))) {
                anota('atencao', 'Trecho alterado desde a exportação: ' + t.deNome + ' → ' + t.paraNome,
                    'Modo, duração ou custo do trecho mudaram na base. O roteiro passa a exibir o registro atual, e o custo de deslocamento entra no orçamento recalculado com o valor novo.');
            }
            return Object.assign({}, atual, {
                deNome: t.deNome, paraNome: t.paraNome, compativel: trechoCompativel(cfg, atual)
            });
        });

        /* 8. Dados externos: reconsultados, nunca restaurados. Previsão gravada há
              meses continuaria dizendo “previsão” — exatamente o que o §33 proíbe. */
        try {
            r.clima = await avaliarClima(cfg, rota, r);
        } catch (e) {
            r.clima = [];
            anota('atencao', 'Clima não pôde ser reconsultado',
                'O serviço meteorológico não respondeu durante a importação. O sistema prefere declarar a ausência a reapresentar a previsão gravada no arquivo como se fosse atual.');
        }
        try { r.cambio = await Providers.ExchangeRateProvider.taxa('EUR', 'BRL'); }
        catch (e) { r.cambio = naoDisponivel('Serviço de câmbio indisponível no momento'); }

        /* 9. Recálculo integral — sem reparação automática, como na edição manual. */
        Edicao.recalcular(r, 'roteiro importado — recálculo integral, sem reparação automática');

        /* 10. Conferência contra o que o arquivo declarava. */
        const conf = fonte.conferencia || {};
        if (conf.notaGlobal != null && conf.notaGlobal !== r.pontuacao.global) {
            anota('atencao', 'A nota recalculada difere da gravada no arquivo',
                'O arquivo trazia ' + conf.notaGlobal + '/100 e o recálculo devolve ' + r.pontuacao.global +
                '/100. A diferença vem da base ou dos serviços externos terem mudado desde a exportação — a nota exibida é sempre a recalculada.');
        }
        if (conf.custoTerrestre && r.custos.totalTerrestre &&
            Math.round(conf.custoTerrestre[1]) !== Math.round(r.custos.totalTerrestre[1])) {
            anota('atencao', 'A estimativa de custo mudou desde a exportação',
                'Teto terrestre no arquivo: ' + U.faixaEur(conf.custoTerrestre[0], conf.custoTerrestre[1]) +
                '. Recalculado agora: ' + U.faixaEur(r.custos.totalTerrestre[0], r.custos.totalTerrestre[1]) + '.');
        }

        /* 11. Divergências graves viram conflito declarado, para que apareçam no módulo
               de conflitos e não apenas no console de edição. */
        div.filter(x => x.nivel === 'grave').forEach(x => {
            r.conflitos.push({
                grave: true, titulo: 'Importação — ' + x.titulo, problema: x.detalhe,
                impacto: 'O roteiro foi mantido como você o planejou, mas esta parte dele não tem correspondência na base atual e não pode ser recalculada.',
                opcoes: ['Regenerar o roteiro a partir do formulário, com a base atual', 'Editar manualmente o trecho afetado', 'Manter como está, ciente da lacuna']
            });
        });

        r.avisos.push('Roteiro importado de arquivo gravado em ' +
            (p.geradoEm ? new Date(p.geradoEm).toLocaleString('pt-BR') : 'data não informada') +
            ' pelo motor v' + (p.motorVersao || '?') + '. Ingressos, custos, plano B, validação e pontuação foram recalculados com a base atual; clima e câmbio foram reconsultados.' +
            (div.length ? ' ' + div.length + ' divergência(s) declarada(s).' : ' Nenhuma divergência encontrada.'));

        registrar(r, 'Importação de roteiro',
            'Roteiro reidratado de arquivo, com recálculo integral',
            [['Formato do arquivo', 'v' + p.formatoVersao + ' · motor de origem v' + (p.motorVersao || '?')],
             ['O que veio do arquivo', 'Cidades, dias, blocos, horários, hospedagem escolhida, histórico e decisões da geração original'],
             ['O que veio da base atual', 'Tarifas, durações, endereços, dias de fechamento, trechos, representação consular e hospedagens cadastradas'],
             ['O que foi reconsultado', 'Previsão climática e taxa de câmbio — dado externo não se restaura de arquivo'],
             ['Divergências declaradas', String(div.length)]]);

        r.historico.push({
            em: new Date().toISOString(),
            texto: 'Roteiro importado de arquivo' + (p.rotulo ? ' — ' + p.rotulo : ''),
            forcado: false,
            conflitos: div.filter(x => x.nivel === 'grave').map(x => x.titulo),
            nota: r.pontuacao.global
        });

        return { ok: true, roteiro: r, divergencias: div, erros: [] };
    },

    /* ------------------------------------------------------------------ INTERFACE */
    async aplicarArquivo(texto) {
        Transferencia.erro = null;
        Transferencia.relatorio = null;
        let pacote;
        try { pacote = JSON.parse(texto); }
        catch (e) {
            Transferencia.erro = 'O arquivo não é um JSON válido: ' + e.message;
            return { ok: false };
        }
        const res = await Transferencia.importar(pacote);
        if (!res.ok) {
            Transferencia.erro = 'Arquivo recusado. ' + res.erros.join(' ');
            return res;
        }
        const r = res.roteiro;
        limparRoteiroAnterior();
        appState.roteiroConfig = r.config;
        appState.roteiroAtual = r;
        Transferencia.relatorio = {
            em: new Date().toISOString(), rotulo: pacote.rotulo || Transferencia.rotulo(r),
            geradoEm: pacote.geradoEm || null, motorVersao: pacote.motorVersao || null,
            divergencias: res.divergencias, nota: r.pontuacao.global
        };
        // O formulário passa a espelhar o que foi importado: sem isso, Regenerar
        // reconstruiria em cima de respostas antigas, que é alterar escolha em silêncio.
        Form.carregarConfig(r.config);
        Form.montar();
        renderRoteiro(r);
        Persist.salvarConfig(r.config);
        const alvo = document.getElementById('sec-cronograma');
        if (alvo) alvo.scrollIntoView({ behavior: 'smooth', inline: 'start', block: 'nearest' });
        return res;
    },

    abrirSeletor(onFim) {
        const inp = document.createElement('input');
        inp.type = 'file';
        inp.accept = 'application/json,.json';
        inp.style.position = 'fixed';
        inp.style.left = '-9999px';
        inp.addEventListener('change', function () {
            const f = inp.files && inp.files[0];
            if (!f) { inp.remove(); return; }
            const fr = new FileReader();
            fr.onload = async function () {
                await Transferencia.aplicarArquivo(String(fr.result));
                inp.remove();
                if (typeof onFim === 'function') onFim();
            };
            fr.onerror = function () {
                Transferencia.erro = 'Não foi possível ler o arquivo selecionado.';
                inp.remove();
                if (typeof onFim === 'function') onFim();
            };
            fr.readAsText(f);
        });
        document.body.appendChild(inp);
        inp.click();
    },

    /* Relatório de importação, exibido no console de edição até ser dispensado. */
    painel() {
        let h = '';
        if (Transferencia.erro) {
            h += '<div class="tr-alerta"><b>Importação não realizada.</b> ' + U.esc(Transferencia.erro) +
                ' <span class="ed-sub">O roteiro exibido não foi alterado.</span></div>';
        }
        const rel = Transferencia.relatorio;
        if (!rel) return h;
        const graves = rel.divergencias.filter(d => d.nivel === 'grave').length;
        const atencao = rel.divergencias.filter(d => d.nivel === 'atencao').length;
        h += '<div class="tr-rel' + (graves ? ' is-grave' : '') + '">';
        h += '<h4>⇄ Roteiro importado — ' + U.esc(rel.rotulo || 'sem rótulo') + '</h4>';
        h += '<p class="ed-prop">Arquivo gravado em ' +
