            U.esc(rel.geradoEm ? new Date(rel.geradoEm).toLocaleString('pt-BR') : 'data não informada') +
            ' pelo motor v' + U.esc(rel.motorVersao || '?') + '. Nota após o recálculo: <b>' + rel.nota + '/100</b>.</p>';
        if (!rel.divergencias.length) {
            h += '<p class="ed-nota">Nenhuma divergência: todos os identificadores do arquivo existem na base atual e nenhum registro consumido pelo roteiro mudou desde a exportação.</p>';
        } else {
            h += '<p class="ed-nota">' + rel.divergencias.length + ' divergência(s) entre o arquivo e a base atual' +
                (graves ? ' — ' + graves + ' grave(s), também declarada(s) no módulo de conflitos' : '') +
                (atencao ? ' · ' + atencao + ' de atenção' : '') + '.</p><ul class="ed-lista">';
            rel.divergencias.forEach(d => {
                h += '<li><span class="tr-nivel n-' + d.nivel + '">' +
                    (d.nivel === 'grave' ? 'grave' : d.nivel === 'atencao' ? 'atenção' : 'nota') + '</span> <b>' +
                    U.esc(d.titulo) + '</b><br><span class="ed-sub">' + U.esc(d.detalhe) + '</span></li>';
            });
            h += '</ul>';
        }
        h += '<div class="ed-decisao"><button class="btn-ghost ed-btn" data-ed="fecharRelatorio" ' +
            'title="Oculta este relatório. As divergências graves permanecem no módulo de conflitos e o registro da importação permanece no histórico de decisões — dispensar o aviso não apaga o que ele informou.">Dispensar relatório</button></div>';
        h += '</div>';
        return h;
    }
};

/* =====================================================================================
   [23b] EXPORT HTML STANDALONE — roteiro completo para leitura offline no celular

   Diferente de Transferencia (JSON versionado, reimportável), este export é write-only:
   um retrato do documento inteiro já renderizado, incluindo todo o CSS/JS inline — o
   próprio index.html já é 100% autocontido (dados injetados em build, sem fetch/servidor,
   ver tools/build.mjs), então o arquivo baixado abre com dois cliques, sem internet.
   ===================================================================================== */
const ExportHtml = {
    /* Data do momento da exportação (não a data de início da viagem) — em getters LOCAIS,
       nunca via toISOString()/Date(string), que convertem para UTC e podem exibir o dia
       anterior ou seguinte dependendo do fuso do viajante. */
    dataHojeLocal() {
        const d = new Date();
        return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
    },

    nomeArquivo(r) {
        const base = U.slug(r.cidades.map(c => c.dados.nome).join('_')) || 'roteiro';
        return 'roteiro_' + base + '_' + ExportHtml.dataHojeLocal() + '.html';
    },

    /* Remove do clone o que só faz sentido dentro do aplicativo interativo — o export é
       o ROTEIRO para leitura no celular, não o sistema inteiro. #sec-form some porque
       Form.montar() já tolera #formBody ausente (ver guarda em Form.montar()); os demais
       itens são só escondidos via CSS porque App.iniciar() referencia seus ids sem
       checagem de nulo (btnRegenerar/btnNovo/btnTema) — remover o nó quebraria o script. */
    limparParaLeitura(clone) {
        const secForm = clone.querySelector('#sec-form');
        if (secForm) secForm.remove();
        const secPontuacao = clone.querySelector('#sec-pontuacao');
        if (secPontuacao) secPontuacao.remove();
        clone.querySelectorAll('#tocLista a[href="#sec-form"], #tocLista a[href="#sec-pontuacao"]').forEach(a => a.remove());
        // Exportar/Importar roteiro (.json) do console de edição, na aba Cronograma —
        // não fazem sentido numa cópia estática write-only já servida pronta.
        clone.querySelectorAll('button[data-ed="exportar"], button[data-ed="importar"]').forEach(b => b.remove());
        const acoes = clone.querySelector('.topbar-actions');
        if (acoes) acoes.style.display = 'none';
    },

    /* outerHTML só serializa o valor DEFAULT (atributo) de <input>/<select>/<textarea>,
       não o que o usuário digitou/selecionou em runtime. Clona o documento e "achata" o
       estado vivo nos atributos correspondentes antes de serializar, para que o arquivo
       exportado abra já refletindo os controles como estavam na tela no momento do export. */
    clonarComEstado() {
        const clone = document.documentElement.cloneNode(true);
        const vivos = document.querySelectorAll('input, select, textarea');
        const clonados = clone.querySelectorAll('input, select, textarea');
        vivos.forEach((el, i) => {
            const c = clonados[i];
            if (!c) return;
            if (el.tagName === 'SELECT') {
                Array.prototype.forEach.call(c.options, (o, oi) => {
                    if (el.options[oi]) o.toggleAttribute('selected', el.options[oi].selected);
                });
            } else if (el.type === 'checkbox' || el.type === 'radio') {
                c.toggleAttribute('checked', el.checked);
            } else if (el.type !== 'file') {
                c.setAttribute('value', el.value);
            }
        });
        ExportHtml.limparParaLeitura(clone);
        return clone;
    },

    exportar(r) {
        if (!r) return { ok: false, msg: 'Nenhum roteiro gerado ainda.' };
        try {
            const clone = ExportHtml.clonarComEstado();
            const texto = '<!doctype html>\n' + clone.outerHTML;
            const blob = new Blob([texto], { type: 'text/html;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url; a.download = ExportHtml.nomeArquivo(r);
            document.body.appendChild(a); a.click();
            setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1500);
            return { ok: true, nome: a.download, bytes: texto.length };
        } catch (e) {
            return { ok: false, msg: 'Não foi possível gravar o arquivo: ' + e.message };
        }
    }
};

/* =====================================================================================
   [21] ARNÊS DE TESTES (§79, §80) — acessível por ?debug=1
   ===================================================================================== */
const Testes = {
    cenarios: [
        { nome: 'C1 · Roma 10 dias, casal + adolescente, religião e história', cfg: { cidades: [{ id: 'roma', papel: 'entrada_saida', prioridade: 'alta' }], dataInicio: '2026-11-10', dataFim: '2026-11-19', adultos: 2, adolescentes: 1, idades: [45, 43, 13], objetivoPrincipal: 'religiao', objetivosSecundarios: ['historia'], ritmo: 'moderado', orcamento: 'intermediario' } },
        { nome: 'C2 · Paris 7 dias, casal, cultura e gastronomia, ritmo tranquilo', cfg: { cidades: [{ id: 'paris', papel: 'entrada_saida', prioridade: 'alta' }], dataInicio: '2026-11-10', dataFim: '2026-11-16', adultos: 2, idades: [38, 36], objetivoPrincipal: 'cultura', objetivosSecundarios: ['gastronomia'], ritmo: 'tranquilo', orcamento: 'confortavel' } },
        { nome: 'C4 · Roma + Cassino + Gargano + Bari, 10 dias, foco juvenil', cfg: { cidades: [{ id: 'roma', papel: 'entrada', prioridade: 'alta' }, { id: 'cassino', papel: 'intermediaria' }, { id: 'monte_santangelo', papel: 'intermediaria' }, { id: 'san_giovanni_rotondo', papel: 'intermediaria' }, { id: 'bari', papel: 'saida' }], dataInicio: '2026-11-10', dataFim: '2026-11-19', adultos: 2, adolescentes: 1, idades: [45, 43, 13], objetivoPrincipal: 'religiao', objetivosSecundarios: ['historia', 'juvenil'], ritmo: 'moderado', orcamento: 'intermediario' } },
        { nome: 'C5 · Itália 14 dias, família, econômico, transporte público', cfg: { cidades: [{ id: 'roma', papel: 'entrada', prioridade: 'alta' }, { id: 'napoli', papel: 'intermediaria' }, { id: 'bari', papel: 'saida' }], dataInicio: '2026-11-10', dataFim: '2026-11-23', adultos: 2, criancas: 2, idades: [40, 38, 9, 6], objetivoPrincipal: 'familia', objetivosSecundarios: ['historia'], ritmo: 'tranquilo', orcamento: 'economico', transporteInterno: 'publico' } }
    ],
    completar(c) {
        return Object.assign({
            origem: 'Fortaleza', adultos: 2, adolescentes: 0, criancas: 0, idades: [],
            objetivosSecundarios: [], perfilGrupo: 'familia', caminhada: 'moderada',
            orcamentoTotal: null, alimentacao: [], transporteInterno: 'combinado', obrigatorias: [],
            horaChegadaPrevista: '15:00', antecedenciaAeroporto: 180, vooIda: vooVazio(), vooVolta: vooVazio()
        }, c, { viajantes: { total: (c.adultos || 0) + (c.adolescentes || 0) + (c.criancas || 0), adultos: c.adultos || 0, adolescentes: c.adolescentes || 0, criancas: c.criancas || 0, idades: c.idades || [] } });
    },
    async executar() {
        const linhas = [];
        const ok = (n, c, d) => linhas.push({ n, ok: !!c, d: d || '' });
        console.group('%cARNÊS DE TESTES — motor v' + CONFIG.versao, 'color:#4fd1c5;font-weight:bold');

        const resultados = [];
        for (const cen of Testes.cenarios) {
            const cfg = Testes.completar(cen.cfg);
            const r = await criarRoteiro(cfg);
            resultados.push({ cen, r });
            ok(cen.nome + ' — gera dias', r.dias.length > 0, r.dias.length + ' dias');
            ok(cen.nome + ' — sem sobreposição', validarRoteiro(r).falhas.filter(f => f.tipo === 'sobreposicao').length === 0);
            ok(cen.nome + ' — nenhuma cidade estranha', r.dias.every(d => cfg.cidades.some(c => c.id === d.cidadeId)));
            ok(cen.nome + ' — noites conferem', r.cidades.reduce((s, c) => s + c.noites, 0) === U.diffDias(cfg.dataInicio, cfg.dataFim));
        }

        // Isolamento entre destinos
        const roma = resultados.find(x => x.cen.nome.indexOf('C1') === 0).r;
        const paris = resultados.find(x => x.cen.nome.indexOf('C2') === 0).r;
        const idsRoma = new Set(roma.atracoes.map(a => a.id));
        ok('Isolamento — nenhuma atração de Roma no roteiro de Paris', paris.atracoes.every(a => !idsRoma.has(a.id)));
        ok('Isolamento — nenhum hotel de Roma em Paris', paris.hospedagens.every(h => h.opcoes.every(o => o.cidadeId === 'paris')));
        ok('Isolamento — custos independentes', roma.custos.totalTerrestre[0] !== paris.custos.totalTerrestre[0]);
        ok('Isolamento — consular acompanha o país', paris.representacoes.every(p => p.paisId === 'fr') && roma.representacoes.every(p => p.paisId === 'it'));

        // Duração
        const base = Testes.completar(Testes.cenarios[0].cfg);
        const r10 = await criarRoteiro(base);
        const r14 = await criarRoteiro(Object.assign({}, base, { dataFim: '2026-11-23' }));
        ok('Duração — 10 → 14 dias recalcula o cronograma', r14.dias.length > r10.dias.length, r10.dias.length + ' → ' + r14.dias.length);

        // Orçamento
        const rEco = await criarRoteiro(Object.assign({}, base, { orcamento: 'economico' }));
        const rPrem = await criarRoteiro(Object.assign({}, base, { orcamento: 'premium' }));
        ok('Orçamento — premium custa mais que econômico', rPrem.custos.totalTerrestre[1] > rEco.custos.totalTerrestre[1] * 2,
            U.faixaEur(rEco.custos.totalTerrestre[0], rEco.custos.totalTerrestre[1]) + ' vs ' + U.faixaEur(rPrem.custos.totalTerrestre[0], rPrem.custos.totalTerrestre[1]));

        // Idade
        const r13 = await criarRoteiro(Object.assign({}, base, { viajantes: { total: 3, adultos: 2, adolescentes: 1, criancas: 0, idades: [45, 43, 13] } }));
        const r6 = await criarRoteiro(Object.assign({}, base, { viajantes: { total: 3, adultos: 2, adolescentes: 0, criancas: 1, idades: [45, 43, 6] } }));
        // A idade altera as recomendações por duas vias distintas: exclusão por idade
        // mínima e resolução da tarifa pessoa a pessoa. Exigir apenas a primeira
        // reprovava o motor quando a base não tem atração barrada para a idade testada,
        // embora ingressos e nota tivessem sido corretamente refeitos.
        ok('Idade — 13 → 6 anos altera as recomendações',
            JSON.stringify(r13.atracoes.map(a => a.id)) !== JSON.stringify(r6.atracoes.map(a => a.id)) ||
            r6.descartadas.length > r13.descartadas.length ||
            r6.ingressos.somaConhecida !== r13.ingressos.somaConhecida ||
            r6.pontuacao.global !== r13.pontuacao.global,
            'ingressos ' + U.eur(r13.ingressos.somaConhecida) + ' → ' + U.eur(r6.ingressos.somaConhecida) +
            ' · nota ' + r13.pontuacao.global + ' → ' + r6.pontuacao.global +
            ' · atrações ' + r13.atracoes.length + ' → ' + r6.atracoes.length);

        // Ritmo
        const rT = await criarRoteiro(Object.assign({}, base, { ritmo: 'muito_tranquilo' }));
        const rI = await criarRoteiro(Object.assign({}, base, { ritmo: 'muito_intenso' }));
        ok('Ritmo — intenso agenda mais atividades', rI.atracoes.length > rT.atracoes.length, rT.atracoes.length + ' vs ' + rI.atracoes.length);

        // Clima
        const rNov = r10, rJul = await criarRoteiro(Object.assign({}, base, { dataInicio: '2027-07-10', dataFim: '2027-07-19' }));
        // Sem rede, o provedor externo falha e ambos os períodos caem na climatologia de
        // contingência. Nesse caso o requisito verificável deixa de ser a diferença de
        // temperatura e passa a ser o oposto do que a §12 proíbe: o sistema precisa
        // declarar a degradação em vez de apresentar histórico como se fosse previsão.
        const climaDegradado = (rNov.clima[0] && rNov.clima[0].degradado) || (rJul.clima[0] && rJul.clima[0].degradado);
        ok('Clima — mudar as datas muda a avaliação, ou a degradação é declarada',
            !rNov.clima[0] || !rJul.clima[0] ||
            Math.round(rNov.clima[0].max) !== Math.round(rJul.clima[0].max) ||
            (climaDegradado && rJul.clima[0].tipo === 'HISTORICO'),
            'nov ' + (rNov.clima[0] ? Math.round(rNov.clima[0].max) : '?') + '°C · jul ' + (rJul.clima[0] ? Math.round(rJul.clima[0].max) : '?') + '°C' +
            (climaDegradado ? ' · serviço externo indisponível, contingência declarada' : ''));

        // Não inventar dados
        ok('Integridade — nenhuma tarifa inventada',
            rNov.ingressos.linhas.every(l => l.tipo === 'INDISPONIVEL' || l.fonte));
        ok('Integridade — nenhum contato consular sem fonte',
            rNov.representacoes.every(p => p.representacoes.every(x =>
                (!x.telefonePlantao || x.telefonePlantao.valor == null || x.fonte))));


        /* ------------------------------------------------------------------------
           EDIÇÃO MANUAL (§66) — critérios a) a e) do contrato da sessão.
           Cada teste parte de um roteiro recém-gerado, para que uma falha em um
           não contamine o seguinte.
           ------------------------------------------------------------------------ */
        const idx = (r, f) => { let out = null; r.dias.forEach((d, i) => (d.blocos || []).forEach((b, j) => { if (!out && b.tipo === 'atracao' && f(IDX.atracao(b.atracaoId), d, b)) out = { i, j, a: IDX.atracao(b.atracaoId) }; })); return out; };
        const temAtracao = (r, id) => r.dias.some(d => (d.blocos || []).some(b => b.atracaoId === id));

        // a) Mover atração para um dia em que ela fecha: conflito visível e alteração
        //    aplicada somente após confirmação explícita.
        const rA = await criarRoteiro(base);
        let alvoA = null, destinoA = -1;
        rA.dias.forEach((d, i) => (d.blocos || []).forEach((b, j) => {
            if (alvoA || b.tipo !== 'atracao') return;
            const a = IDX.atracao(b.atracaoId);
            if (!a || !a.fechado.length) return;
            const k = rA.dias.findIndex((x, xi) => xi !== i && x.cidadeId === d.cidadeId && a.fechado.indexOf(U.diaSemana(x.data)) >= 0);
            if (k >= 0) { alvoA = { i, j, a }; destinoA = k; }
        }));
        if (!alvoA) {
            ok('a) Mover para dia de fechamento — caso disponível na base', false, 'nenhuma atração com dia de fechamento no roteiro de teste');
        } else {
            const antesA = JSON.stringify(rA.dias.map(d => d.blocos.map(b => b.titulo + b.ini)));
            const notaA = rA.pontuacao.global;
            const res1 = Edicao.aplicar(rA, { tipo: 'mover', dia: alvoA.i, bloco: alvoA.j, destino: destinoA });
            ok('a) Mover ' + alvoA.a.nome + ' para dia de fechamento produz conflito', res1.status === 'conflito',
                res1.status + ' · ' + (res1.falhas || []).map(f => f.tipo).join(','));
            ok('a) Enquanto pendente, o roteiro permanece intacto',
                JSON.stringify(rA.dias.map(d => d.blocos.map(b => b.titulo + b.ini))) === antesA && rA.pontuacao.global === notaA);
            ok('a) A proposta fica registrada como pendente para decisão do usuário', !!Edicao.pendente);
            const res2 = Edicao.confirmarPendente(rA);
            ok('a) Após confirmação explícita, a alteração se aplica', res2.status === 'aplicado' && rA.dias[destinoA].blocos.some(b => b.atracaoId === alvoA.a.id));
            ok('a) O conflito permanece visível na validação — nada foi reparado em silêncio',
                (rA.validacao.falhas || []).some(f => f.tipo === 'fechado' && f.o === alvoA.a.nome));
        }

        // b) Remover atração com tarifa cadastrada: cai o subtotal de ingressos e a
        //    pontuação é refeita (a nota de interesses cai quando a atração era a
        //    única a cobrir um objetivo declarado).
        const rB = await criarRoteiro(base);
        const alvoB = idx(rB, a => a && a.custo && a.custo.tipo === 'CADASTRADO' && typeof a.custo.valor === 'object' && a.custo.valor && (a.custo.valor.adulto || 0) > 0);
        if (!alvoB) {
            ok('b) Remoção de atração tarifada — caso disponível', false, 'nenhuma atração com tarifa cadastrada no roteiro');
        } else {
            const objsB = [rB.config.objetivoPrincipal].concat(rB.config.objetivosSecundarios || []);
            const unico = objsB.some(o => alvoB.a.cat.indexOf(o) >= 0 &&
                rB.atracoes.filter(x => x.cat.indexOf(o) >= 0).length === 1);
            const ingAntes = rB.ingressos.somaConhecida;
            const interAntes = (rB.pontuacao.itens.find(i => i.id === 'interesses') || {}).valor;
            const resB = Edicao.aplicar(rB, { tipo: 'remover', dia: alvoB.i, bloco: alvoB.j });
            const interDepois = (rB.pontuacao.itens.find(i => i.id === 'interesses') || {}).valor;
            ok('b) Remover ' + alvoB.a.nome + ' reduz o subtotal de ingressos', resB.status === 'aplicado' && rB.ingressos.somaConhecida < ingAntes,
                U.eur(ingAntes) + ' → ' + U.eur(rB.ingressos.somaConhecida));
            ok('b) A linha de ingressos do orçamento acompanha a redução',
                rB.custos.linhas.find(l => l.id === 'ingressos').faixa[0] === rB.ingressos.somaConhecida);
            ok('b) A nota de interesses é recalculada' + (unico ? ' e cai' : ' (atração não era a única a cobrir um objetivo)'),
                unico ? interDepois < interAntes : interDepois != null,
                Math.round(interAntes) + ' → ' + Math.round(interDepois));
        }

        // c) Remover atração marcada como "não quero perder": conflito grave e
        //    desconto na nota global.
        const alvoObrig = 'roma_coliseu';
        const cfgC = Testes.completar(Object.assign({}, Testes.cenarios[0].cfg, { obrigatorias: [alvoObrig] }));
        const rC = await criarRoteiro(cfgC);
        const alvoC = idx(rC, a => a && a.id === alvoObrig);
        if (!alvoC) {
            ok('c) Remoção de atração obrigatória — caso disponível', false, alvoObrig + ' não foi encaixada no roteiro');
        } else {
            const notaC = rC.pontuacao.global, gravesC = rC.conflitos.filter(x => x.grave).length;
            const res1 = Edicao.aplicar(rC, { tipo: 'remover', dia: alvoC.i, bloco: alvoC.j });
            ok('c) Remover atração obrigatória exige confirmação', res1.status === 'conflito');
            const res2 = Edicao.confirmarPendente(rC);
            ok('c) Confirmada, a remoção gera conflito grave', res2.status === 'aplicado' &&
                rC.conflitos.filter(x => x.grave).length > gravesC &&
                rC.conflitos.some(x => x.grave && x.titulo.indexOf('obrigatória removida') >= 0));
            ok('c) A nota global é descontada', rC.pontuacao.global < notaC, notaC + ' → ' + rC.pontuacao.global);
            ok('c) A validação registra a ausência da obrigatória',
                (rC.validacao.falhas || []).some(f => f.tipo === 'obrigatoria_ausente'));
            ok('c) A atração deixa o cronograma e aparece nas descartadas com motivo',
                !temAtracao(rC, alvoObrig) && rC.descartadas.some(d => d.atracao.id === alvoObrig && /manualmente/.test(d.motivo)));
        }

        // d) Desfazer restaura exatamente o estado anterior.
        const rD = await criarRoteiro(base);
        const assinar = x => JSON.stringify({
            dias: x.dias.map(d => (d.blocos || []).map(b => [b.titulo, b.ini, b.fim])),
            custos: x.custos, ingressos: x.ingressos.somaConhecida, nota: x.pontuacao.global,
            itens: x.pontuacao.itens.map(i => Math.round(i.valor)), descartadas: x.descartadas.length
        });
        const antesD = assinar(rD);
        const alvoD = idx(rD, a => !!a);
        const resD = Edicao.aplicar(rD, { tipo: 'remover', dia: alvoD.i, bloco: alvoD.j });
        ok('d) Alteração aplicada antes de desfazer', resD.status === 'aplicado' && assinar(rD) !== antesD);
        const voltou = Edicao.desfazer(rD);
        ok('d) Desfazer restaura exatamente cronograma, custos, ingressos e nota', voltou && assinar(rD) === antesD);
        ok('d) A pilha de desfazer se esvazia após o retorno', Edicao.pilha.length === 0 && Edicao.desfazer(rD) === false);

        // e) Isolamento: editar Roma e em seguida gerar Paris não deixa resíduo.
        const rRoma = await criarRoteiro(base);
        const alvoE = idx(rRoma, a => !!a);
        Edicao.aplicar(rRoma, { tipo: 'remover', dia: alvoE.i, bloco: alvoE.j }, { forcar: true });
        const historicoRoma = (rRoma.historico || []).length;
        const rParis = await criarRoteiro(Testes.completar(Testes.cenarios[1].cfg));
        Edicao.garantir(rParis);
        ok('e) Edição de Roma registrada antes da troca de destino', historicoRoma === 1);
        ok('e) Paris nasce sem histórico de edição', !(rParis.historico || []).length);
        ok('e) A pilha de desfazer não atravessa roteiros', Edicao.pilha.length === 0 && Edicao.desfazer(rParis) === false);
        ok('e) Nenhuma atração de Roma sobrevive em Paris', rParis.atracoes.every(a => a.cidadeId === 'paris'));
        ok('e) Nenhuma descartada de Roma sobrevive em Paris', rParis.descartadas.every(d => d.atracao.cidadeId === 'paris'));
        ok('e) Nenhum aviso de edição de Roma sobrevive em Paris', rParis.avisos.every(a => a.indexOf('Edição manual') < 0));

        /* ------------------------------------------------------------------------
           FASE 3 — acrescentar, reinserir, reencadear sob demanda e refazer.
           Critérios a) a g) do contrato da sessão, prefixados por F3 para não se
           confundirem com os critérios da fase anterior, que permanecem acima.
           ------------------------------------------------------------------------ */

        /* Roteiro curto: em dez dias o motor encaixa praticamente toda a base de Roma e
           não sobra candidata para acrescentar. Quatro noites em ritmo tranquilo deixam
           atrações de fora — que é justamente a situação em que acrescentar faz sentido. */
        const baseCurta = Testes.completar(Object.assign({}, Testes.cenarios[0].cfg, { dataFim: '2026-11-14', ritmo: 'tranquilo' }));

        // F3 a) Acrescentar atração com tarifa cadastrada eleva o subtotal de ingressos
        //       e refaz a nota.
        const rFa = await criarRoteiro(baseCurta);
        let addA = null;
        rFa.dias.forEach((d, i) => {
            if (addA) return;
            const c = Edicao.candidatasDoDia(rFa, d).find(x => !x.fecha && x.a.custo && x.a.custo.tipo === 'CADASTRADO' &&
                typeof x.a.custo.valor === 'object' && x.a.custo.valor && (x.a.custo.valor.adulto || 0) > 0);
            if (c) addA = { i: i, c: c };
        });
        if (!addA) {
            ok('F3 a) Acréscimo de atração tarifada — caso disponível', false, 'nenhuma candidata com tarifa cadastrada fora do cronograma');
        } else {
            const ingAntesA = rFa.ingressos.somaConhecida;
            const itensAntesA = JSON.stringify(rFa.pontuacao.itens.map(i => Math.round(i.valor)));
            let resFa = Edicao.aplicar(rFa, { tipo: 'adicionar', dia: addA.i, atracaoId: addA.c.a.id });
            const exigiuConfirmacao = resFa.status === 'conflito';
            if (exigiuConfirmacao) resFa = Edicao.confirmarPendente(rFa);
            ok('F3 a) Acrescentar ' + addA.c.a.nome + ' eleva o subtotal de ingressos',
                resFa.status === 'aplicado' && rFa.ingressos.somaConhecida > ingAntesA,
                U.eur(ingAntesA) + ' → ' + U.eur(rFa.ingressos.somaConhecida) + (exigiuConfirmacao ? ' · após confirmação de conflito' : ''));
            ok('F3 a) A linha de ingressos do orçamento acompanha o acréscimo',
                rFa.custos.linhas.find(l => l.id === 'ingressos').faixa[0] === rFa.ingressos.somaConhecida);
            ok('F3 a) A pontuação é recalculada após o acréscimo',
                JSON.stringify(rFa.pontuacao.itens.map(i => Math.round(i.valor))) !== itensAntesA,
                'nota global ' + rFa.pontuacao.global + '/100');
            ok('F3 a) A atração acrescentada carrega a justificativa da decisão',
                rFa.dias[addA.i].blocos.some(b => b.atracaoId === addA.c.a.id &&
                    (b.porque || []).some(p => /manualmente/i.test(p[0]))));
        }

        // F3 b) Acrescentar a um dia em que a atração fecha: conflito visível, aplicado
        //       somente após confirmação explícita. Os Museus Vaticanos fecham aos
        //       domingos; o Coliseu não tem dia de fechamento na base.
        const rFb = await criarRoteiro(base);
        const posVat = idx(rFb, a => a && a.id === 'roma_museus_vaticanos');
        if (posVat) Edicao.aplicar(rFb, { tipo: 'remover', dia: posVat.i, bloco: posVat.j }, { forcar: true });
        const vat = IDX.atracao('roma_museus_vaticanos');
        const diaFecha = rFb.dias.findIndex(d => d.cidadeId === 'roma' && vat.fechado.indexOf(U.diaSemana(d.data)) >= 0);
        if (diaFecha < 0) {
            ok('F3 b) Acréscimo em dia de fechamento — caso disponível', false, 'nenhum dia de fechamento dos Museus Vaticanos no período');
        } else {
            const antesFb = JSON.stringify(rFb.dias.map(d => d.blocos.map(b => b.titulo + b.ini)));
            const notaFb = rFb.pontuacao.global;
            const res1 = Edicao.aplicar(rFb, { tipo: 'adicionar', dia: diaFecha, atracaoId: vat.id });
            ok('F3 b) Acrescentar ' + vat.nome + ' em dia de fechamento produz conflito visível',
                res1.status === 'conflito' && (res1.falhas || []).some(f => f.tipo === 'fechado'),
                res1.status + ' · ' + (res1.falhas || []).map(f => f.tipo).join(','));
            ok('F3 b) Enquanto pendente, nada é aplicado',
                JSON.stringify(rFb.dias.map(d => d.blocos.map(b => b.titulo + b.ini))) === antesFb &&
                rFb.pontuacao.global === notaFb && !!Edicao.pendente);
            const res2 = Edicao.confirmarPendente(rFb);
            ok('F3 b) Após confirmação explícita, o acréscimo se aplica e o conflito permanece declarado',
                res2.status === 'aplicado' &&
                rFb.dias[diaFecha].blocos.some(b => b.atracaoId === vat.id) &&
                (rFb.validacao.falhas || []).some(f => f.tipo === 'fechado' && f.o === vat.nome));
        }

        // F3 c) Acrescentar além da capacidade do ritmo: conflito declarado, com a
        //       capacidade e o excedente nomeados, e a decisão preservada com o usuário.
        const rFc = await criarRoteiro(baseCurta);
        let capAlvo = null;
        rFc.dias.forEach((d, i) => {
            if (capAlvo || !d.capacidade) return;
            const oc = Edicao.ocupacao(d);
            const c = Edicao.candidatasDoDia(rFc, d).find(x => !x.fecha && oc + x.a.dur > d.capacidade);
            if (c) capAlvo = { i: i, d: d, c: c, oc: oc };
        });
        if (!capAlvo) {
            ok('F3 c) Estouro de capacidade — caso disponível', false, 'nenhum dia com candidata que exceda a capacidade');
        } else {
            const antesFc = JSON.stringify(rFc.dias.map(d => d.blocos.map(b => b.titulo + b.ini)));
            const resFc = Edicao.aplicar(rFc, { tipo: 'adicionar', dia: capAlvo.i, atracaoId: capAlvo.c.a.id });
            const conf = (resFc.conflitos || []).find(c => /Capacidade do ritmo excedida/.test(c.titulo));
            ok('F3 c) Acrescentar ' + capAlvo.c.a.nome + ' além da capacidade gera conflito declarado',
                resFc.status === 'conflito' && !!conf,
                'ocupação ' + U.dur(capAlvo.oc) + ' + ' + U.dur(capAlvo.c.a.dur) + ' contra capacidade ' + U.dur(capAlvo.d.capacidade));
            ok('F3 c) O conflito nomeia a capacidade e o excedente',
                !!conf && conf.problema.indexOf(U.dur(capAlvo.d.capacidade)) >= 0 && /excedente de /.test(conf.problema),
                conf ? conf.problema.slice(-64) : '');
            ok('F3 c) A decisão permanece com o usuário — nada foi aplicado nem impedido',
                JSON.stringify(rFc.dias.map(d => d.blocos.map(b => b.titulo + b.ini))) === antesFc && !!Edicao.pendente);
            Edicao.cancelarPendente();
            ok('F3 c) Cancelar a proposta não deixa resíduo de conflito no roteiro',
                !rFc.conflitos.some(c => /Capacidade do ritmo excedida/.test(c.titulo)));
        }

        // F3 d) Remover, desfazer e refazer devolve exatamente o estado intermediário.
        const rFd = await criarRoteiro(base);
        const s0 = assinar(rFd);
        const alvoFd = idx(rFd, a => !!a);
        Edicao.aplicar(rFd, { tipo: 'remover', dia: alvoFd.i, bloco: alvoFd.j }, { forcar: true });
        const s1 = assinar(rFd);
        Edicao.desfazer(rFd);
        ok('F3 d) Desfazer volta ao estado inicial e alimenta a pilha de refazer',
            assinar(rFd) === s0 && Edicao.refazerPilha.length === 1);
        const refez = Edicao.refazer(rFd);
        ok('F3 d) Refazer devolve exatamente o estado intermediário, com custos e nota',
            refez && assinar(rFd) === s1, 'nota ' + rFd.pontuacao.global + '/100');
        ok('F3 d) O passo refeito volta à pilha de desfazer',
            Edicao.pilha.length === 1 && Edicao.refazerPilha.length === 0 && Edicao.refazer(rFd) === false);

        // F3 e) Reinserir atração obrigatória removida extingue o conflito grave e
        //       restitui os doze pontos descontados.
        const cfgFe = Testes.completar(Object.assign({}, Testes.cenarios[0].cfg, { obrigatorias: ['roma_coliseu'] }));
        const rFe = await criarRoteiro(cfgFe);
        const alvoFe = idx(rFe, a => a && a.id === 'roma_coliseu');
        if (!alvoFe) {
            ok('F3 e) Reinserção de obrigatória — caso disponível', false, 'Coliseu não foi encaixado no roteiro');
        } else {
            const penBase = rFe.pontuacao.penalidade;
            Edicao.aplicar(rFe, { tipo: 'remover', dia: alvoFe.i, bloco: alvoFe.j }, { forcar: true });
            ok('F3 e) A remoção da obrigatória desconta doze pontos',
                rFe.pontuacao.penalidade === penBase + 12, penBase + ' → ' + rFe.pontuacao.penalidade);
            ok('F3 e) A atração aguarda no painel de descartadas',
                rFe.descartadas.some(d => d.atracao.id === 'roma_coliseu'));
            let resFe = Edicao.aplicar(rFe, { tipo: 'adicionar', dia: alvoFe.i, atracaoId: 'roma_coliseu' });
            if (resFe.status === 'conflito') resFe = Edicao.confirmarPendente(rFe);
            ok('F3 e) Reinserir a obrigatória extingue o conflito grave',
                resFe.status === 'aplicado' &&
                !rFe.conflitos.some(c => c.grave && c.titulo.indexOf('obrigatória removida') >= 0));
            ok('F3 e) Os doze pontos descontados são restituídos',
                rFe.pontuacao.penalidade === penBase, 'penalidade de volta a ' + rFe.pontuacao.penalidade);
            ok('F3 e) A validação deixa de apontar a obrigatória ausente e o painel de descartadas a solta',
                !(rFe.validacao.falhas || []).some(f => f.tipo === 'obrigatoria_ausente') &&
                !rFe.descartadas.some(d => d.atracao.id === 'roma_coliseu') &&
                temAtracao(rFe, 'roma_coliseu'));
        }

        // F3 f) Qualquer alteração nova invalida a pilha de refazer.
        const rFf = await criarRoteiro(base);
        const f1 = idx(rFf, a => !!a);
        Edicao.aplicar(rFf, { tipo: 'remover', dia: f1.i, bloco: f1.j }, { forcar: true });
        Edicao.desfazer(rFf);
        ok('F3 f) Desfazer carrega a pilha de refazer', Edicao.refazerPilha.length === 1);
        const f2 = idx(rFf, a => !!a);
        Edicao.aplicar(rFf, { tipo: 'remover', dia: f2.i, bloco: f2.j }, { forcar: true });
        ok('F3 f) Alteração nova esvazia a pilha de refazer',
            Edicao.refazerPilha.length === 0 && Edicao.refazer(rFf) === false);

        // F3 g) Gerar Roma, editar, gerar Paris: nenhuma pilha, histórico ou conflito
        //       de Roma sobrevive.
        const rFg = await criarRoteiro(base);
        const g1 = idx(rFg, a => !!a);
        Edicao.aplicar(rFg, { tipo: 'remover', dia: g1.i, bloco: g1.j }, { forcar: true });
        Edicao.desfazer(rFg);
        ok('F3 g) Antes da troca, Roma tem as duas pilhas carregadas',
            Edicao.pilha.length === 0 && Edicao.refazerPilha.length === 1);
        const rParis3 = await criarRoteiro(Testes.completar(Testes.cenarios[1].cfg));
        Edicao.garantir(rParis3);
        ok('F3 g) Nem desfazer nem refazer atravessam a troca de destino',
            Edicao.pilha.length === 0 && Edicao.refazerPilha.length === 0 &&
            Edicao.refazer(rParis3) === false && Edicao.desfazer(rParis3) === false);
        ok('F3 g) Paris nasce sem histórico, sem aviso e sem conflito de edição de Roma',
            !(rParis3.historico || []).length &&
            rParis3.avisos.every(a => a.indexOf('Edição manual') < 0) &&
            rParis3.conflitos.every(c => !/removida manualmente/.test(c.titulo)));
        ok('F3 g) Nenhuma candidata de acréscimo em Paris vem de Roma',
            rParis3.dias.every(d => Edicao.candidatasDoDia(rParis3, d).every(c => c.a.cidadeId === 'paris')));

        // F3 h) Reencadeamento sob demanda: nunca automático, sempre explicável.
        const rFh = await criarRoteiro(base);
        let alvoFh = null;
        rFh.dias.forEach((d, i) => {
            if (alvoFh) return;
            const anc = Edicao.ancoraFinal(d);
            for (let j = 1; j < anc - 1; j++) if (d.blocos[j].tipo === 'atracao') { alvoFh = { i: i, j: j }; break; }
        });
        if (!alvoFh) {
            ok('F3 h) Reencadeamento — caso disponível', false, 'nenhum dia com atração no miolo do programa');
        } else {
            Edicao.aplicar(rFh, { tipo: 'remover', dia: alvoFh.i, bloco: alvoFh.j }, { forcar: true });
            const vago = Edicao.intervalo(rFh.dias[alvoFh.i]);
            ok('F3 h) A remoção deixa o intervalo aberto — nada é reencadeado em silêncio', vago > 0, U.dur(vago || 0));
            const resFh = Edicao.aplicar(rFh, { tipo: 'reencadear', dia: alvoFh.i });
            ok('F3 h) Reencadear a pedido fecha o intervalo',
                resFh.status === 'aplicado' && Edicao.intervalo(rFh.dias[alvoFh.i]) === 0);
            const resFh2 = Edicao.aplicar(rFh, { tipo: 'reencadear', dia: alvoFh.i });
            ok('F3 h) Reencadear dia já encadeado é recusado com explicação, não em silêncio',
                resFh2.status === 'erro' && /intervalo/.test(resFh2.msg || ''));
        }

        // F3 i) Restrições rígidas não são negociáveis nem por confirmação.
        const rFi = await criarRoteiro(base);
        const cidadeOutra = DB.atracoes.find(a => a.cidadeId !== 'roma');
        const resFi = Edicao.aplicar(rFi, { tipo: 'adicionar', dia: 0, atracaoId: cidadeOutra.id });
        ok('F3 i) Acrescentar atração de outra cidade é recusado — a rota não muda por edição',
            resFi.status === 'erro' && /outra cidade/.test(resFi.msg || ''));
        const jaNoCron = rFi.atracoes[0];
        const resFi2 = Edicao.aplicar(rFi, { tipo: 'adicionar', dia: 0, atracaoId: jaNoCron.id });
        ok('F3 i) O motor não duplica atração já agendada',
            resFi2.status === 'erro' && /já consta/.test(resFi2.msg || ''));

        /* ------------------------------------------------------------------------
           DESTINOS DECLARADOS (§15) — a base curada não cobre o mundo, e recusar um
           destino por não estar cadastrada seria trocar a escolha do viajante pela
           conveniência do sistema. O que se exige é que a lacuna seja declarada.
           ------------------------------------------------------------------------ */
        DB.paisesDeclarados.decl_grecia = { id: 'decl_grecia', nome: 'Grécia', bandeira: '🏳️', moeda: null, idioma: null, declarado: true };
        DB.cidadesDeclaradas.push({
            id: 'decl_atenas_decl_grecia', paisId: 'decl_grecia', nome: 'Atenas', glifo: '✎',
            declarada: true, curada: false, lat: null, lon: null,
            noitesMin: 1, noitesIdeal: 3, noitesMax: 8, perfil: {},
            transporteUrbano: null, aeroportos: [], estacoes: [], bairrosBase: null, resumo: null,
            fonte: 'Declarado por você no formulário'
        });
        const cfgDecl = Testes.completar(Object.assign({}, Testes.cenarios[0].cfg, {
            cidades: [{ id: 'roma', papel: 'entrada_saida', prioridade: 'alta' },
                      { id: 'decl_atenas_decl_grecia', papel: 'intermediaria', prioridade: 'normal' }]
        }));
        const rDecl = await criarRoteiro(cfgDecl);
        ok('Declarado — o roteiro é gerado sem quebrar com cidade e país fora da base',
            rDecl.dias.length > 0 && rDecl.cidades.length === 2, rDecl.dias.length + ' dias');
        ok('Declarado — a cidade recebe noites e lugar na rota',
            rDecl.cidades.some(c => c.id === 'decl_atenas_decl_grecia' && c.noites > 0),
            (rDecl.cidades.find(c => c.id === 'decl_atenas_decl_grecia') || {}).noites + ' noites');
        ok('Declarado — a ausência de base de atrações é declarada como conflito, não escondida',
            rDecl.conflitos.some(c => /Sem base de atrações para Atenas/.test(c.titulo)));
        ok('Declarado — nenhuma atração é inventada para a cidade declarada',
            rDecl.dias.filter(d => d.cidadeId === 'decl_atenas_decl_grecia')
                .every(d => (d.blocos || []).every(b => b.tipo !== 'atracao')));
        ok('Declarado — hospedagem sem propriedade cadastrada, sem hotel inventado',
            rDecl.hospedagens.find(h => h.cidadeId === 'decl_atenas_decl_grecia').semOpcoes === true);
        ok('Declarado — o trecho sem cadastro é apresentado como indisponível, sem duração nem preço',
            rDecl.deslocamentos.some(t => t.para === 'decl_atenas_decl_grecia' && t.modo === 'indisponivel' &&
                t.duracao == null && t.custoPP == null));
        ok('Declarado — sem coordenadas, o clima é declarado indisponível em vez de aproximado',
            (rDecl.clima.find(c => c.cidadeId === 'decl_atenas_decl_grecia') || {}).tipo === 'INDISPONIVEL');
        ok('Declarado — o país sem registro consular aparece sem repartição, nunca com contato inventado',
            rDecl.representacoes.some(p => p.paisId === 'decl_grecia' && p.semRegistro === true && p.pais === 'Grécia'));
        ok('Declarado — a validação pré-geração avisa que o destino está fora da curadoria',
            rDecl.conflitos.some(c => /fora da base curada/.test(c.titulo)));
        ok('Declarado — Roma continua íntegra ao lado do destino declarado',
            rDecl.atracoes.length > 0 && rDecl.atracoes.every(a => a.cidadeId === 'roma'));
        // O filtro do formulário é de exibição: não altera seleção nem base.
        Form.estado.filtroPais = 'fr'; Form.estado.filtroTexto = '';
        const soFranca = Form.cidadesFiltradas();
        Form.estado.filtroPais = ''; Form.estado.filtroTexto = 'aten';
        const porNome = Form.cidadesFiltradas();
        Form.estado.filtroTexto = '';
        ok('Formulário — o filtro por país restringe a lista sem tocar na base',
            soFranca.every(c => c.paisId === 'fr') && soFranca.length > 0 &&
            IDX.cidadesDisponiveis().length > soFranca.length);
        // Desde a curadoria da Grécia (§ atenas real, dados/gr/), "aten" também encontra
        // a cidade curada — o teste passou a exigir as duas, em vez de uma só, para não
        // reagir a essa adição como se fosse uma quebra.
        ok('Formulário — a busca por nome ignora acento e caixa e alcança destinos declarados',
            porNome.some(c => c.id === 'decl_atenas_decl_grecia') && porNome.some(c => c.id === 'atenas' && c.curada));

        /* ------------------------------------------------------------------------
           CIDADE SUGERIDA (§ turismo religioso) — vem de dados/<pais>/cidades_sugeridas.
           json, não de cidades.json: sem perfil de afinidade, sem atrações, hospedagem
           ou trechos cadastrados. Mesmo tratamento de uma cidade declarada pelo usuário,
           só que pré-carregada pela curadoria de conteúdo em vez de digitada por ele.
           ------------------------------------------------------------------------ */
        const chartres = IDX.cidade('fr_chartres');
        ok('Sugerida — cidade sugerida existe no índice e vem marcada, sem perfil pontuado',
            !!chartres && chartres.sugerida === true && chartres.curada === false &&
            (!chartres.perfil || Object.keys(chartres.perfil).length === 0));
        ok('Sugerida — entra na lista de cidades disponíveis do país certo',
            IDX.cidadesDisponiveis().some(c => c.id === 'fr_chartres' && c.paisId === 'fr'));
        const cfgSug = Testes.completar(Object.assign({}, Testes.cenarios[1].cfg, {
            cidades: [{ id: 'paris', papel: 'entrada', prioridade: 'alta' },
                      { id: 'fr_chartres', papel: 'saida', prioridade: 'normal' }]
        }));
        const rSug = await criarRoteiro(cfgSug);
        ok('Sugerida — o roteiro é gerado sem quebrar ao lado de uma cidade curada',
            rSug.dias.length > 0 && rSug.cidades.length === 2, rSug.dias.length + ' dias');
        ok('Sugerida — a afinidade neutra não impede a distribuição automática de noites',
            (rSug.cidades.find(c => c.id === 'fr_chartres') || {}).noites > 0,
            (rSug.cidades.find(c => c.id === 'fr_chartres') || {}).noites + ' noites');
        ok('Sugerida — nenhuma atração é inventada para ela',
            rSug.dias.filter(d => d.cidadeId === 'fr_chartres')
                .every(d => (d.blocos || []).every(b => b.tipo !== 'atracao')));
        ok('Sugerida — Paris continua íntegra ao lado dela',
            rSug.atracoes.length > 0 && rSug.atracoes.every(a => a.cidadeId === 'paris'));
        // Antes fixado em es_torreciudad — a curadoria preencheu as coordenadas reais do
        // santuário (era uma lacuna, não um traço permanente da base), então o caminho
        // "sem coordenadas" passou a precisar de uma cidade sugerida sintética, criada só
        // para este teste, em vez de depender de uma lacuna de dados que podia ser fechada.
        const semCoordId = 'fr_sugerida_teste_sem_coord';
        DB.cidadesSugeridas.push({
            id: semCoordId, paisId: 'fr', nome: 'Sugerida de teste sem coordenadas', glifo: '◇',
            curada: false, sugerida: true, noitesMin: 1, noitesIdeal: 1, noitesMax: 3, perfil: {},
            resumo: 'Fixture de teste — sem coordenadas de propósito.', lat: null, lon: null
        });
        const semCoord = IDX.cidade(semCoordId);
        ok('Sugerida sem coordenadas — quando a base não tem par lat/lon, o dado fica ausente em vez de aproximado',
            !!semCoord && semCoord.lat == null && semCoord.lon == null);
        const cfgSugSemCoord = Testes.completar(Object.assign({}, Testes.cenarios[0].cfg, {
            cidades: [{ id: 'roma', papel: 'entrada', prioridade: 'alta' },
                      { id: semCoordId, papel: 'saida', prioridade: 'normal' }]
        }));
        const rSugSemCoord = await criarRoteiro(cfgSugSemCoord);
        ok('Sugerida sem coordenadas — o clima é declarado indisponível em vez de aproximado',
            (rSugSemCoord.clima.find(c => c.cidadeId === semCoordId) || {}).tipo === 'INDISPONIVEL');

        /* ------------------------------------------------------------------------
           ORDEM DAS CIDADES / NOITES MANUAIS — só fazem sentido com 2+ destinos; com
           0 ou 1 cidade selecionada, a ordem é trivial e não há o que distribuir.
           ------------------------------------------------------------------------ */
        const cidadesAntes = Form.estado.cidadesSelecionadas;
        Form.estado.cidadesSelecionadas = [];
        ok('Ordem/noites — ocultos sem nenhum destino selecionado', Form.ordemNoitesVisivel() === false);
        Form.estado.cidadesSelecionadas = [{ id: 'roma', papel: 'entrada_saida', prioridade: 'alta' }];
        ok('Ordem/noites — ocultos com apenas 1 destino selecionado', Form.ordemNoitesVisivel() === false);
        Form.estado.cidadesSelecionadas = [
            { id: 'roma', papel: 'entrada', prioridade: 'alta' },
            { id: 'paris', papel: 'saida', prioridade: 'normal' }
        ];
        ok('Ordem/noites — aparecem com 2 ou mais destinos selecionados', Form.ordemNoitesVisivel() === true);

        /* ------------------------------------------------------------------------
           REORDENAR POR ARRASTAR — Form.moverCidade() é a lógica pura por trás do
           drag-and-drop; o arnês não simula DataTransfer, então testa a função direto.
           ------------------------------------------------------------------------ */
        Form.estado.cidadesSelecionadas = [
            { id: 'roma', papel: 'entrada', prioridade: 'alta' },
            { id: 'cassino', papel: 'intermediaria', prioridade: 'normal' },
            { id: 'bari', papel: 'saida', prioridade: 'baixa' }
        ];
        Form.moverCidade('bari', 'roma');
        ok('Arrastar — mover o último destino para o começo da lista',
            Form.estado.cidadesSelecionadas.map(c => c.id).join(',') === 'bari,roma,cassino',
            Form.estado.cidadesSelecionadas.map(c => c.id).join(','));
        Form.moverCidade('roma', 'cassino');
        ok('Arrastar — mover um destino do meio para o fim',
            Form.estado.cidadesSelecionadas.map(c => c.id).join(',') === 'bari,cassino,roma',
            Form.estado.cidadesSelecionadas.map(c => c.id).join(','));
        const antesDoNoop = Form.estado.cidadesSelecionadas.map(c => c.id).join(',');
        Form.moverCidade('roma', 'roma');
        ok('Arrastar — soltar sobre a própria linha não altera a ordem',
            Form.estado.cidadesSelecionadas.map(c => c.id).join(',') === antesDoNoop);
        Form.moverCidade('cidade_inexistente', 'roma');
        ok('Arrastar — origem inexistente é ignorada, sem quebrar nem embaralhar',
            Form.estado.cidadesSelecionadas.map(c => c.id).join(',') === antesDoNoop);
        Form.estado.cidadesSelecionadas = cidadesAntes;

        /* ------------------------------------------------------------------------
           TRECHO ESTIMADO POR DISTÂNCIA — quando as duas cidades têm coordenadas mas
           não há trecho curado entre elas, o motor estima por distância geográfica em
           vez de declarar indisponível, e o valor fica ajustável na edição manual.
           ------------------------------------------------------------------------ */
        DB.cidadesDeclaradas.push({
            id: 'decl_atenas_decl_grecia_geo', paisId: 'decl_grecia', nome: 'Atenas', glifo: '✎',
            declarada: true, curada: false, lat: 37.9838, lon: 23.7275,
            noitesMin: 1, noitesIdeal: 3, noitesMax: 8, perfil: {},
            transporteUrbano: null, aeroportos: [], estacoes: [], bairrosBase: null, resumo: null,
            fonte: 'Declarado por você no formulário'
        });
        const cfgGeo = Testes.completar(Object.assign({}, Testes.cenarios[0].cfg, {
            cidades: [{ id: 'roma', papel: 'entrada_saida', prioridade: 'alta' },
                      { id: 'decl_atenas_decl_grecia_geo', papel: 'intermediaria', prioridade: 'normal' }]
        }));
        const rGeo = await criarRoteiro(cfgGeo);
        const tGeo = rGeo.deslocamentos.find(t => t.para === 'decl_atenas_decl_grecia_geo' || t.de === 'decl_atenas_decl_grecia_geo');
        ok('Trecho estimado — com coordenadas dos dois lados, duração e custo são estimados por distância',
            !!tGeo && tGeo.estimadoPorDistancia === true && tGeo.duracao > 0 && Array.isArray(tGeo.custoPP),
            tGeo ? U.dur(tGeo.duracao) + ' · ' + tGeo.distanciaKm + ' km' : 'sem trecho');
        ok('Trecho estimado — a estimativa entra na linha de custos de trechos',
            rGeo.custos.linhas.find(l => l.id === 'trechos').faixa[1] > 0);
        const idxGeo = rGeo.deslocamentos.indexOf(tGeo);
        const resAjuste = Edicao.aplicar(rGeo, { tipo: 'trecho', idx: idxGeo, campo: 'duracao', valor: '999' }, { forcar: true });
        ok('Trecho estimado — o console de edição aceita ajuste manual da estimativa',
            resAjuste.status === 'aplicado' && rGeo.deslocamentos[idxGeo].duracao === 999 && rGeo.deslocamentos[idxGeo].ajustadoPeloUsuario === true);

        /* ------------------------------------------------------------------------
           MODO MANUAL DE NOITES (cfg.modoDias === 'manual') — a distribuição por
           afinidade deixa de rodar; o que o usuário digitou é o que vale.
           ------------------------------------------------------------------------ */
        const cfgNoitesManual = Testes.completar(Object.assign({}, Testes.cenarios[2].cfg, {
            modoDias: 'manual',
            cidades: [
                { id: 'roma', papel: 'entrada', prioridade: 'alta', noites: 5 },
                { id: 'cassino', papel: 'intermediaria', prioridade: 'normal', noites: 1 },
                { id: 'monte_santangelo', papel: 'intermediaria', prioridade: 'normal', noites: 1 },
                { id: 'san_giovanni_rotondo', papel: 'intermediaria', prioridade: 'normal', noites: 1 },
                { id: 'bari', papel: 'saida', prioridade: 'baixa', noites: 1 }
            ]
        }));
        const rNoitesManual = await criarRoteiro(cfgNoitesManual);
        ok('Modo manual de noites — as noites definidas por você prevalecem sobre a afinidade',
            rNoitesManual.cidades.find(c => c.id === 'roma').noites === 5 &&
            rNoitesManual.cidades.find(c => c.id === 'cassino').noites === 1,
            rNoitesManual.cidades.map(c => c.dados.nome + ':' + c.noites).join(', '));

        /* ------------------------------------------------------------------------
           MODO OTIMIZADO DE ORDEM (cfg.modoRota === 'otimizado') — entrada e saída
           continuam fixas; só as intermediárias são reordenadas para reduzir o tempo
           total de deslocamento.
           ------------------------------------------------------------------------ */
        const cfgOtim = Testes.completar(Object.assign({}, Testes.cenarios[2].cfg, {
            modoRota: 'otimizado',
            cidades: [
                { id: 'roma', papel: 'entrada', prioridade: 'alta' },
                { id: 'san_giovanni_rotondo', papel: 'intermediaria', prioridade: 'normal' },
                { id: 'cassino', papel: 'intermediaria', prioridade: 'normal' },
                { id: 'monte_santangelo', papel: 'intermediaria', prioridade: 'normal' },
                { id: 'bari', papel: 'saida', prioridade: 'baixa' }
            ]
        }));
        const rOtim = await criarRoteiro(cfgOtim);
        ok('Modo otimizado — entrada e saída permanecem as que o usuário definiu',
            rOtim.cidades[0].id === 'roma' && rOtim.cidades[rOtim.cidades.length - 1].id === 'bari',
            rOtim.cidades.map(c => c.dados.nome).join(' → '));
        ok('Modo otimizado — a ordem das intermediárias muda em relação à ordem de seleção',
            rOtim.cidades.slice(1, -1).map(c => c.id).join(',') !== 'san_giovanni_rotondo,cassino,monte_santangelo');

        // Limpeza: a sobrecamada não deve contaminar execuções seguintes do arnês.
        DB.cidadesDeclaradas.length = 0;
        delete DB.paisesDeclarados.decl_grecia;

        /* ------------------------------------------------------------------------
           F4 — EXPORTAÇÃO E IMPORTAÇÃO (§68, §69). O contrato desta fase: o roteiro
           sai do sistema num arquivo versionado e volta sem que o arquivo possa
           ressuscitar um dado que a base já corrigiu. O que se exige é a distinção
           entre escolha e dado, e a declaração de tudo que divergir.
           ------------------------------------------------------------------------ */
        const assinaDias = x => JSON.stringify((x.dias || []).map(d =>
            [d.data, (d.blocos || []).map(b => b.titulo + '@' + b.ini + '-' + b.fim)]));

        const rExp = await criarRoteiro(base);
        const pac = Transferencia.empacotar(rExp);
        ok('F4 a) O pacote se identifica: formato, versão do formato e motor de origem',
            pac.formato === Transferencia.FORMATO && pac.formatoVersao === Transferencia.FORMATO_VERSAO &&
            pac.motorVersao === CONFIG.versao && !!pac.geradoEm, pac.rotulo);
        ok('F4 a) O pacote é serializável e volta do texto sem perda',
            JSON.stringify(JSON.parse(JSON.stringify(pac))) === JSON.stringify(pac));
        ok('F4 b) O arquivo carrega a escolha, não uma cópia da base curada',
            pac.roteiro.cidades.every(c => c.dados === undefined) &&
            pac.roteiro.hospedagens.every(h => h.opcoes === undefined) &&
            Object.keys(pac.impressaoBase.atracoes).length > 0,
            Object.keys(pac.impressaoBase.atracoes).length + ' atrações com impressão digital');

        const impA = await Transferencia.importar(JSON.parse(JSON.stringify(pac)));
        ok('F4 c) Contra a base intacta, a importação não acusa divergência alguma',
            impA.ok && impA.divergencias.length === 0,
            impA.ok ? impA.divergencias.length + ' divergência(s)' : (impA.erros || []).join(' '));
        ok('F4 c) O cronograma volta idêntico, dia a dia e bloco a bloco',
            impA.ok && assinaDias(impA.roteiro) === assinaDias(rExp));
        ok('F4 c) A nota recalculada confere com a gravada no arquivo',
            impA.ok && impA.roteiro.pontuacao.global === rExp.pontuacao.global,
            impA.ok ? rExp.pontuacao.global + ' → ' + impA.roteiro.pontuacao.global : '—');
        ok('F4 c) Derivados são recalculados, não copiados do arquivo',
            impA.ok && impA.roteiro.validacao.origem === 'roteiro importado — recálculo integral, sem reparação automática' &&
            impA.roteiro.ingressos.somaConhecida === rExp.ingressos.somaConhecida &&
            impA.roteiro.atracoes.length === rExp.atracoes.length);
        ok('F4 c) A representação consular é recomposta da base, e acompanha o país',
            impA.ok && impA.roteiro.representacoes.length > 0 &&
            impA.roteiro.representacoes.every(p => p.paisId === 'it'));

        // d) A edição manual é justamente o que morria no recarregamento.
        const rEd = await criarRoteiro(base);
        let alvoF4 = null;
        rEd.dias.forEach((d, i) => (d.blocos || []).forEach((b, j) => {
            if (!alvoF4 && b.tipo === 'atracao') alvoF4 = { i: i, j: j, id: b.atracaoId, nome: b.titulo };
        }));
        Edicao.aplicar(rEd, { tipo: 'remover', dia: alvoF4.i, bloco: alvoF4.j }, { forcar: true });
        const impD = await Transferencia.importar(JSON.parse(JSON.stringify(Transferencia.empacotar(rEd))));
        ok('F4 d) A remoção manual atravessa o arquivo — a atração continua fora do cronograma',
            impD.ok && !Edicao.agendadas(impD.roteiro).has(alvoF4.id), alvoF4.nome);
        ok('F4 d) E continua no painel de descartadas, com o motivo original preservado',
            impD.ok && impD.roteiro.descartadas.some(x => x.atracao.id === alvoF4.id && /manualmente/.test(x.motivo)));
        ok('F4 d) O histórico de edição sobrevive, acrescido do registro da importação',
            impD.ok && impD.roteiro.historico.length >= 2 &&
            /importado/.test(impD.roteiro.historico[impD.roteiro.historico.length - 1].texto));

        // e) Isolamento (§7): o roteiro que volta é outro objeto, e a edição não o segue.
        ok('F4 e) O roteiro importado é instância nova — o id não é herdado, a origem é registrada',
            impD.ok && impD.roteiro.id !== rEd.id && impD.roteiro.importadoDe.id === rEd.id);
        Edicao.garantir(impD.roteiro);
        ok('F4 e) As pilhas de desfazer e refazer não atravessam a importação',
            Edicao.pilha.length === 0 && Edicao.refazerPilha.length === 0);

        // f, g) Arquivo é entrada externa: nada nele é presumido.
        const recA = await Transferencia.importar({ formato: 'outra-coisa', formatoVersao: 1, config: {}, roteiro: {} });
        ok('F4 f) Arquivo de formato estranho é recusado com explicação, não com exceção',
            !recA.ok && /Formato não reconhecido/.test((recA.erros || []).join(' ')));
        const recB = await Transferencia.importar(Object.assign({}, JSON.parse(JSON.stringify(pac)), { formatoVersao: 99 }));
        ok('F4 g) Formato futuro é recusado em vez de adivinhado',
            !recB.ok && /posterior/.test((recB.erros || []).join(' ')));
        const quebrado = JSON.parse(JSON.stringify(pac));
        quebrado.roteiro.dias[0].blocos[0].fim = -10;
        const recC = await Transferencia.importar(quebrado);
        ok('F4 f) Horário inválido no arquivo é barrado antes de virar cronograma',
            !recC.ok && /horários inválidos/.test((recC.erros || []).join(' ')));

        // h) A base é a verdade. Um arquivo antigo não ressuscita preço corrigido.
        const idTarifado = Object.keys(pac.impressaoBase.atracoes).find(id => {
            const a = IDX.atracao(id);
            return a && a.custo && a.custo.tipo === 'CADASTRADO' && a.custo.valor && typeof a.custo.valor === 'object';
        });
        if (!idTarifado) {
            ok('F4 h) Divergência de tarifa — caso disponível', false, 'nenhuma atração tarifada no roteiro de referência');
        } else {
            const aT = IDX.atracao(idTarifado);
            const custoOriginal = aT.custo;
            aT.custo = JSON.parse(JSON.stringify(custoOriginal));
            aT.custo.valor.adulto = (aT.custo.valor.adulto || 0) + 25;
            const impH = await Transferencia.importar(JSON.parse(JSON.stringify(pac)));
            ok('F4 h) Tarifa alterada na base desde a exportação é declarada, não absorvida',
                impH.ok && impH.divergencias.some(d => d.nivel === 'atencao' &&
                    d.titulo === 'Registro alterado desde a exportação: ' + aT.nome), aT.nome);
            ok('F4 h) Prevalece o registro atual — o arquivo não devolve o valor antigo',
                impH.ok && impH.roteiro.ingressos.somaConhecida > rExp.ingressos.somaConhecida,
                U.eur(rExp.ingressos.somaConhecida) + ' → ' + (impH.ok ? U.eur(impH.roteiro.ingressos.somaConhecida) : '—'));
            aT.custo = custoOriginal;
        }

        // i) Identificador inexistente é conflito declarado, não silêncio.
        const adulterado = JSON.parse(JSON.stringify(pac));
        let trocou = false;
        adulterado.roteiro.dias.forEach(d => (d.blocos || []).forEach(b => {
            if (!trocou && b.tipo === 'atracao') { b.atracaoId = 'atracao_que_nunca_existiu'; trocou = true; }
        }));
        const impI = await Transferencia.importar(adulterado);
        ok('F4 i) Identificador fora da curadoria vira conflito declarado no roteiro',
            impI.ok && impI.divergencias.some(d => d.nivel === 'grave' && /fora da curadoria/.test(d.titulo)) &&
            impI.roteiro.conflitos.some(c => c.grave && c.titulo.indexOf('Importação —') === 0));
        ok('F4 i) O bloco planejado é preservado e marcado, em vez de sumir em silêncio',
            impI.ok && impI.roteiro.dias.some(d => (d.blocos || []).some(b => b.semBase === true)));

        // j) A escolha de base atravessa o arquivo. O cenário é Paris, e não Roma: a
        // curadoria só cadastrou uma propriedade para Roma, e trocar exige duas.
        const rHo = await criarRoteiro(Testes.completar(Testes.cenarios[1].cfg));
        const hpMulti = rHo.hospedagens.find(h => (h.opcoes || []).length > 1);
        if (!hpMulti) {
            ok('F4 j) Troca de hospedagem — caso disponível', false, 'nenhuma cidade com duas opções cadastradas');
        } else {
            const outro = hpMulti.opcoes[1].id;
            Edicao.aplicar(rHo, { tipo: 'hotel', cidadeId: hpMulti.cidadeId, hotelId: outro }, { forcar: true });
            const impJ = await Transferencia.importar(JSON.parse(JSON.stringify(Transferencia.empacotar(rHo))));
            ok('F4 j) A base escolhida por você atravessa a exportação',
                impJ.ok && Edicao.hotelEscolhido(impJ.roteiro.hospedagens.find(h => h.cidadeId === hpMulti.cidadeId)) === outro,
                hpMulti.cidadeNome + ' → ' + outro);
        }

        // k) A sobrecamada de destinos declarados viaja junto — sem virar base curada.
        DB.paisesDeclarados.decl_portugal = { id: 'decl_portugal', nome: 'Portugal', bandeira: '🏳️', moeda: null, idioma: null, declarado: true };
        DB.cidadesDeclaradas.push({
            id: 'decl_porto_decl_portugal', paisId: 'decl_portugal', nome: 'Porto', glifo: '✎',
            declarada: true, curada: false, lat: null, lon: null,
            noitesMin: 1, noitesIdeal: 2, noitesMax: 8, perfil: {},
            transporteUrbano: null, aeroportos: [], estacoes: [], bairrosBase: null, resumo: null,
            fonte: 'Declarado por você no formulário'
        });
        const rDeclExp = await criarRoteiro(Testes.completar(Object.assign({}, Testes.cenarios[0].cfg, {
            cidades: [{ id: 'roma', papel: 'entrada_saida', prioridade: 'alta' },
                      { id: 'decl_porto_decl_portugal', papel: 'intermediaria', prioridade: 'normal' }]
        })));
        const pacDecl = JSON.parse(JSON.stringify(Transferencia.empacotar(rDeclExp)));
        ok('F4 k) O pacote leva apenas os destinos declarados que este roteiro usa',
            pacDecl.destinosDeclarados.cidades.length === 1 &&
            pacDecl.destinosDeclarados.cidades[0].id === 'decl_porto_decl_portugal' &&
            !!pacDecl.destinosDeclarados.paises.decl_portugal);
        DB.cidadesDeclaradas.length = 0;
        delete DB.paisesDeclarados.decl_portugal;
        const impK = await Transferencia.importar(pacDecl);
        ok('F4 k) A importação restaura o destino declarado e diz que o restaurou',
            impK.ok && impK.divergencias.some(d => d.nivel === 'nota' && /Destino declarado restaurado/.test(d.titulo)) &&
            DB.cidadesDeclaradas.some(c => c.id === 'decl_porto_decl_portugal'));
        ok('F4 k) O destino restaurado continua declarado, nunca promovido a curado',
            impK.ok && DB.cidadesDeclaradas.every(c => c.curada === false) &&
            !DB.cidades.some(c => c.id === 'decl_porto_decl_portugal') &&
            impK.roteiro.cidades.some(c => c.id === 'decl_porto_decl_portugal' && c.noites > 0));
        DB.cidadesDeclaradas.length = 0;
        delete DB.paisesDeclarados.decl_portugal;
        Transferencia.relatorio = null;
        Transferencia.erro = null;

        // Edição não altera a rota nem aciona reparação automática
        ok('Edição — a reparação automática não atua sobre roteiro editado',
            !rA.validacao || rA.validacao.origem === 'edição manual — sem reparação automática' || rA.validacao.tentativas === 0);

        linhas.forEach(l => console.log((l.ok ? '%c✔ ' : '%c✘ ') + l.n + (l.d ? '  →  ' + l.d : ''), 'color:' + (l.ok ? '#4fd1c5' : '#ef767a')));
        const passou = linhas.filter(l => l.ok).length;
        console.log('%c' + passou + '/' + linhas.length + ' verificações aprovadas', 'color:#f2b134;font-weight:bold');
        console.groupEnd();
        limparRoteiroAnterior();
        document.getElementById('formStatus').innerHTML = 'Arnês de testes: <strong>' + passou + '/' + linhas.length + '</strong> verificações aprovadas — detalhes no console.';
        return { passou, total: linhas.length, linhas };
    }
};

document.addEventListener('DOMContentLoaded', App.iniciar);
</script>
