name: Claude Issue Assistant

on:
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]

jobs:
  claude-response:
    # Roda apenas se a Issue tiver a tag 'claude' ou contiver '/claude' nos comentários
    if: |
      contains(github.event.issue.labels.*.name, 'claude') ||
      contains(github.event.comment.body, '/claude')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude CLI & Dependencies
        run: |
          npm install -g @anthropic-ai/claude-code

      - name: Run Claude Code on Issue
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          # Define o nome da nova branch
          BRANCH_NAME="claude/issue-${ISSUE_NUMBER}"
          git config user.name "Claude Bot"
          git config user.email "claude-bot@users.noreply.github.com"
          git checkout -b $BRANCH_NAME

          # Executa a CLI do Claude para aplicar a mudança baseada na Issue
          claude --print "Resolva a seguinte Issue do repositório: '$ISSUE_TITLE'. Detalhes: '$ISSUE_BODY'"

          # Verifica se o Claude fez alterações
          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "fix: resolução automática para issue #${ISSUE_NUMBER} via Claude"
            git push origin $BRANCH_NAME

            # Cria o Pull Request via GitHub CLI
            gh pr create \
              --title "fix: $ISSUE_TITLE (via Claude)" \
              --body "Este PR foi gerado automaticamente pelo Claude para resolver a Issue #${ISSUE_NUMBER}." \
              --head $BRANCH_NAME \
              --base main
          else
            echo "Nenhuma alteração de código gerada pelo Claude."
          fi